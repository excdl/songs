<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTV 點歌系統 - 據點驗證登入</title>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
<style>
html { font-size: 130%; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
  background: radial-gradient(circle at top, #24104d 0%, #0b0b16 45%, #050509 100%);
  color: #fff;
  min-height: 100vh;
}

/* 🔒 據點驗證全螢幕遮罩層 */
#authOverlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 5, 9, 0.96);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(12px);
  transition: opacity 0.4s ease;
}
.auth-card {
  background: #171725;
  border: 1px solid #343449;
  border-radius: 20px;
  padding: 35px 25px;
  width: 100%;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.7);
}
.auth-title {
  font-size: 1.4rem;
  font-weight: bold;
  margin-bottom: 12px;
  background: linear-gradient(90deg, #ff2bd6, #8c5cff, #22d3ee);
  -webkit-background-clip: text;
  color: transparent;
}
.auth-desc {
  color: #bbb;
  font-size: 0.92rem;
  margin-bottom: 24px;
  line-height: 1.6;
}
.auth-spinner {
  width: 45px;
  height: 45px;
  border: 4px solid rgba(255,255,255,0.1);
  border-top-color: #ff2bd6;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.auth-btn {
  width: 100%;
  height: 48px;
  border-radius: 12px;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  color: white;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 1rem;
  margin-top: 15px;
  transition: opacity 0.2s;
}
.auth-btn:hover { opacity: 0.9; }
.auth-error {
  color: #ff4d6d;
  font-size: 0.88rem;
  margin-top: 15px;
  white-space: pre-line;
  line-height: 1.5;
}

/* 系統主介面樣式 */
header {
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  background: rgba(10,10,20,.92);
  border-bottom: 1px solid rgba(255,255,255,.08);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.logo {
  font-size: 1.35rem;
  font-weight: bold;
  background: linear-gradient(90deg, #ff2bd6, #8c5cff, #22d3ee);
  -webkit-background-clip: text;
  color: transparent;
}
main { max-width: 1400px; margin: auto; padding: 25px; }
.empty { color: #777; text-align: center; padding: 40px 10px; font-size: 0.95rem; }
.toast {
  position: fixed; left: 50%; bottom: 30px;
  transform: translateX(-50%) translateY(20px);
  background: #242435; color: white; padding: 12px 20px;
  border-radius: 30px; opacity: 0; pointer-events: none; transition: .3s; z-index: 9999; font-size: 0.9rem;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- 🔒 據點安全性驗證遮罩 -->
<div id="authOverlay">
  <div class="auth-card">
    <div class="auth-title">🎤 據點安全驗證</div>
    <div class="auth-desc" id="authDesc">正在取得您的 GPS 定位，請允許瀏覽器權限...</div>
    <div class="auth-spinner" id="authSpinner"></div>
    <div class="auth-error" id="authError"></div>
    <button class="auth-btn" id="retryAuthBtn" style="display:none;" onclick="checkLocationAuth()">重新驗證據點</button>
  </div>
</div>

<header>
  <div class="logo">🎤 KTV 點歌系統</div>
</header>
<main>
  <div class="empty">系統驗證通過，KTV 點歌介面載入完成！</div>
</main>

<div class="toast" id="toast"></div>

<script>
const API_URL = "您的_APPS_SCRIPT_WEB_APP_URL"; // 👈 請替換成您部署後的網址

// 網頁載入時自動啟動驗證
window.addEventListener("DOMContentLoaded", () => {
  checkLocationAuth();
});

function checkLocationAuth() {
  const descEl = document.getElementById("authDesc");
  const spinnerEl = document.getElementById("authSpinner");
  const errorEl = document.getElementById("authError");
  const retryBtn = document.getElementById("retryAuthBtn");

  descEl.textContent = "正在取得您的 GPS 位置...";
  spinnerEl.style.display = "block";
  errorEl.textContent = "";
  retryBtn.style.display = "none";

  if (!navigator.geolocation) {
    authFailed("您的瀏覽器不支援地理定位功能，無法使用本系統。");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async (position) => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      
      descEl.textContent = "定位成功，正在比對公司據點範圍...";

      try {
        const query = new URLSearchParams({ action: "verifyLocation", lat, lng });
        const res = await fetch(`${API_URL}?${query.toString()}`);
        const result = await res.json();

        if (result.success && result.rangeStatus === "有效打卡區") {
          // 驗證成功，淡出遮罩
          document.getElementById("authOverlay").style.opacity = "0";
          setTimeout(() => {
            document.getElementById("authOverlay").style.display = "none";
            showToast("📍 據點驗證成功，歡迎使用！");
          }, 400);
        } else {
          authFailed(`❌ 驗證未通過：您目前不在有效公司據點內。\n最近據點：${result.companyName} (距離 ${result.distance}公尺)`);
        }
      } catch (err) {
        authFailed("無法連線至後端伺服器進行驗證，請檢查網路狀態。");
      }
    },
    (error) => {
      let msg = "無法取得 GPS 定位。";
      if (error.code === error.PERMISSION_DENIED) {
        msg = "您拒絕了瀏覽器定位權限，請於瀏覽器設定中開啟定位後重新整理。";
      } else if (error.code === error.POSITION_UNAVAILABLE) {
        msg = "無法取得目前裝置的位置資訊。";
      } else if (error.code === error.TIMEOUT) {
        msg = "GPS 定位逾時，請至收訊良好的地方重試。";
      }
      authFailed(msg);
    },
    { timeout: 10000, maximumAge: 0, enableHighAccuracy: true }
  );
}

function authFailed(message) {
  document.getElementById("authDesc").textContent = "存取受阻";
  document.getElementById("authSpinner").style.display = "none";
  document.getElementById("authError").textContent = message;
  document.getElementById("retryAuthBtn").style.display = "block";
}

let toastTimer;
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove("show"); }, 2500);
}
</script>
</body>
</html>
