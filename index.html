<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTV 點歌系統</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
  background: radial-gradient(circle at top, #24104d 0%, #0b0b16 45%, #050509 100%);
  color: white;
  min-height: 100vh;
}
header {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  background: rgba(10,10,20,.92);
  border-bottom: 1px solid rgba(255,255,255,.08);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.logo {
  font-size: 24px;
  font-weight: bold;
  background: linear-gradient(90deg, #ff2bd6, #8c5cff, #22d3ee);
  -webkit-background-clip: text;
  color: transparent;
}
.header-buttons {
  display: flex;
  gap: 10px;
}
.header-btn {
  border: 1px solid #38384c;
  background: #171725;
  color: white;
  padding: 10px 15px;
  border-radius: 10px;
  cursor: pointer;
}
.header-btn:hover {
  background: #29293d;
}
.room-info {
  color: #aaa;
  font-size: 14px;
}
.room-code {
  color: white;
  font-weight: bold;
}
main {
  max-width: 1400px;
  margin: auto;
  padding: 25px;
}
.customer-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding: 15px;
  border-radius: 15px;
  background: rgba(25,25,38,.8);
  border: 1px solid rgba(255,255,255,.08);
}
.customer-info {
  flex: 1;
}
.customer-name {
  font-weight: bold;
  font-size: 16px;
}
.customer-code {
  color: #999;
  font-size: 13px;
  margin-top: 4px;
}
.customer-btn {
  border: none;
  border-radius: 10px;
  padding: 10px 15px;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  color: white;
  cursor: pointer;
  font-weight: bold;
}
.search-area {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}
.search-box {
  flex: 1;
  position: relative;
}
.search-box input {
  width: 100%;
  height: 52px;
  border: 1px solid #38384c;
  border-radius: 14px;
  padding: 0 20px 0 48px;
  background: #151522;
  color: white;
  outline: none;
  font-size: 16px;
}
.search-icon {
  position: absolute;
  left: 18px;
  top: 15px;
  font-size: 20px;
  color: #999;
}
.search-btn {
  width: 100px;
  border-radius: 14px;
  background: linear-gradient(135deg, #ff2bd6, #734cff);
  color: white;
  font-weight: bold;
  font-size: 15px;
  border: none;
  cursor: pointer;
}
.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  margin-bottom: 25px;
  padding-bottom: 5px;
}
.category {
  flex-shrink: 0;
  padding: 9px 18px;
  border-radius: 30px;
  background: #171725;
  color: #aaa;
  border: 1px solid #2d2d3d;
  cursor: pointer;
}
.category.active {
  color: white;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  border-color: transparent;
}
.content {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 25px;
}
.section-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 18px;
}
.song-list {
  display: grid;
  gap: 12px;
}
.song {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 14px;
  border: 1px solid rgba(255,255,255,.07);
  background: rgba(25,25,38,.75);
  border-radius: 15px;
}
.cover {
  width: 64px;
  height: 64px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 25px;
  background: linear-gradient(135deg, #ff2bd6, #653eff);
}
.song-info {
  flex: 1;
  min-width: 0;
}
.song-title {
  font-size: 17px;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.artist {
  color: #999;
  font-size: 14px;
  margin-top: 6px;
}
.song-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.favorite {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: #292938;
  color: #aaa;
  font-size: 18px;
  border: none;
  cursor: pointer;
}
.favorite.active {
  color: #ff3e91;
}
.add-btn {
  padding: 10px 15px;
  border-radius: 10px;
  color: white;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  font-weight: bold;
  border: none;
  cursor: pointer;
}
.queue-panel {
  background: rgba(18,18,29,.9);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 18px;
  padding: 20px;
  height: fit-content;
  position: sticky;
  top: 95px;
}
.queue-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}
.queue-count {
  color: #aaa;
  font-size: 13px;
}
.queue-list {
  display: grid;
  gap: 10px;
}
.queue-item {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 11px;
  border-radius: 12px;
  background: #20202e;
}
.queue-number {
  width: 28px;
  color: #8d7aff;
  font-weight: bold;
  text-align: center;
}
.queue-info {
  flex: 1;
  min-width: 0;
}
.queue-title {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 14px;
}
.queue-artist {
  font-size: 12px;
  color: #888;
  margin-top: 3px;
}
.remove-btn {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  color: #888;
  background: transparent;
  border: none;
  font-size: 18px;
  cursor: pointer;
}
.player {
  margin-top: 18px;
  background: linear-gradient(135deg, #251040, #111126);
  border-radius: 16px;
  padding: 18px;
}
.now-playing {
  color: #aaa;
  font-size: 12px;
  margin-bottom: 5px;
}
.current-title {
  font-size: 17px;
  font-weight: bold;
}
.current-artist {
  font-size: 13px;
  color: #888;
  margin-top: 3px;
}
.player-controls {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}
.control-btn {
  flex: 1;
  height: 40px;
  border-radius: 10px;
  background: #29293a;
  color: white;
  border: none;
  cursor: pointer;
}
.play-btn {
  background: linear-gradient(135deg, #ff2bd6, #744cff);
}
audio {
  width: 100%;
  margin-top: 12px;
}
.empty {
  color: #777;
  text-align: center;
  padding: 30px 10px;
  font-size: 14px;
}
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}
.modal.show {
  display: flex;
}
.modal-box {
  width: 90%;
  max-width: 480px;
  background: #181824;
  border: 1px solid #38384c;
  border-radius: 18px;
  padding: 25px;
}
.modal-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 20px;
}
.form-group {
  margin-bottom: 15px;
}
.form-group label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  height: 44px;
  border: 1px solid #38384c;
  background: #10101a;
  color: white;
  border-radius: 10px;
  padding: 0 12px;
  outline: none;
}
.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.modal-buttons button {
  flex: 1;
  height: 44px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}
.primary {
  color: white;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
}
.secondary {
  background: #292938;
  color: white;
}
.customer-results {
  margin-top: 15px;
  display: grid;
  gap: 8px;
}
.customer-result {
  padding: 12px;
  border-radius: 10px;
  background: #252534;
  cursor: pointer;
}
.customer-result:hover {
  background: #34344a;
}
.history-list {
  margin-top: 15px;
  max-height: 300px;
  overflow-y: auto;
  display: grid;
  gap: 8px;
}
.history-item {
  padding: 10px;
  border-radius: 10px;
  background: #222231;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%) translateY(20px);
  background: #242435;
  color: white;
  padding: 12px 20px;
  border-radius: 30px;
  opacity: 0;
  pointer-events: none;
  transition: .3s;
  z-index: 9999;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
@media(max-width:900px) {
  .content {
    grid-template-columns: 1fr;
  }
  .queue-panel {
    position: static;
  }
}
</style>
</head>
<body>
<header>
  <div class="logo">🎤 KTV 點歌系統</div>
  <div class="header-buttons">
    <button class="header-btn" onclick="openCustomerModal()">👤 新增／搜尋客戶</button>
  </div>
  <div class="room-info">包廂：<span class="room-code">A-208</span></div>
</header>
<main>
  <div class="customer-bar">
    <div class="customer-info">
      <div class="customer-name" id="customerName">尚未選擇客戶</div>
      <div class="customer-code" id="customerCode">點擊「新增／搜尋客戶」</div>
    </div>
    <button class="customer-btn" onclick="openCustomerModal()">客戶</button>
  </div>
  <div class="search-area">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="輸入歌名、歌手或歌號搜尋...">
    </div>
    <button class="search-btn" onclick="fetchSongs()">搜尋</button>
  </div>
  <div class="categories">
    <button class="category active" onclick="filterLanguage('全部',this)">全部</button>
    <button class="category" onclick="filterLanguage('國語',this)">國語</button>
    <button class="category" onclick="filterLanguage('台語',this)">台語</button>
    <button class="category" onclick="filterLanguage('粵語',this)">粵語</button>
    <button class="category" onclick="filterLanguage('英文',this)">英文</button>
    <button class="category" onclick="filterLanguage('日文',this)">日文</button>
  </div>
  <div class="content">
    <section>
      <div class="section-title">🎵 雲端歌曲列表</div>
      <div class="song-list" id="songList">
        <div class="empty">請輸入關鍵字搜尋歌曲</div>
      </div>
    </section>
    <aside class="queue-panel">
      <div class="queue-header">
        <div class="section-title">📋 待播歌曲</div>
        <div class="queue-count" id="queueCount">0 首</div>
      </div>
      <div class="queue-list" id="queueList"></div>
      <div class="player">
        <div class="now-playing">NOW PLAYING</div>
        <div class="current-title" id="currentTitle">尚未播放</div>
        <div class="current-artist" id="currentArtist">-</div>
        <audio id="audioPlayer" controls></audio>
        <div class="player-controls">
          <button class="control-btn play-btn" onclick="playCurrent()">▶ 播放</button>
          <button class="control-btn" onclick="nextSong()">⏭ 下一首</button>
        </div>
      </div>
    </aside>
  </div>
</main>
<div class="modal" id="customerModal">
  <div class="modal-box">
    <div class="modal-title">👤 客戶管理</div>
    <div class="form-group">
      <label>搜尋客戶代碼／姓名／電話</label>
      <input type="text" id="customerSearch" placeholder="例如 C000001 或 王先生">
    </div>
    <div class="customer-results" id="customerResults"></div>
    <hr style="border-color:#30303d; margin:20px 0;">
    <div class="modal-title">➕ 新增客戶</div>
    <div class="form-group">
      <label>客戶名稱</label>
      <input id="newCustomerName" placeholder="例如：王先生">
    </div>
    <div class="form-group">
      <label>電話</label>
      <input id="newCustomerPhone" placeholder="電話">
    </div>
    <div class="form-group">
      <label>備註</label>
      <input id="newCustomerNote" placeholder="備註">
    </div>
    <div class="modal-buttons">
      <button class="secondary" onclick="closeCustomerModal()">關閉</button>
      <button class="primary" onclick="createCustomer()">建立客戶</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzj14gtjjgWnF-9ispT2fsB7N8jXxclmZoVKWMeo-ypToR-T9QpmYXO7kUgiuKmhaiK3w/exec";

let allSongs = [];
let currentLanguage = "全部";
let queue = JSON.parse(localStorage.getItem("ktvQueue")) || [];
let favorites = JSON.parse(localStorage.getItem("ktvFavorites")) || [];
let currentSong = null;
let currentCustomer = JSON.parse(localStorage.getItem("ktvCustomer")) || null;

window.addEventListener("DOMContentLoaded", () => {
  renderCustomer();
  renderQueue();
  fetchSongs();
});

async function fetchSongs() {
  const keyword = document.getElementById("searchInput").value.trim();
  const params = new URLSearchParams({ action: "search", q: keyword, language: currentLanguage });
  const url = API_URL + "?" + params.toString();
  const list = document.getElementById("songList");
  list.innerHTML = `<div class="empty">搜尋中...</div>`;

  try {
    const response = await fetch(url);
    const result = await response.json();
    if (!result.success) throw new Error(result.message);

    allSongs = result.data.map(item => ({
      brand: item["品牌"],
      song_no: item["歌號"],
      title: item["歌名"],
      artist: item["歌手"],
      language: item["語言"],
      category: item["分類"],
      status: item["狀態"],
      media: "music/" + item["歌名"] + ".mp3"
    }));

    renderSongList();
  } catch(error) {
    console.error(error);
    list.innerHTML = `<div class="empty">無法取得歌曲資料</div>`;
    showToast("歌曲資料取得失敗");
  }
}

function renderSongList() {
  const list = document.getElementById("songList");
  if (allSongs.length === 0) {
    list.innerHTML = `<div class="empty">找不到符合的歌曲</div>`;
    return;
  }

  list.innerHTML = allSongs.map(song => {
    const isFavorite = favorites.includes(String(song.song_no));
    return `
      <div class="song">
        <div class="cover">🎤</div>
        <div class="song-info">
          <div class="song-title">[${escapeHtml(song.song_no)}] ${escapeHtml(song.title)}</div>
          <div class="artist">${escapeHtml(song.artist)} · ${escapeHtml(song.language || "未分類")}${song.brand ? " · " + escapeHtml(song.brand) : ""}</div>
        </div>
        <div class="song-actions">
          <button class="favorite ${isFavorite ? "active" : ""}" onclick="toggleFavorite('${escapeAttr(song.song_no)}')">${isFavorite ? "♥" : "♡"}</button>
          <button class="add-btn" onclick="addSong('${escapeAttr(song.song_no)}')">＋ 點歌</button>
        </div>
      </div>
    `;
  }).join("");
}

function filterLanguage(language, button) {
  currentLanguage = language;
  document.querySelectorAll(".category").forEach(btn => btn.classList.remove("active"));
  button.classList.add("active");
  fetchSongs();
}

let searchTimer;
document.getElementById("searchInput").addEventListener("input", function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(fetchSongs, 350);
});

function addSong(songNo) {
  const song = allSongs.find(s => String(s.song_no) === String(songNo));
  if (!song) return;

  queue.push({ ...song, queueId: Date.now() + Math.random() });
  saveQueue();
  renderQueue();
  showToast(`已點歌：${song.title}`);
}

function renderQueue() {
  const list = document.getElementById("queueList");
  const count = document.getElementById("queueCount");
  count.textContent = `${queue.length} 首`;

  if (queue.length === 0) {
    list.innerHTML = `<div class="empty">目前沒有待播歌曲</div>`;
    return;
  }

  list.innerHTML = queue.map((song, index) => `
    <div class="queue-item">
      <div class="queue-number">${index + 1}</div>
      <div class="queue-info">
        <div class="queue-title">[${escapeHtml(song.song_no)}] ${escapeHtml(song.title)}</div>
        <div class="queue-artist">${escapeHtml(song.artist)}</div>
      </div>
      <button class="remove-btn" onclick="removeSong(${song.queueId})">×</button>
    </div>
  `).join("");
}

function removeSong(queueId) {
  queue = queue.filter(song => song.queueId !== queueId);
  saveQueue();
  renderQueue();
  showToast("已移除歌曲");
}

function saveQueue() {
  localStorage.setItem("ktvQueue", JSON.stringify(queue));
}

function playCurrent() {
  if (!currentSong) {
    if (queue.length === 0) {
      showToast("目前沒有待播歌曲");
      return;
    }
    currentSong = queue[0];
  }

  const player = document.getElementById("audioPlayer");
  player.src = currentSong.media;
  document.getElementById("currentTitle").textContent = `[${currentSong.song_no}] ${currentSong.title}`;
  document.getElementById("currentArtist").textContent = currentSong.artist;
  player.play().catch(() => {
    showToast("找不到音樂檔案");
  });
}

function nextSong() {
  if (queue.length === 0) {
    currentSong = null;
    document.getElementById("currentTitle").textContent = "尚未播放";
    document.getElementById("currentArtist").textContent = "-";
    return;
  }
  currentSong = queue.shift();
  saveQueue();
  renderQueue();
  playCurrent();
}

document.getElementById("audioPlayer").addEventListener("ended", nextSong);

function toggleFavorite(songNo) {
  const code = String(songNo);
  if (favorites.includes(code)) {
    favorites = favorites.filter(item => item !== code);
    showToast("已取消收藏");
  } else {
    favorites.push(code);
    showToast("已加入收藏");
  }
  localStorage.setItem("ktvFavorites", JSON.stringify(favorites));
  renderSongList();
}

function openCustomerModal() {
  document.getElementById("customerModal").classList.add("show");
  document.getElementById("customerSearch").focus();
}

function closeCustomerModal() {
  document.getElementById("customerModal").classList.remove("show");
}

let customerTimer;
document.getElementById("customerSearch").addEventListener("input", function() {
  clearTimeout(customerTimer);
  customerTimer = setTimeout(searchCustomer, 300);
});

async function searchCustomer() {
  const keyword = document.getElementById("customerSearch").value.trim();
  const resultBox = document.getElementById("customerResults");
  if (!keyword) {
    resultBox.innerHTML = "";
    return;
  }

  try {
    const url = API_URL + "?action=customerSearch&q=" + encodeURIComponent(keyword);
    const response = await fetch(url);
    const result = await response.json();
    if (!result.success) return;

    resultBox.innerHTML = result.data.map(customer => `
      <div class="customer-result" onclick="selectCustomer('${escapeAttr(customer["客戶代碼"])}', '${escapeAttr(customer["客戶名稱"])}')">
        <b>${escapeHtml(customer["客戶代碼"])}</b> - ${escapeHtml(customer["客戶名稱"])}
        <br>
        <small>${escapeHtml(customer["電話"] || "")}</small>
      </div>
    `).join("");
  } catch(error) {
    console.error(error);
  }
}

async function selectCustomer(code, name) {
  currentCustomer = { code: code, name: name };
  localStorage.setItem("ktvCustomer", JSON.stringify(currentCustomer));
  renderCustomer();
  closeCustomerModal();
  showToast(`已選擇客戶：${name}`);
  await loadCustomerHistory(code);
}

function renderCustomer() {
  const name = document.getElementById("customerName");
  const code = document.getElementById("customerCode");
  if (!currentCustomer) {
    name.textContent = "尚未選擇客戶";
    code.textContent = "請新增或搜尋客戶";
    return;
  }
  name.textContent = currentCustomer.name;
  code.textContent = `客戶代碼：${currentCustomer.code}`;
}

async function createCustomer() {
  const name = document.getElementById("newCustomerName").value.trim();
  const phone = document.getElementById("newCustomerPhone").value.trim();
  const note = document.getElementById("newCustomerNote").value.trim();

  if (!name) {
    showToast("請輸入客戶名稱");
    return;
  }

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "createCustomer", name: name, phone: phone, note: note })
    });
    const result = await response.json();
    if (!result.success) throw new Error(result.message);

    const customer = result.customer;
    currentCustomer = { code: customer["客戶代碼"], name: customer["客戶名稱"] };
    localStorage.setItem("ktvCustomer", JSON.stringify(currentCustomer));
    renderCustomer();

    document.getElementById("newCustomerName").value = "";
    document.getElementById("newCustomerPhone").value = "";
    document.getElementById("newCustomerNote").value = "";
    closeCustomerModal();
    showToast(`客戶建立成功：${customer["客戶代碼"]}`);
  } catch(error) {
    console.error(error);
    showToast("新增客戶失敗");
  }
}

async function loadCustomerHistory(customerCode) {
  try {
    const url = API_URL + "?action=history&customerCode=" + encodeURIComponent(customerCode);
    const response = await fetch(url);
    const result = await response.json();
    if (!result.success || result.data.length === 0) return;

    const yes = confirm(`找到 ${result.data.length} 首歷史歌曲，是否全部加入待播？`);
    if (!yes) return;

    result.data.forEach(song => {
      queue.push({
        song_no: song["歌號"],
        title: song["歌名"],
        artist: song["歌手"],
        language: "",
        media: "music/" + song["歌名"] + ".mp3",
        queueId: Date.now() + Math.random()
      });
    });

    saveQueue();
    renderQueue();
    showToast("歷史歌單已載入");
  } catch(error) {
    console.error(error);
    showToast("歷史歌單載入失敗");
  }
}

async function saveCurrentHistory() {
  if (!currentCustomer) {
    showToast("尚未選擇客戶");
    return;
  }
  if (queue.length === 0) {
    showToast("目前沒有點歌紀錄");
    return;
  }

  try {
    const songs = queue.map(song => ({ songNo: song.song_no, title: song.title, artist: song.artist }));
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "saveHistory", customerCode: currentCustomer.code, songs: songs })
    });
    const result = await response.json();
    if (!result.success) throw new Error(result.message);
    showToast("歷史歌單已儲存");
  } catch(error) {
    console.error(error);
    showToast("歷史歌單儲存失敗");
  }
}

document.getElementById("customerModal").addEventListener("click", function(e) {
  if (e.target === this) closeCustomerModal();
});

let toastTimer;
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2000);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttr(value) {
  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, "&quot;");
}
