<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTV 點歌系統</title>
<style>
/* 字體設定：比前次放大50%再縮小20%（約為 1.2 倍基礎字體） */
html {
  font-size: 130%;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
  background: radial-gradient(circle at top, #24104d 0%, #0b0b16 45%, #050509 100%);
  color: #fff;
  min-height: 100vh;
}
header {
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  background: rgba(10,10,20,.92);
  border-bottom: 1px solid rgba(255,255,255,.08);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.logo {
  font-size: 1.35rem;
  font-weight: bold;
  background: linear-gradient(90deg, #ff2bd6, #8c5cff, #22d3ee);
  -webkit-background-clip: text;
  color: transparent;
}
.customer-area { display: flex; align-items: center; gap: 10px; }
.customer-info { color: #bbb; font-size: 0.85rem; }
.customer-name { color: white; font-weight: bold; }
.customer-btn {
  background: #29293a;
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid #3a3a4d;
  cursor: pointer;
  font-size: 0.85rem;
}
.customer-btn:hover { background: #3b3b50; }
main { max-width: 1400px; margin: auto; padding: 25px; }
.search-area { margin-bottom: 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.search-box { position: relative; flex: 1; min-width: 250px; }
.search-box input {
  width: 100%;
  height: 52px;
  border: 1px solid #38384c;
  border-radius: 12px;
  padding: 0 20px 0 48px;
  background: #151522;
  color: white;
  outline: none;
  font-size: 1rem;
}
.search-box input:focus { border-color: #9b5cff; box-shadow: 0 0 0 3px rgba(155,92,255,.15); }
.search-icon { position: absolute; left: 18px; top: 15px; font-size: 1.1rem; color: #999; }

/* 排序選單樣式 */
.sort-box select {
  height: 52px;
  padding: 0 16px;
  border-radius: 12px;
  border: 1px solid #38384c;
  background: #151522;
  color: white;
  outline: none;
  font-size: 0.95rem;
  cursor: pointer;
}
.sort-box select:focus { border-color: #9b5cff; }

.categories { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 25px; padding-bottom: 5px; }
.category {
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 30px;
  background: #171725;
  color: #aaa;
  border: 1px solid #2d2d3d;
  cursor: pointer;
  font-size: 0.9rem;
}
.category.active { color: white; background: linear-gradient(135deg, #ff2bd6, #744cff); border-color: transparent; }
.content { display: grid; grid-template-columns: 1fr 420px; gap: 25px; }
.section-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 16px; }
.song-list { display: grid; gap: 12px; }

/* 統一歌曲、待播、歷史項目的卡片風格 */
.song {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  border: 1px solid rgba(255,255,255,.07);
  background: rgba(25,25,38,.75);
  border-radius: 14px;
  transition: .2s;
}
.song:hover { background: #222235; transform: translateY(-1px); }
.cover {
  width: 56px;
  height: 56px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 1.3rem;
  background: linear-gradient(135deg, #ff2bd6, #653eff);
}
.song-info { flex: 1; min-width: 0; }
.song-title { font-size: 1rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.artist { color: #999; font-size: 0.85rem; margin-top: 4px; }
.song-actions { display: flex; gap: 8px; align-items: center; }

.favorite { width: 38px; height: 38px; border-radius: 10px; background: #292938; color: #aaa; font-size: 1.1rem; cursor: pointer; border: none; }
.favorite.active { color: #ff3e91; }
.add-btn {
  padding: 8px 14px;
  border-radius: 9px;
  color: white;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 0.85rem;
}

.queue-panel {
  background: rgba(18,18,29,.9);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 18px;
  padding: 20px;
  height: fit-content;
  position: sticky;
  top: 95px;
}
.queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.queue-count { color: #aaa; font-size: 0.85rem; }
.queue-list { display: grid; gap: 10px; max-height: 380px; overflow-y: auto; }

/* 待播歌曲項目：與歌曲列表一致的內容結構 */
.queue-item { display: flex; align-items: center; gap: 10px; }
.queue-number { width: 26px; color: #8d7aff; font-weight: bold; text-align: center; font-size: 0.95rem; }
.remove-btn { width: 32px; height: 32px; border-radius: 8px; color: #888; background: transparent; font-size: 1.2rem; border: none; cursor: pointer; }

.player {
  margin-top: 18px;
  background: linear-gradient(135deg, #251040, #111126);
  border-radius: 16px;
  padding: 16px;
}
.now-playing { color: #aaa; font-size: 0.75rem; margin-bottom: 4px; }
.current-title { font-size: 1rem; font-weight: bold; }
.current-artist { font-size: 0.85rem; color: #888; margin-top: 3px; }
audio { width: 100%; margin-top: 10px; }
.player-controls { display: flex; gap: 8px; margin-top: 12px; }
.control-btn { flex: 1; height: 40px; border-radius: 9px; background: #29293a; color: white; border: none; cursor: pointer; font-size: 0.9rem; }
.play-btn { background: linear-gradient(135deg, #ff2bd6, #744cff); }
.volume { margin-top: 10px; }
.volume input { width: 100%; }
.end-service {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border-radius: 9px;
  background: linear-gradient(135deg, #e43b62, #9b2f80);
  color: white;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
}
.empty { color: #777; text-align: center; padding: 25px 10px; font-size: 0.9rem; }
.toast {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%) translateY(20px);
  background: #242435;
  color: white;
  padding: 12px 20px;
  border-radius: 30px;
  opacity: 0;
  pointer-events: none;
  transition: .3s;
  z-index: 9999;
  font-size: 0.9rem;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 500;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal.show { display: flex; }
.modal-box {
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  background: #171725;
  border: 1px solid #343449;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-size: 1.1rem; font-weight: bold; }
.close-btn { width: 35px; height: 35px; border-radius: 8px; background: #292938; color: white; font-size: 1.1rem; border: none; cursor: pointer; }
.modal-input {
  width: 100%;
  height: 45px;
  padding: 0 14px;
  border-radius: 9px;
  border: 1px solid #3a3a4d;
  background: #10101a;
  color: white;
  outline: none;
  margin-bottom: 12px;
  font-size: 0.95rem;
}
.modal-input:focus { border-color: #9b5cff; }
.primary-btn {
  width: 100%;
  height: 45px;
  border-radius: 9px;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  color: white;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
}
.secondary-btn {
  width: 100%;
  height: 45px;
  border-radius: 9px;
  background: #292938;
  color: white;
  margin-top: 10px;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
}
.customer-result { display: grid; gap: 10px; margin-top: 15px; }
.customer-card { padding: 14px; background: #222235; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.customer-card-name { font-weight: bold; font-size: 1rem; }
.customer-card-info { color: #888; font-size: 0.8rem; margin-top: 4px; }
.select-customer {
  padding: 8px 14px;
  border-radius: 8px;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  color: white;
  flex-shrink: 0;
  border: none;
  cursor: pointer;
  font-size: 0.85rem;
}
.history-list { display: grid; gap: 10px; margin-top: 15px; }
@media(max-width:900px) {
  .content { grid-template-columns: 1fr; }
  .queue-panel { position: static; }
  header { padding: 0 15px; }
  .logo { font-size: 1.1rem; }
  .customer-info { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="logo">🎤 KTV 點歌系統</div>
  <div class="customer-area">
    <div class="customer-info" id="customerInfo">尚未選擇客戶</div>
    <button class="customer-btn" onclick="openCustomerModal()">👤 新增／選擇客戶</button>
    <button class="customer-btn" id="clearCustomerBtn" style="display:none" onclick="clearCustomer()">清除</button>
  </div>
</header>

<main>
  <div class="search-area">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="輸入歌名、歌手或歌號..." autocomplete="off">
    </div>
    <div class="sort-box">
      <select id="sortSelect" onchange="renderSongList()">
        <option value="default">預設排序</option>
        <option value="title_len_asc">歌名字數：少 ➔ 多</option>
        <option value="title_len_desc">歌名字數：多 ➔ 少</option>
        <option value="artist_len_asc">歌手字數：少 ➔ 多</option>
        <option value="artist_len_desc">歌手字數：多 ➔ 少</option>
      </select>
    </div>
  </div>

  <div class="categories" id="categoryContainer">
    <button class="category active" onclick="filterLanguage('全部', this)">全部</button>
  </div>

  <div class="content">
    <section>
      <div class="section-title">🎵 歌曲列表</div>
      <div class="song-list" id="songList">
        <div class="empty">請輸入歌名、歌手或歌號開始搜尋</div>
      </div>
    </section>

    <aside class="queue-panel">
      <div class="queue-header">
        <div class="section-title">📋 待播歌曲</div>
        <div class="queue-count" id="queueCount">0 首</div>
      </div>
      <div class="queue-list" id="queueList"></div>

      <div class="player">
        <div class="now-playing">NOW PLAYING</div>
        <div class="current-title" id="currentTitle">尚未播放</div>
        <div class="current-artist" id="currentArtist">-</div>
        <audio id="audioPlayer" controls></audio>
        <div class="player-controls">
          <button class="control-btn play-btn" onclick="playCurrent()">▶ 播放</button>
          <button class="control-btn" onclick="nextSong()">⏭ 下一首</button>
        </div>
        <div class="volume">
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
        </div>
        <button class="end-service" onclick="endService()">🔚 結束本次服務</button>
      </div>
    </aside>
  </div>
</main>

<div class="modal" id="customerModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">👤 客戶管理</div>
      <button class="close-btn" onclick="closeCustomerModal()">×</button>
    </div>
    <input class="modal-input" id="customerSearch" placeholder="請輸入客戶姓名搜尋..." autocomplete="off">
    <div class="customer-result" id="customerResults">
      <div class="empty">請輸入客戶姓名</div>
    </div>
    <button class="secondary-btn" onclick="showCreateCustomer()">＋ 新增客戶</button>
    <div id="createCustomerArea" style="display:none;margin-top:20px">
      <div style="color:#aaa;margin-bottom:8px;font-size:0.85rem;">新增客戶</div>
      <input class="modal-input" id="newCustomerName" placeholder="客戶姓名">
      <input class="modal-input" id="newCustomerPhone" placeholder="電話（選填）">
      <input class="modal-input" id="newCustomerNote" placeholder="備註（選填）">
      <button class="primary-btn" onclick="createCustomer()">建立客戶</button>
    </div>
  </div>
</div>

<div class="modal" id="historyModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">📜 歷史歌單</div>
      <button class="close-btn" onclick="closeHistoryModal()">×</button>
    </div>
    <div id="historyCustomerName" style="color:#aaa;margin-bottom:10px;font-size:0.9rem;"></div>
    <div class="history-list" id="historyList">
      <div class="empty">載入中...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyrYhsRlIZ7Wn4i1HikEjG-QP77HvfpGVhL5LafiBLnogeXVvo_gayC_6bnaSJaZySUnw/exec";

let allSongs = [];
let currentLanguage = "全部";
let currentCustomer = null;
let queue = JSON.parse(localStorage.getItem("ktvQueue") || "[]");
let favorites = JSON.parse(localStorage.getItem("ktvFavorites") || "[]");
let currentSong = null;
let searchTimer = null;
let customerSearchTimer = null;

window.addEventListener("DOMContentLoaded", () => {
  renderQueue();
  loadLanguages();
  document.getElementById("audioPlayer").volume = 0.8;

  document.getElementById("searchInput").addEventListener("input", function() {
    clearTimeout(searchTimer);
    const keyword = this.value.trim();
    if (keyword.length === 0) {
      document.getElementById("songList").innerHTML = `<div class="empty">請輸入歌名、歌手或歌號開始搜尋</div>`;
      allSongs = [];
      return;
    }
    searchTimer = setTimeout(() => {
      fetchSongs(keyword);
    }, 250);
  });

  document.getElementById("customerSearch").addEventListener("input", function() {
    clearTimeout(customerSearchTimer);
    const keyword = this.value.trim();
    if (!keyword) {
      document.getElementById("customerResults").innerHTML = `<div class="empty">請輸入客戶姓名</div>`;
      return;
    }
    customerSearchTimer = setTimeout(() => {
      searchCustomers(keyword);
    }, 250);
  });
});

async function apiGet(params) {
  const query = new URLSearchParams(params);
  const response = await fetch(`${API_URL}?${query.toString()}`);
  return response.json();
}

async function apiPost(data) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(data)
  });
  return response.json();
}

async function loadLanguages() {
  try {
    const result = await apiGet({ action: "languages" });
    if (result.success && result.data) {
      const container = document.getElementById("categoryContainer");
      container.innerHTML = result.data.map(lang => `
        <button class="category ${lang === currentLanguage ? "active" : ""}" onclick="filterLanguage('${escapeJs(lang)}', this)">${escapeHtml(lang)}</button>
      `).join("");
    }
  } catch (error) {
    console.error("載入語言失敗", error);
  }
}

async function fetchSongs(keyword = "") {
  const list = document.getElementById("songList");
  if (!keyword) {
    list.innerHTML = `<div class="empty">請輸入歌名、歌手或歌號開始搜尋</div>`;
    allSongs = [];
    return;
  }
  list.innerHTML = `<div class="empty">搜尋中...</div>`;
  try {
    const result = await apiGet({ action: "songs", q: keyword, language: currentLanguage });
    if (!result.success) throw new Error(result.message);
    allSongs = result.data || [];
    renderSongList();
  } catch (error) {
    console.error(error);
    list.innerHTML = `<div class="empty">歌曲搜尋失敗</div>`;
  }
}

function renderSongList() {
  const list = document.getElementById("songList");
  if (allSongs.length === 0) {
    list.innerHTML = `<div class="empty">找不到符合的歌曲</div>`;
    return;
  }

  // 複製一份陣列進行排序處理
  let displaySongs = [...allSongs];
  const sortType = document.getElementById("sortSelect").value;

  if (sortType === "title_len_asc") {
    displaySongs.sort((a, b) => String(a.title || "").length - String(b.title || "").length);
  } else if (sortType === "title_len_desc") {
    displaySongs.sort((a, b) => String(b.title || "").length - String(a.title || "").length);
  } else if (sortType === "artist_len_asc") {
    displaySongs.sort((a, b) => String(a.artist || "").length - String(b.artist || "").length);
  } else if (sortType === "artist_len_desc") {
    displaySongs.sort((a, b) => String(b.artist || "").length - String(a.artist || "").length);
  }

  list.innerHTML = displaySongs.map(song => {
    const isFavorite = favorites.includes(String(song.song_no));
    return `
      <div class="song">
        <div class="cover">🎤</div>
        <div class="song-info">
          <div class="song-title">[${escapeHtml(song.song_no)}] ${escapeHtml(song.title)}</div>
          <div class="artist">${escapeHtml(song.artist)} · ${escapeHtml(song.language || "未分類")}${song.brand ? " · " + escapeHtml(song.brand) : ""}</div>
        </div>
        <div class="song-actions">
          <button class="favorite ${isFavorite ? "active" : ""}" onclick="toggleFavorite('${escapeJs(song.song_no)}')">${isFavorite ? "♥" : "♡"}</button>
          <button class="add-btn" onclick="addSong('${escapeJs(song.song_no)}')">＋ 點歌</button>
        </div>
      </div>
    `;
  }).join("");
}

function filterLanguage(language, button) {
  currentLanguage = language;
  document.querySelectorAll(".category").forEach(btn => btn.classList.remove("active"));
  button.classList.add("active");
  const keyword = document.getElementById("searchInput").value.trim();
  if (keyword) fetchSongs(keyword);
}

function addSong(songNo) {
  const song = allSongs.find(s => String(s.song_no) === String(songNo));
  if (!song) {
    showToast("找不到歌曲");
    return;
  }
  queue.push({ ...song, queueId: Date.now() + Math.random() });
  saveQueue();
  renderQueue();
  showToast(`已點歌：${song.title}`);
}

function renderQueue() {
  const list = document.getElementById("queueList");
  const count = document.getElementById("queueCount");
  count.textContent = `${queue.length} 首`;

  if (queue.length === 0) {
    list.innerHTML = `<div class="empty">目前沒有待播歌曲<br>選擇歌曲開始點歌吧 🎤</div>`;
    return;
  }

  list.innerHTML = queue.map((song, index) => `
    <div class="queue-item">
      <div class="queue-number">${index + 1}</div>
      <div class="song" style="flex: 1; margin: 0; padding: 10px 12px;">
        <div class="cover" style="width: 44px; height: 44px; font-size: 1.1rem;">🎵</div>
        <div class="song-info">
          <div class="song-title">[${escapeHtml(song.song_no)}] ${escapeHtml(song.title)}</div>
          <div class="artist">${escapeHtml(song.artist)} · ${escapeHtml(song.language || "未分類")}${song.brand ? " · " + escapeHtml(song.brand) : ""}</div>
        </div>
      </div>
      <button class="remove-btn" onclick="removeSong(${song.queueId})">×</button>
    </div>
  `).join("");
}

function removeSong(queueId) {
  queue = queue.filter(song => song.queueId !== queueId);
  saveQueue();
  renderQueue();
  showToast("已移除歌曲");
}

function playCurrent() {
  if (!currentSong) {
    if (queue.length === 0) {
      showToast("目前沒有待播歌曲");
      return;
    }
    currentSong = queue[0];
  }
  const player = document.getElementById("audioPlayer");
  player.src = currentSong.media || `music/${encodeURIComponent(currentSong.title)}.mp3`;
  document.getElementById("currentTitle").textContent = `[${currentSong.song_no}] ${currentSong.title}`;
  document.getElementById("currentArtist").textContent = currentSong.artist;
  player.play().catch(() => {
    showToast("找不到音樂檔案");
  });
}

function nextSong() {
  if (queue.length === 0) {
    currentSong = null;
    document.getElementById("currentTitle").textContent = "尚未播放";
    document.getElementById("currentArtist").textContent = "-";
    document.getElementById("audioPlayer").removeAttribute("src");
    showToast("沒有下一首歌曲");
    return;
  }
  currentSong = queue.shift();
  saveQueue();
  renderQueue();
  playCurrent();
}

document.getElementById("audioPlayer").addEventListener("ended", () => {
  nextSong();
});

document.getElementById("volume").addEventListener("input", function() {
  document.getElementById("audioPlayer").volume = this.value;
});

function toggleFavorite(songNo) {
  songNo = String(songNo);
  if (favorites.includes(songNo)) {
    favorites = favorites.filter(item => item !== songNo);
    showToast("已取消收藏");
  } else {
    favorites.push(songNo);
    showToast("已加入收藏");
  }
  localStorage.setItem("ktvFavorites", JSON.stringify(favorites));
  renderSongList();
}

function saveQueue() {
  localStorage.setItem("ktvQueue", JSON.stringify(queue));
}

function openCustomerModal() {
  document.getElementById("customerModal").classList.add("show");
  document.getElementById("customerSearch").value = "";
  document.getElementById("customerResults").innerHTML = `<div class="empty">請輸入客戶姓名</div>`;
  document.getElementById("createCustomerArea").style.display = "none";
  setTimeout(() => {
    document.getElementById("customerSearch").focus();
  }, 100);
}

function closeCustomerModal() {
  document.getElementById("customerModal").classList.remove("show");
}

async function searchCustomers(keyword) {
  const resultBox = document.getElementById("customerResults");
  resultBox.innerHTML = `<div class="empty">搜尋中...</div>`;
  try {
    const result = await apiGet({ action: "customers", q: keyword });
    if (!result.success) throw new Error(result.message);
    if (!result.data || result.data.length === 0) {
      resultBox.innerHTML = `<div class="empty">找不到「${escapeHtml(keyword)}」<br><br>可以按下方「新增客戶」</div>`;
      return;
    }
    resultBox.innerHTML = result.data.map(customer => `
      <div class="customer-card">
        <div>
          <div class="customer-card-name">${escapeHtml(customer.name)}</div>
          <div class="customer-card-info">${customer.phone ? escapeHtml(customer.phone) : "未提供電話"}</div>
        </div>
        <button class="select-customer" onclick="selectCustomer('${escapeJs(customer.customer_id)}', '${escapeJs(customer.name)}')">選擇</button>
      </div>
    `).join("");
  } catch (error) {
    console.error(error);
    resultBox.innerHTML = `<div class="empty">客戶搜尋失敗</div>`;
  }
}

function selectCustomer(customerId, name) {
  currentCustomer = { customer_id: customerId, name: name };
  localStorage.setItem("currentCustomer", JSON.stringify(currentCustomer));
  updateCustomerUI();
  closeCustomerModal();
  showToast(`目前客戶：${name}`);
  setTimeout(() => {
    if (confirm(`是否載入「${name}」的歷史歌單？`)) {
      openHistory();
    }
  }, 200);
}

function updateCustomerUI() {
  const info = document.getElementById("customerInfo");
  const clearBtn = document.getElementById("clearCustomerBtn");
  if (!currentCustomer) {
    info.textContent = "尚未選擇客戶";
    clearBtn.style.display = "none";
    return;
  }
  info.innerHTML = `目前客戶：<span class="customer-name">${escapeHtml(currentCustomer.name)}</span>`;
  clearBtn.style.display = "block";
}

function clearCustomer() {
  if (queue.length > 0) {
    if (!confirm("目前還有待播歌曲，確定要清除客戶嗎？")) return;
  }
  currentCustomer = null;
  localStorage.removeItem("currentCustomer");
  updateCustomerUI();
  showToast("已清除目前客戶");
}

function showCreateCustomer() {
  const area = document.getElementById("createCustomerArea");
  area.style.display = area.style.display === "none" ? "block" : "none";
}

async function createCustomer() {
  const name = document.getElementById("newCustomerName").value.trim();
  const phone = document.getElementById("newCustomerPhone").value.trim();
  const note = document.getElementById("newCustomerNote").value.trim();

  if (!name) {
    showToast("請輸入客戶姓名");
    return;
  }

  try {
    const result = await apiPost({ action: "createCustomer", name, phone, note });
    if (!result.success) throw new Error(result.message);

    currentCustomer = { customer_id: result.data.customer_id, name: result.data.name };
    localStorage.setItem("currentCustomer", JSON.stringify(currentCustomer));
    updateCustomerUI();
    closeCustomerModal();

    document.getElementById("newCustomerName").value = "";
    document.getElementById("newCustomerPhone").value = "";
    document.getElementById("newCustomerNote").value = "";
    showToast(`客戶建立成功：${name}`);
  } catch (error) {
    console.error(error);
    showToast("新增客戶失敗");
  }
}

async function openHistory() {
  if (!currentCustomer) {
    showToast("請先選擇客戶");
    return;
  }
  document.getElementById("historyModal").classList.add("show");
  document.getElementById("historyCustomerName").textContent = `客戶：${currentCustomer.name}`;
  const list = document.getElementById("historyList");
  list.innerHTML = `<div class="empty">載入歷史歌單中...</div>`;

  try {
    const result = await apiGet({ action: "history", customer_id: currentCustomer.customer_id });
    if (!result.success) throw new Error(result.message);
    if (!result.data || result.data.length === 0) {
      list.innerHTML = `<div class="empty">此客戶目前沒有歷史歌單</div>`;
      return;
    }
    list.innerHTML = result.data.map(song => `
      <div class="song">
        <div class="cover">📜</div>
        <div class="song-info">
          <div class="song-title">[${escapeHtml(song.song_no)}] ${escapeHtml(song.title)}</div>
          <div class="artist">${escapeHtml(song.artist)} · ${escapeHtml(song.language || "未分類")}${song.brand ? " · " + escapeHtml(song.brand) : ""}</div>
        </div>
        <div class="song-actions">
          <button class="add-btn" onclick="addHistorySong('${escapeJs(song.song_no)}', '${escapeJs(song.title)}', '${escapeJs(song.artist)}', '${escapeJs(song.brand)}', '${escapeJs(song.language)}')">＋ 點歌</button>
        </div>
      </div>
    `).join("");
  } catch (error) {
    console.error(error);
    list.innerHTML = `<div class="empty">歷史歌單載入失敗</div>`;
  }
}

function closeHistoryModal() {
  document.getElementById("historyModal").classList.remove("show");
}

function addHistorySong(songNo, title, artist, brand, language) {
  queue.push({
    song_no: songNo,
    title: title,
    artist: artist,
    brand: brand,
    language: language,
    queueId: Date.now() + Math.random()
  });
  saveQueue();
  renderQueue();
  showToast(`已加入：${title}`);
}

async function endService() {
  if (!currentCustomer) {
    showToast("請先選擇客戶");
    return;
  }
  if (queue.length === 0) {
    showToast("目前沒有點歌紀錄");
    return;
  }
  const ok = confirm(`確定結束「${currentCustomer.name}」本次服務？\n\n目前 ${queue.length} 首歌曲會寫入歷史歌單。`);
  if (!ok) return;

  try {
    const result = await apiPost({
      action: "saveHistory",
      customer_id: currentCustomer.customer_id,
      customer_name: currentCustomer.name,
      songs: queue
    });
    if (!result.success) throw new Error(result.message);

    queue = [];
    currentSong = null;
    saveQueue();
    renderQueue();

    document.getElementById("currentTitle").textContent = "尚未播放";
    document.getElementById("currentArtist").textContent = "-";
    document.getElementById("audioPlayer").removeAttribute("src");

    currentCustomer = null;
    localStorage.removeItem("currentCustomer");
    updateCustomerUI();
    showToast("本次服務已完成，歷史歌單已儲存");
  } catch (error) {
    console.error(error);
    showToast("歷史歌單儲存失敗，沒有清除資料");
  }
}

let toastTimer;
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2500);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeJs(value) {
  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\r/g, "\\r")
    .replace(/\n/g, "\\n");
}

const savedCustomer = localStorage.getItem("currentCustomer");
if (savedCustomer) {
  try {
    currentCustomer = JSON.parse(savedCustomer);
    updateCustomerUI();
  } catch (error) {
    localStorage.removeItem("currentCustomer");
  }
}
</script>
