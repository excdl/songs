<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTV 客戶入口</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
  color: white;
  background: radial-gradient(circle at top, #24104d 0%, #0b0b16 45%, #050509 100%);
}
.container {
  width: 100%;
  max-width: 430px;
  padding: 20px;
}
.card {
  padding: 35px 28px;
  border-radius: 24px;
  background: rgba(18, 18, 30, .94);
  border: 1px solid rgba(255, 255, 255, .08);
  box-shadow: 0 30px 80px rgba(0, 0, 0, .5);
}
.logo {
  text-align: center;
  font-size: 29px;
  font-weight: bold;
  background: linear-gradient(90deg, #ff2bd6, #8c5cff, #22d3ee);
  -webkit-background-clip: text;
  color: transparent;
}
.subtitle {
  text-align: center;
  color: #888;
  margin-top: 8px;
  font-size: 14px;
}
.room {
  margin-top: 25px;
  padding: 12px;
  text-align: center;
  border-radius: 12px;
  background: #151522;
  color: #999;
}
.room span {
  color: white;
  font-weight: bold;
}
.form {
  margin-top: 22px;
}
label {
  display: block;
  margin-bottom: 8px;
  color: #bbb;
  font-size: 14px;
}
.customer-input {
  width: 100%;
  height: 52px;
  padding: 0 15px;
  border-radius: 12px;
  border: 1px solid #38384c;
  outline: none;
  background: #10101b;
  color: white;
  font-size: 17px;
  text-align: center;
}
.customer-input:focus {
  border-color: #9b5cff;
}
button {
  border: none;
  cursor: pointer;
}
.login-btn {
  width: 100%;
  height: 52px;
  margin-top: 14px;
  border-radius: 12px;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  color: white;
  font-size: 16px;
  font-weight: bold;
}
.add-customer-btn {
  width: 100%;
  height: 48px;
  margin-top: 10px;
  border-radius: 12px;
  background: #20202f;
  border: 1px solid #38384c;
  color: #ddd;
  font-size: 14px;
}
.guest-btn {
  width: 100%;
  height: 46px;
  margin-top: 10px;
  border-radius: 12px;
  background: transparent;
  color: #777;
  font-size: 13px;
}
.error {
  min-height: 20px;
  margin-top: 10px;
  text-align: center;
  color: #ff6688;
  font-size: 13px;
}
/* Modal */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 0, 0, .75);
  backdrop-filter: blur(8px);
}
.modal.show {
  display: flex;
}
.modal-box {
  width: 100%;
  max-width: 420px;
  padding: 28px;
  border-radius: 22px;
  background: #181827;
  border: 1px solid rgba(255, 255, 255, .1);
  box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
  animation: modalIn .2s ease;
}
@keyframes modalIn {
  from {
    opacity: 0;
    transform: scale(.95) translateY(10px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}
.modal-title {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}
.modal-subtitle {
  margin-top: 7px;
  margin-bottom: 24px;
  text-align: center;
  color: #888;
  font-size: 13px;
}
.modal-input {
  width: 100%;
  height: 52px;
  padding: 0 14px;
  border-radius: 12px;
  border: 1px solid #38384c;
  outline: none;
  background: #10101b;
  color: white;
  font-size: 16px;
}
.modal-input:focus {
  border-color: #9b5cff;
}
.modal-error {
  min-height: 20px;
  margin-top: 8px;
  color: #ff6688;
  font-size: 13px;
  text-align: center;
}
.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}
.modal-buttons button {
  flex: 1;
  height: 46px;
  border-radius: 11px;
  font-weight: bold;
}
.modal-cancel {
  background: #29293a;
  color: #aaa;
}
.modal-confirm {
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  color: white;
}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="logo">🎤 KTV 點歌系統</div>
    <div class="subtitle">歡迎來到歡唱包廂</div>
    <div class="room">
      包廂：<span id="roomCode">A-208</span>
    </div>
    <div class="form">
      <label>客戶代碼</label>
      <input class="customer-input" id="customerCode" placeholder="請輸入客戶代碼" autocomplete="off">
      <button class="login-btn" onclick="loginCustomer()">開始點歌</button>
      <button class="add-customer-btn" onclick="openCreateCustomer()">＋ 新增客戶</button>
      <button class="guest-btn" onclick="enterGuest()">不輸入客戶代碼，直接點歌</button>
      <div id="error" class="error"></div>
    </div>
  </div>
</div>

<!-- ======================================
     新增客戶 Modal
======================================= -->
<div id="customerModal" class="modal">
  <div class="modal-box">
    <div class="modal-title">👤 新增客戶</div>
    <div class="modal-subtitle">建立後會自動產生客戶代碼</div>
    <label>客戶名稱</label>
    <input id="newCustomerName" class="modal-input" placeholder="例如：王先生" maxlength="30" autocomplete="off">
    <div id="createCustomerError" class="modal-error"></div>
    <div class="modal-buttons">
      <button class="modal-cancel" onclick="closeCreateCustomer()">取消</button>
      <button class="modal-confirm" id="createCustomerBtn" onclick="createCustomer()">建立客戶</button>
    </div>
  </div>
</div>

<script>
/************************************************
 * 設定
 ************************************************/
const API_URL = "https://script.google.com/macros/s/AKfycbxHG5-NJ2R3jp17CSZYisCdr9J3lih7tP4QiAZ6U2iUk8trxrB8uIUXjF-kM7wby9RrEQ/exec";
const ROOM_CODE = "meimei";
const KTV_PAGE = "index.html";

/************************************************
 * 登入客戶
 ************************************************/
async function loginCustomer() {
  const input = document.getElementById("customerCode");
  const error = document.getElementById("error");
  const customerCode = input.value.trim();

  error.textContent = "";

  if (!customerCode) {
    error.textContent = "請輸入客戶代碼";
    input.focus();
    return;
  }

  try {
    const response = await fetch(
      API_URL + "?action=customer&customerCode=" + encodeURIComponent(customerCode)
    );
    const result = await response.json();

    if (!result.success) {
      error.textContent = result.message || "客戶不存在";
      return;
    }

    const customer = result.data;

    // 建立場次
    const session = await createSession(customerCode);

    if (!session.success) {
      error.textContent = session.message || "建立場次失敗";
      return;
    }

    // 儲存
    localStorage.setItem("ktvCustomer", JSON.stringify(customer));
    localStorage.setItem("ktvSessionId", session.sessionId);
    localStorage.setItem("ktvRoom", ROOM_CODE);

    // 進入點歌頁
    location.href = KTV_PAGE;
  } catch (error) {
    console.error(error);
    const errEl = document.getElementById("error");
    errEl.textContent = "無法連線伺服器";
  }
}

/************************************************
 * 建立場次
 ************************************************/
async function createSession(customerCode) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      action: "createSession",
      customerCode: customerCode,
      room: ROOM_CODE
    })
  });
  return response.json();
}

/************************************************
 * 新增客戶 Modal
 ************************************************/
function openCreateCustomer() {
  const modal = document.getElementById("customerModal");
  const input = document.getElementById("newCustomerName");

  document.getElementById("createCustomerError").textContent = "";
  input.value = "";
  modal.classList.add("show");
  setTimeout(() => input.focus(), 100);
}

function closeCreateCustomer() {
  document.getElementById("customerModal").classList.remove("show");
}

/************************************************
 * 建立客戶
 ************************************************/
async function createCustomer() {
  const input = document.getElementById("newCustomerName");
  const error = document.getElementById("createCustomerError");
  const button = document.getElementById("createCustomerBtn");
  const customerName = input.value.trim();

  error.textContent = "";

  if (!customerName) {
    error.textContent = "請輸入客戶名稱";
    input.focus();
    return;
  }

  button.disabled = true;
  button.textContent = "建立中...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "createCustomer",
        customerName: customerName
      })
    });
    const result = await response.json();

    if (!result.success) {
      error.textContent = result.message || "建立失敗";
      return;
    }

    const customer = result.data;

    // 建立場次
    const session = await createSession(customer["客戶代碼"]);

    if (!session.success) {
      error.textContent = "客戶建立成功，但場次建立失敗";
      return;
    }

    // 儲存客戶
    localStorage.setItem("ktvCustomer", JSON.stringify(customer));
    localStorage.setItem("ktvSessionId", session.sessionId);
    localStorage.setItem("ktvRoom", ROOM_CODE);

    // 進入點歌
    closeCreateCustomer();
    location.href = KTV_PAGE;
  } catch (err) {
    console.error(err);
    error.textContent = "無法連線伺服器";
  } finally {
    button.disabled = false;
    button.textContent = "建立客戶";
  }
}

/************************************************
 * 不登入客戶
 ************************************************/
async function enterGuest() {
  try {
    const session = await createSession("");

    if (!session.success) {
      alert("建立場次失敗");
      return;
    }

    localStorage.removeItem("ktvCustomer");
    localStorage.setItem("ktvSessionId", session.sessionId);
    localStorage.setItem("ktvRoom", ROOM_CODE);
    location.href = KTV_PAGE;
  } catch (error) {
    console.error(error);
    alert("無法建立場次");
  }
}

/************************************************
 * Enter 登入
 ************************************************/
document.getElementById("customerCode").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    loginCustomer();
  }
});

/************************************************
 * Modal Enter / ESC
 ************************************************/
document.getElementById("newCustomerName").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    createCustomer();
  }
  if (event.key === "Escape") {
    closeCreateCustomer();
  }
});

/************************************************
 * 點背景關閉 Modal
 ************************************************/
document.getElementById("customerModal").addEventListener("click", function(event) {
  if (event.target === this) {
    closeCreateCustomer();
  }
});
</script>
</body>
</html>
