<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTV 點歌系統 - 據點驗證與點歌</title>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
<style>
html { font-size: 130%; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
  background: radial-gradient(circle at top, #24104d 0%, #0b0b16 45%, #050509 100%);
  color: #fff;
  min-height: 100vh;
}

/* 🔒 據點驗證全螢幕遮罩層 */
#authOverlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 5, 9, 0.96);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(12px);
  transition: opacity 0.4s ease;
}
.auth-card {
  background: #171725;
  border: 1px solid #343449;
  border-radius: 20px;
  padding: 35px 25px;
  width: 100%;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.7);
}
.auth-title {
  font-size: 1.4rem;
  font-weight: bold;
  margin-bottom: 12px;
  background: linear-gradient(90deg, #ff2bd6, #8c5cff, #22d3ee);
  -webkit-background-clip: text;
  color: transparent;
}
.auth-desc {
  color: #bbb;
  font-size: 0.92rem;
  margin-bottom: 24px;
  line-height: 1.6;
}
.auth-spinner {
  width: 45px;
  height: 45px;
  border: 4px solid rgba(255,255,255,0.1);
  border-top-color: #ff2bd6;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.auth-btn {
  width: 100%;
  height: 48px;
  border-radius: 12px;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  color: white;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 1rem;
  margin-top: 15px;
  transition: opacity 0.2s;
}
.auth-btn:hover { opacity: 0.9; }
.auth-error {
  color: #ff4d6d;
  font-size: 0.88rem;
  margin-top: 15px;
  white-space: pre-line;
  line-height: 1.5;
}

/* 系統主介面樣式 */
header {
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  background: rgba(10,10,20,.92);
  border-bottom: 1px solid rgba(255,255,255,.08);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.logo {
  font-size: 1.35rem;
  font-weight: bold;
  background: linear-gradient(90deg, #ff2bd6, #8c5cff, #22d3ee);
  -webkit-background-clip: text;
  color: transparent;
}
.customer-area {
  display: flex;
  align-items: center;
  gap: 10px;
}
.customer-info {
  color: #bbb;
  font-size: 0.85rem;
}
.customer-name {
  color: white;
  font-weight: bold;
}
.customer-btn {
  background: #29293a;
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid #3a3a4d;
  cursor: pointer;
  font-size: 0.85rem;
}
.customer-btn:hover {
  background: #3b3b50;
}
main {
  max-width: 1400px;
  margin: auto;
  padding: 25px;
}
.search-area {
  margin-bottom: 15px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.search-box {
  position: relative;
  flex: 1;
  min-width: 250px;
}
.search-box input {
  width: 100%;
  height: 52px;
  border: 1px solid #38384c;
  border-radius: 12px;
  padding: 0 20px 0 48px;
  background: #151522;
  color: white;
  outline: none;
  font-size: 1rem;
}
.search-box input:focus {
  border-color: #9b5cff;
  box-shadow: 0 0 0 3px rgba(155,92,255,.15);
}
.search-icon {
  position: absolute;
  left: 18px;
  top: 15px;
  font-size: 1.1rem;
  color: #999;
}
.sort-box select {
  height: 52px;
  padding: 0 16px;
  border-radius: 12px;
  border: 1px solid #38384c;
  background: #151522;
  color: white;
  outline: none;
  font-size: 0.95rem;
  cursor: pointer;
}
.sort-box select:focus {
  border-color: #9b5cff;
}
.quick-search {
  margin-bottom: 20px;
  padding: 15px;
  background: rgba(18,18,29,.75);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 15px;
}
.quick-title {
  color: #aaa;
  font-size: 0.82rem;
  margin-bottom: 10px;
}
.quick-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 4px;
}
.category {
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 30px;
  background: #171725;
  color: #aaa;
  border: 1px solid #2d2d3d;
  cursor: pointer;
  font-size: 0.85rem;
  transition: .2s;
}
.category:hover {
  background: #29293d;
  color: white;
}
.category.active {
  color: white;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  border-color: transparent;
}
.content {
  display: grid;
  grid-template-columns: 1fr 420px;
  gap: 25px;
}
.section-title {
  font-size: 1.1rem;
  font-weight: bold;
  margin-bottom: 16px;
}
.song-list {
  display: grid;
  gap: 12px;
}
.song {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  border: 1px solid rgba(255,255,255,.07);
  background: rgba(25,25,38,.75);
  border-radius: 14px;
  transition: .2s;
}
.song:hover {
  background: #222235;
  transform: translateY(-1px);
}
.cover {
  width: 56px;
  height: 56px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 1.3rem;
  background: linear-gradient(135deg, #ff2bd6, #653eff);
}
.song-info {
  flex: 1;
  min-width: 0;
}
.song-title {
  font-size: 1rem;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.artist {
  color: #999;
  font-size: 0.85rem;
  margin-top: 4px;
}
.song-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.favorite {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: #292938;
  color: #aaa;
  font-size: 1.1rem;
  cursor: pointer;
  border: none;
}
.favorite.active {
  color: #ff3e91;
}
.add-btn {
  padding: 8px 14px;
  border-radius: 9px;
  color: white;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 0.85rem;
}
.queue-panel {
  background: rgba(18,18,29,.9);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 18px;
  padding: 20px;
  height: fit-content;
  position: sticky;
  top: 95px;
}
.queue-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.queue-count {
  color: #aaa;
  font-size: 0.85rem;
}
.queue-list {
  display: grid;
  gap: 10px;
  max-height: 380px;
  overflow-y: auto;
}
.queue-number {
  width: 26px;
  color: #8d7aff;
  font-weight: bold;
  text-align: center;
  font-size: 0.95rem;
}
.remove-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  color: #888;
  background: transparent;
  font-size: 1.2rem;
  border: none;
  cursor: pointer;
}
.player {
  margin-top: 18px;
  background: linear-gradient(135deg, #251040, #111126);
  border-radius: 16px;
  padding: 16px;
}
.now-playing {
  color: #aaa;
  font-size: 0.75rem;
  margin-bottom: 4px;
}
.current-title {
  font-size: 1rem;
  font-weight: bold;
}
.current-artist {
  font-size: 0.85rem;
  color: #888;
  margin-top: 3px;
}
audio {
  width: 100%;
  margin-top: 10px;
}
.player-controls {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.control-btn {
  flex: 1;
  height: 40px;
  border-radius: 9px;
  background: #29293a;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 0.9rem;
}
.play-btn {
  background: linear-gradient(135deg, #ff2bd6, #744cff);
}
.volume {
  margin-top: 10px;
}
.volume input {
  width: 100%;
}
.end-service {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border-radius: 9px;
  background: linear-gradient(135deg, #e43b62, #9b2f80);
  color: white;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
}
.empty {
  color: #777;
  text-align: center;
  padding: 25px 10px;
  font-size: 0.9rem;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%) translateY(20px);
  background: #242435;
  color: white;
  padding: 12px 20px;
  border-radius: 30px;
  opacity: 0;
  pointer-events: none;
  transition: .3s;
  z-index: 9999;
  font-size: 0.9rem;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 500;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal.show {
  display: flex;
}
.modal-box {
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  background: #171725;
  border: 1px solid #343449;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.modal-title {
  font-size: 1.1rem;
  font-weight: bold;
}
.close-btn {
  width: 35px;
  height: 35px;
  border-radius: 8px;
  background: #292938;
  color: white;
  font-size: 1.1rem;
  border: none;
  cursor: pointer;
}
.modal-input {
  width: 100%;
  height: 45px;
  padding: 0 14px;
  border-radius: 9px;
  border: 1px solid #3a3a4d;
  background: #10101a;
  color: white;
  outline: none;
  margin-bottom: 12px;
  font-size: 0.95rem;
}
.modal-input:focus {
  border-color: #9b5cff;
}
.primary-btn {
  width: 100%;
  height: 45px;
  border-radius: 9px;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  color: white;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
}
.secondary-btn {
  width: 100%;
  height: 45px;
  border-radius: 9px;
  background: #292938;
  color: white;
  margin-top: 10px;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
}
.customer-result {
  display: grid;
  gap: 10px;
  margin-top: 15px;
}
.customer-card {
  padding: 14px;
  background: #222235;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.customer-card-name {
  font-weight: bold;
  font-size: 1rem;
}
.customer-card-info {
  color: #888;
  font-size: 0.8rem;
  margin-top: 4px;
}
.customer-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.select-customer,
.edit-customer {
  padding: 8px 12px;
  border-radius: 8px;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 0.8rem;
}
.select-customer {
  background: linear-gradient(135deg, #ff2bd6, #744cff);
}
.edit-customer {
  background: #39394d;
}
.edit-customer:hover {
  background: #4a4a62;
}
.history-list {
  display: grid;
  gap: 10px;
  margin-top: 15px;
}
.edit-customer-area {
  display: none;
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid rgba(255,255,255,.08);
}
.edit-title {
  color: #aaa;
  margin-bottom: 10px;
  font-size: 0.85rem;
}
.edit-customer-id {
  color: #777;
  font-size: 0.75rem;
  margin-bottom: 10px;
}
@media(max-width:900px) {
  .content {
    grid-template-columns: 1fr;
  }
  .queue-panel {
    position: static;
  }
  header {
    padding: 0 15px;
  }
  .logo {
    font-size: 1.1rem;
  }
  .customer-info {
    display: none;
  }
}
#categoryContainer {
  display: none !important;
}
</style>
</head>
<body>

<!-- 🔒 據點安全性驗證遮罩 -->
<div id="authOverlay">
  <div class="auth-card">
    <div class="auth-title">🎤 據點安全驗證</div>
    <div class="auth-desc" id="authDesc">正在取得您的 GPS 定位，請允許瀏覽器權限...</div>
    <div class="auth-spinner" id="authSpinner"></div>
    <div class="auth-error" id="authError"></div>
    <button class="auth-btn" id="retryAuthBtn" style="display:none;" onclick="checkLocationAuth()">重新驗證據點</button>
  </div>
</div>

<header>
  <div class="logo">🎤 KTV 點歌系統</div>
  <div class="customer-area">
    <div class="customer-info" id="customerInfo">尚未選擇客戶</div>
    <button class="customer-btn" onclick="openCustomerModal()">👤 新增／選擇客戶</button>
    <button class="customer-btn" id="clearCustomerBtn" style="display:none" onclick="clearCustomer()">清除</button>
  </div>
</header>

<main>
  <div class="search-area">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="輸入歌名、歌手或歌號..." autocomplete="off">
    </div>
    <div class="sort-box">
      <select id="sortSelect" onchange="renderSongList()">
        <option value="default">預設排序</option>
        <option value="title_len_asc">歌名字數：少 ➔ 多</option>
        <option value="title_len_desc">歌名字數：多 ➔ 少</option>
        <option value="artist_len_asc">歌手字數：少 ➔ 多</option>
        <option value="artist_len_desc">歌手字數：多 ➔ 少</option>
      </select>
    </div>
  </div>
  <div class="quick-search">
    <div class="quick-title">🌐 快速語言搜尋</div>
    <div class="quick-row" id="languageContainer"></div>
  </div>
  <div class="quick-search">
    <div class="quick-title">🎵 快速分類搜尋</div>
    <div class="quick-row" id="categoryContainer"></div>
  </div>
  <div class="content">
    <section>
      <div class="section-title">🎵 歌曲列表</div>
      <div class="song-list" id="songList">
        <div class="empty">請輸入歌名、歌手或歌號開始搜尋<br>或直接點選上方語言／分類</div>
      </div>
    </section>
    <aside class="queue-panel">
      <div class="queue-header">
        <div class="section-title">📋 待播歌曲</div>
        <div class="queue-count" id="queueCount">0 首</div>
      </div>
      <div class="queue-list" id="queueList"></div>
      <div class="player">
        <div class="now-playing">NOW PLAYING</div>
        <div class="current-title" id="currentTitle">尚未播放</div>
        <div class="current-artist" id="currentArtist">-</div>
        <audio id="audioPlayer" controls></audio>
        <div class="player-controls">
          <button class="control-btn play-btn" onclick="playCurrent()">▶ 播放</button>
          <button class="control-btn" onclick="nextSong()">⏭ 下一首</button>
        </div>
        <div class="volume">
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
        </div>
        <button class="end-service" onclick="endService()">🔚 結束本次服務</button>
      </div>
    </aside>
  </div>
</main>

<div class="modal" id="customerModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">👤 客戶管理</div>
      <button class="close-btn" onclick="closeCustomerModal()">×</button>
    </div>
    <input class="modal-input" id="customerSearch" placeholder="請輸入客戶姓名搜尋..." autocomplete="off">
    <div class="customer-result" id="customerResults">
      <div class="empty">請輸入客戶姓名</div>
    </div>
    <button class="secondary-btn" onclick="showCreateCustomer()">＋ 新增客戶</button>
    <div id="createCustomerArea" style="display:none;margin-top:20px">
      <div style="color:#aaa;margin-bottom:8px;font-size:0.85rem;">新增客戶</div>
      <input class="modal-input" id="newCustomerName" placeholder="客戶姓名">
      <input class="modal-input" id="newCustomerPhone" placeholder="電話（選填）">
      <input class="modal-input" id="newCustomerNote" placeholder="備註（選填）">
      <button class="primary-btn" onclick="createCustomer()">建立客戶</button>
    </div>
    <div id="editCustomerArea" class="edit-customer-area">
      <div class="edit-title">✏️ 編輯舊客戶</div>
      <div class="edit-customer-id" id="editCustomerId"></div>
      <input class="modal-input" id="editCustomerName" placeholder="客戶姓名">
      <input class="modal-input" id="editCustomerPhone" placeholder="電話（選填）">
      <input class="modal-input" id="editCustomerNote" placeholder="備註（選填）">
      <button class="primary-btn" onclick="updateCustomer()">💾 儲存客戶資料</button>
      <button class="secondary-btn" onclick="cancelEditCustomer()">取消編輯</button>
    </div>
  </div>
</div>

<div class="modal" id="historyModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">📜 歷史歌單</div>
      <button class="close-btn" onclick="closeHistoryModal()">×</button>
    </div>
    <div id="historyCustomerName" style="color:#aaa;margin-bottom:10px;font-size:0.9rem;"></div>
    <div class="history-list" id="historyList">
      <div class="empty">載入中...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbzsMpGjV5_2ZtH3Oo_DlJnVet18ekkffwfqrlkQlg3p2aevq_VlgseihmzbJrwAAdOA/exec";


/* =================================================
 * 全域狀態
 * ================================================= */

let allSongs = [];

let currentLanguage = "全部";
let currentCategory = "全部";

let currentCustomer = null;

let queue = loadLocalStorageArray("ktvQueue");
let favorites = loadLocalStorageArray("ktvFavorites");

let currentSong = null;

let searchTimer = null;
let customerSearchTimer = null;

let lastKeyword = "";

let editingCustomerId = null;

let ktvInitialized = false;

/*
 * 搜尋請求編號
 *
 * 每次開始新的搜尋就 +1。
 * 如果舊的 API 回來時 requestId 已經不同，
 * 就直接忽略舊結果。
 *
 * 這是解決「第一次搜尋查到後閃掉」的重要機制。
 */
let songSearchRequestId = 0;


/*
 * 客戶搜尋請求編號
 */
let customerSearchRequestId = 0;


/*
 * Toast 計時器
 */
let toastTimer = null;


/* =================================================
 * LocalStorage 工具
 * ================================================= */

function loadLocalStorageArray(key) {
  try {
    const value = JSON.parse(localStorage.getItem(key) || "[]");

    if (Array.isArray(value)) {
      return value;
    }

    return [];
  } catch (error) {
    console.warn(`LocalStorage 讀取失敗：${key}`, error);
    return [];
  }
}


/* =================================================
 * 頁面載入
 * ================================================= */

window.addEventListener("DOMContentLoaded", () => {
  checkLocationAuth();
});


/* =================================================
 * 據點驗證
 *
 * IP OR GPS：
 *
 * 1. 公司 Wi-Fi IP 符合 → 通過
 * 2. GPS 在公司範圍 → 通過
 * 3. 任一成立即可
 * ================================================= */

function checkLocationAuth() {

  const descEl = document.getElementById("authDesc");
  const spinnerEl = document.getElementById("authSpinner");
  const errorEl = document.getElementById("authError");
  const retryBtn = document.getElementById("retryAuthBtn");

  descEl.textContent = "正在取得您的 GPS 位置...";
  spinnerEl.style.display = "block";
  errorEl.textContent = "";
  retryBtn.style.display = "none";


  /*
   * 瀏覽器不支援 GPS
   *
   * 注意：
   * 後端如果能自行取得 IP，
   * 理論上可以做純 IP 驗證。
   *
   * 但目前前端 API 沒有獨立 IP 查詢流程，
   * 所以仍然需要 GPS。
   */

  if (!navigator.geolocation) {

    authFailed(
      "您的瀏覽器不支援地理定位功能，無法使用本系統。"
    );

    return;
  }


  navigator.geolocation.getCurrentPosition(

    async (position) => {

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      descEl.textContent =
        "定位成功，正在驗證公司據點...";


      try {

        /*
         * 不需要把 IP 從前端傳入。
         *
         * 後端可以依部署環境取得相關資訊。
         */
        const query = new URLSearchParams({
          action: "verifyLocation",
          lat: String(lat),
          lng: String(lng)
        });


        const response =
          await fetch(`${API_URL}?${query.toString()}`, {
            method: "GET",
            cache: "no-store"
          });


        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }


        const result = await response.json();


        /*
         * 後端只要回：
         *
         * rangeStatus = 有效打卡區
         *
         * 就允許進入。
         *
         * 這個狀態本身已經是：
         *
         * IP OR GPS
         */
        if (
          result.success &&
          result.rangeStatus === "有效打卡區"
        ) {

          const overlay =
            document.getElementById("authOverlay");


          overlay.style.opacity = "0";


          setTimeout(() => {

            overlay.style.display = "none";

            showToast(
              "📍 據點驗證成功，歡迎使用！"
            );

            initKtvSystem();

          }, 400);


        } else {

          const company =
            result.companyName || "未知";

          const distance =
            result.distance !== null &&
            result.distance !== undefined
              ? `${result.distance} 公尺`
              : "未知";


          authFailed(
            `❌ 驗證未通過：您目前不在有效公司據點內。\n\n` +
            `最近據點：${company}\n` +
            `距離：${distance}`
          );
        }

      } catch (error) {

        console.error(
          "據點驗證錯誤：",
          error
        );


        authFailed(
          "無法連線至後端伺服器進行驗證，" +
          "請檢查網路狀態後重新驗證。"
        );
      }
    },


    (error) => {

      let msg =
        "無法取得 GPS 定位。";


      if (
        error.code ===
        error.PERMISSION_DENIED
      ) {

        msg =
          "您拒絕了瀏覽器定位權限，" +
          "請於瀏覽器設定中開啟定位後重新整理。";

      } else if (
        error.code ===
        error.POSITION_UNAVAILABLE
      ) {

        msg =
          "無法取得目前裝置的位置資訊。";

      } else if (
        error.code ===
        error.TIMEOUT
      ) {

        msg =
          "GPS 定位逾時，請至收訊良好的地方重試。";
      }


      authFailed(msg);
    },


    {
      timeout: 15000,
      maximumAge: 0,
      enableHighAccuracy: true
    }

  );
}


/* =================================================
 * 驗證失敗
 * ================================================= */

function authFailed(message) {

  const desc =
    document.getElementById("authDesc");

  const spinner =
    document.getElementById("authSpinner");

  const error =
    document.getElementById("authError");

  const retry =
    document.getElementById("retryAuthBtn");


  desc.textContent = "存取受阻";

  spinner.style.display = "none";

  error.textContent = message;

  retry.style.display = "block";
}


/* =================================================
 * KTV 初始化
 *
 * 重要：
 * 使用 ktvInitialized 防止重複綁定事件。
 * ================================================= */

function initKtvSystem() {

  if (ktvInitialized) {
    return;
  }

  ktvInitialized = true;


  /*
   * 待播清單
   */
  renderQueue();


  /*
   * 載入語言
   */
  loadLanguages();


  /*
   * 載入分類
   */
  loadCategories();


  /*
   * 音量
   */
  const audioPlayer =
    document.getElementById("audioPlayer");

  if (audioPlayer) {
    audioPlayer.volume = 0.8;
  }


  /* ===============================================
   * 歌曲搜尋
   *
   * 原本問題：
   *
   * input
   * ↓
   * debounce
   * ↓
   * fetchSongs()
   * ↓
   * fetchSongs 裡先清空畫面
   * ↓
   * API 回來
   * ↓
   * render
   *
   * 如果同時間又有其他搜尋，
   * 舊 API 可能晚回來，
   * 把新結果蓋掉。
   *
   * 現在使用：
   *
   * songSearchRequestId
   *
   * 舊請求一律丟棄。
   * =============================================== */

  const searchInput =
    document.getElementById("searchInput");


  if (searchInput) {

    searchInput.addEventListener(
      "input",
      function () {

        clearTimeout(searchTimer);


        const keyword =
          this.value.trim();


        /*
         * 使用者清空搜尋
         */
        if (!keyword) {

          lastKeyword = "";

          /*
           * 如果有篩選語言／分類，
           * 仍然載入該篩選結果。
           */
          if (
            currentLanguage !== "全部" ||
            currentCategory !== "全部"
          ) {

            fetchSongs("");

          } else {

            allSongs = [];

            document.getElementById(
              "songList"
            ).innerHTML =
              `<div class="empty">
                請輸入歌名、歌手或歌號開始搜尋<br>
                或直接點選上方語言／分類
              </div>`;
          }

          return;
        }


        /*
         * debounce
         *
         * 不要每輸入一個字就呼叫 API。
         */
        searchTimer = setTimeout(() => {

          /*
           * 關鍵字沒有變，
           * 只需要重新 render。
           */
          if (keyword === lastKeyword) {

            renderSongList();

            return;
          }


          lastKeyword = keyword;

          fetchSongs(keyword);

        }, 300);

      }
    );
  }


  /* ===============================================
   * 客戶搜尋
   * =============================================== */

  const customerSearch =
    document.getElementById("customerSearch");


  if (customerSearch) {

    customerSearch.addEventListener(
      "input",
      function () {

        clearTimeout(customerSearchTimer);


        const keyword =
          this.value.trim();


        if (!keyword) {

          document.getElementById(
            "customerResults"
          ).innerHTML =
            `<div class="empty">
              請輸入客戶姓名
            </div>`;

          return;
        }


        customerSearchTimer =
          setTimeout(() => {

            searchCustomers(keyword);

          }, 300);

      }
    );
  }


  /* ===============================================
   * 音量
   * =============================================== */

  const volume =
    document.getElementById("volume");


  if (volume) {

    volume.addEventListener(
      "input",
      function () {

        const player =
          document.getElementById(
            "audioPlayer"
          );

        if (player) {
          player.volume =
            Number(this.value);
        }

      }
    );
  }


  /* ===============================================
   * Audio 播放完畢
   * =============================================== */

  if (audioPlayer) {

    audioPlayer.addEventListener(
      "ended",
      () => {

        nextSong();

      }
    );
  }


  /* ===============================================
   * 讀取目前客戶
   * =============================================== */

  const savedCustomer =
    localStorage.getItem(
      "currentCustomer"
    );


  if (savedCustomer) {

    try {

      currentCustomer =
        JSON.parse(savedCustomer);

      updateCustomerUI();

    } catch (error) {

      console.warn(
        "目前客戶資料格式錯誤",
        error
      );

      localStorage.removeItem(
        "currentCustomer"
      );

    }
  }
}


/* =================================================
 * API GET
 * ================================================= */

async function apiGet(params) {

  const query =
    new URLSearchParams();


  Object.keys(params || {}).forEach(
    key => {

      const value =
        params[key];

      query.set(
        key,
        value === undefined ||
        value === null
          ? ""
          : String(value)
      );

    }
  );


  const response =
    await fetch(
      `${API_URL}?${query.toString()}`,
      {
        method: "GET",
        cache: "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      `HTTP ${response.status}`
    );
  }


  return response.json();
}


/* =================================================
 * API POST
 * ================================================= */

async function apiPost(data) {

  const response =
    await fetch(
      API_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify(data)
      }
    );


  if (!response.ok) {

    throw new Error(
      `HTTP ${response.status}`
    );
  }


  return response.json();
}


/* =================================================
 * 載入語言
 * ================================================= */

async function loadLanguages() {

  try {

    const result =
      await apiGet({
        action: "languages"
      });


    if (
      !result.success ||
      !Array.isArray(result.data)
    ) {
      return;
    }


    const container =
      document.getElementById(
        "languageContainer"
      );


    if (!container) {
      return;
    }


    let html =
      `<button
        class="category active"
        data-language="全部"
        onclick="filterLanguage('全部', this)">
        全部
      </button>`;


    html += result.data
      .map(language => {

        return `
          <button
            class="category"
            data-language="${escapeHtml(language)}"
            onclick="filterLanguage('${escapeJs(language)}', this)">
            ${escapeHtml(language)}
          </button>
        `;

      })
      .join("");


    container.innerHTML = html;

  } catch (error) {

    console.error(
      "載入語言失敗",
      error
    );
  }
}

/* =================================================
 * 歌曲搜尋
 *
 * ★ 這裡是本次修正核心
 * ================================================= */

async function fetchSongs(
  keyword = ""
) {

  /*
   * 每次搜尋都建立新的 request ID。
   */
  const requestId =
    ++songSearchRequestId;


  const list =
    document.getElementById(
      "songList"
    );


  /*
   * 不要再直接：
   *
   * list.innerHTML = 搜尋中
   *
   * 因為這會造成：
   *
   * 原結果 → 空白 → 新結果
   *
   * 使用者就會看到閃一下。
   *
   * 第一次搜尋尤其明顯。
   *
   * 改成只有完全沒有結果時才顯示搜尋中。
   */

  if (
    allSongs.length === 0
  ) {

    list.innerHTML =
      `<div class="empty">
        搜尋中...
      </div>`;

  } else {

    /*
     * 已經有資料時，
     * 保留原本畫面。
     *
     * 不清空。
     */
  }


  try {

    const result =
      await apiGet({
        action: "songs",
        q: keyword,
        language: currentLanguage,
        category: currentCategory
      });


    /*
     * ★ 舊請求直接丟棄
     *
     * 例如：
     *
     * 搜尋「周」
     * requestId = 1
     *
     * 馬上搜尋「周杰倫」
     * requestId = 2
     *
     * 如果 request 1 比 request 2 晚回來，
     * request 1 不可以再更新畫面。
     */
    if (
      requestId !== songSearchRequestId
    ) {

      return;
    }


    if (!result.success) {

      throw new Error(
        result.message ||
        "歌曲搜尋失敗"
      );
    }


    allSongs =
      Array.isArray(result.data)
        ? result.data
        : [];


    /*
     * 只在真正拿到最新結果後 render。
     */
    renderSongList();

  } catch (error) {

    /*
     * 舊請求的錯誤也不要影響目前畫面。
     */
    if (
      requestId !== songSearchRequestId
    ) {

      return;
    }


    console.error(
      "歌曲搜尋失敗：",
      error
    );


    list.innerHTML =
      `<div class="empty">
        歌曲搜尋失敗<br>
        <small>
          ${escapeHtml(
            error.message || ""
          )}
        </small>
      </div>`;
  }
}


/* =================================================
 * 歌曲列表
 * ================================================= */

function renderSongList() {

  const list =
    document.getElementById(
      "songList"
    );


  if (!list) {
    return;
  }


  if (
    !Array.isArray(allSongs) ||
    allSongs.length === 0
  ) {

    list.innerHTML =
      `<div class="empty">
        找不到符合的歌曲
      </div>`;

    return;
  }


  const keyword =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim();


  let displaySongs =
    [...allSongs];


  /*
   * Fuse.js 模糊搜尋
   *
   * 後端已經做過搜尋，
   * 這裡只做前端排序／補強。
   */
  if (keyword) {

    try {

      const fuse =
        new Fuse(
          allSongs,
          {
            keys: [
              "title",
              "artist",
              "song_no",
              "brand"
            ],

            threshold: 0.4,

            ignoreLocation: true,

            minMatchCharLength: 1
          }
        );


      const fuzzyResults =
        fuse.search(keyword);


      /*
       * 如果 Fuse 找不到，
       * 不要直接把後端結果全部清掉。
       *
       * 因為中文關鍵字有時候 Fuse
       * 會判定得比較嚴格。
       *
       * 保留後端結果。
       */
      if (
        fuzzyResults.length > 0
      ) {

        displaySongs =
          fuzzyResults.map(
            result =>
              result.item
          );
      }

    } catch (error) {

      console.warn(
        "Fuse 搜尋失敗",
        error
      );

    }
  }


  /* =================================================
   * 排序
   * ================================================= */

  const sortSelect =
    document.getElementById(
      "sortSelect"
    );


  const sortType =
    sortSelect
      ? sortSelect.value
      : "default";


  if (
    sortType ===
    "title_len_asc"
  ) {

    displaySongs.sort(
      (a, b) =>
        String(a.title || "")
          .length -
        String(b.title || "")
          .length
    );

  } else if (
    sortType ===
    "title_len_desc"
  ) {

    displaySongs.sort(
      (a, b) =>
        String(b.title || "")
          .length -
        String(a.title || "")
          .length
    );

  } else if (
    sortType ===
    "artist_len_asc"
  ) {

    displaySongs.sort(
      (a, b) =>
        String(a.artist || "")
          .length -
        String(b.artist || "")
          .length
    );

  } else if (
    sortType ===
    "artist_len_desc"
  ) {

    displaySongs.sort(
      (a, b) =>
        String(b.artist || "")
          .length -
        String(a.artist || "")
          .length
    );
  }


  if (
    displaySongs.length === 0
  ) {

    list.innerHTML =
      `<div class="empty">
        找不到符合的歌曲
      </div>`;

    return;
  }


  /*
   * 產生歌曲 HTML
   */
  list.innerHTML =
    displaySongs
      .map(song => {

        const songNo =
          String(
            song.song_no || ""
          );


        const isFavorite =
          favorites.includes(
            songNo
          );


        const categoryText =
          song.category
            ? ` · ${escapeHtml(
                song.category
              )}`
            : "";


        const brandText =
          song.brand
            ? ` · ${escapeHtml(
                song.brand
              )}`
            : "";


        return `
          <div class="song">

            <div class="cover">
              🎤
            </div>

            <div class="song-info">

              <div class="song-title">
                [${escapeHtml(songNo)}]
                ${escapeHtml(
                  song.title || ""
                )}
              </div>

              <div class="artist">
                ${escapeHtml(
                  song.artist || ""
                )}
                ·
                ${escapeHtml(
                  song.language ||
                  "未分類"
                )}
                ${categoryText}
                ${brandText}
              </div>

            </div>

            <div class="song-actions">

              <button
                class="favorite ${
                  isFavorite
                    ? "active"
                    : ""
                }"
                onclick="toggleFavorite('${escapeJs(songNo)}')">
                ${
                  isFavorite
                    ? "♥"
                    : "♡"
                }
              </button>

              <button
                class="add-btn"
                onclick="addSong('${escapeJs(songNo)}')">
                ＋ 點歌
              </button>

            </div>

          </div>
        `;

      })
      .join("");
}


/* =================================================
 * 新增歌曲到待播
 * ================================================= */

function addSong(songNo) {

  const song =
    allSongs.find(
      s =>
        String(s.song_no) ===
        String(songNo)
    );


  if (!song) {

    showToast(
      "找不到歌曲"
    );

    return;
  }


  queue.push({
    ...song,

    queueId:
      Date.now() +
      Math.random()
  });


  saveQueue();

  renderQueue();

  showToast(
    `已點歌：${song.title}`
  );
}


/* =================================================
 * 待播清單
 * ================================================= */

function renderQueue() {

  const list =
    document.getElementById(
      "queueList"
    );

  const count =
    document.getElementById(
      "queueCount"
    );


  if (!list || !count) {
    return;
  }


  count.textContent =
    `${queue.length} 首`;


  if (
    queue.length === 0
  ) {

    list.innerHTML =
      `<div class="empty">
        目前沒有待播歌曲<br>
        選擇歌曲開始點歌吧 🎤
      </div>`;

    return;
  }


  list.innerHTML =
    queue
      .map(
        (song, index) => {

          return `
            <div
              class="song"
              style="
                display:flex;
                align-items:center;
                justify-content:space-between;
              ">

              <div
                style="
                  display:flex;
                  align-items:center;
                  gap:10px;
                  flex:1;
                  min-width:0;
                ">

                <div
                  class="queue-number"
                  style="
                    font-weight:bold;
                    min-width:24px;
                    text-align:center;
                  ">
                  ${index + 1}
                </div>

                <div class="cover">
                  🎤
                </div>

                <div
                  class="song-info"
                  style="
                    min-width:0;
                    flex:1;
                  ">

                  <div class="song-title">
                    [${escapeHtml(
                      song.song_no
                    )}]
                    ${escapeHtml(
                      song.title
                    )}
                  </div>

                  <div
                    class="artist"
                    style="
                      overflow:hidden;
                      text-overflow:ellipsis;
                      white-space:nowrap;
                    ">

                    ${escapeHtml(
                      song.artist
                    )}

                    ·

                    ${escapeHtml(
                      song.language ||
                      "未分類"
                    )}

                    ${
                      song.brand
                        ? " · " +
                          escapeHtml(
                            song.brand
                          )
                        : ""
                    }

                  </div>

                </div>

              </div>

              <div
                class="song-actions"
                style="
                  margin-left:10px;
                ">

                <button
                  class="remove-btn"
                  onclick="removeSong(${song.queueId})"
                  style="
                    padding:4px 8px;
                  ">
                  ×
                </button>

              </div>

            </div>
          `;
        }
      )
      .join("");
}


/* =================================================
 * 移除歌曲
 * ================================================= */

function removeSong(queueId) {

  queue =
    queue.filter(
      song =>
        song.queueId !==
        queueId
    );


  saveQueue();

  renderQueue();

  showToast(
    "已移除歌曲"
  );
}


/* =================================================
 * 播放目前歌曲
 * ================================================= */

function playCurrent() {

  if (!currentSong) {

    if (
      queue.length === 0
    ) {

      showToast(
        "目前沒有待播歌曲"
      );

      return;
    }


    currentSong =
      queue[0];
  }


  const player =
    document.getElementById(
      "audioPlayer"
    );


  if (!player) {
    return;
  }


  const media =
    currentSong.media ||
    `music/${encodeURIComponent(
      currentSong.title
    )}.mp3`;


  player.src = media;


  document.getElementById(
    "currentTitle"
  ).textContent =
    `[${currentSong.song_no}] ${currentSong.title}`;


  document.getElementById(
    "currentArtist"
  ).textContent =
    currentSong.artist ||
    "-";


  player
    .play()
    .catch(error => {

      console.warn(
        "音樂播放失敗",
        error
      );

      showToast(
        "找不到音樂檔案或瀏覽器阻擋自動播放"
      );
    });
}


/* =================================================
 * 下一首
 * ================================================= */

function nextSong() {

  if (
    queue.length === 0
  ) {

    currentSong = null;


    document.getElementById(
      "currentTitle"
    ).textContent =
      "尚未播放";


    document.getElementById(
      "currentArtist"
    ).textContent =
      "-";


    const player =
      document.getElementById(
        "audioPlayer"
      );


    player.removeAttribute(
      "src"
    );


    player.load();


    showToast(
      "沒有下一首歌曲"
    );

    return;
  }


  currentSong =
    queue.shift();


  saveQueue();

  renderQueue();

  playCurrent();
}


/* =================================================
 * 收藏
 * ================================================= */

function toggleFavorite(
  songNo
) {

  songNo =
    String(songNo);


  if (
    favorites.includes(
      songNo
    )
  ) {

    favorites =
      favorites.filter(
        item =>
          item !== songNo
      );


    showToast(
      "已取消收藏"
    );

  } else {

    favorites.push(
      songNo
    );


    showToast(
      "已加入收藏"
    );
  }


  localStorage.setItem(
    "ktvFavorites",
    JSON.stringify(
      favorites
    )
  );


  renderSongList();
}


/* =================================================
 * 儲存待播清單
 * ================================================= */

function saveQueue() {

  try {

    localStorage.setItem(
      "ktvQueue",
      JSON.stringify(queue)
    );

  } catch (error) {

    console.error(
      "待播清單儲存失敗",
      error
    );
  }
}


/* =================================================
 * 客戶 Modal
 * ================================================= */

function openCustomerModal() {

  document
    .getElementById(
      "customerModal"
    )
    .classList.add("show");


  document.getElementById(
    "customerSearch"
  ).value = "";


  document.getElementById(
    "customerResults"
  ).innerHTML =
    `<div class="empty">
      請輸入客戶姓名
    </div>`;


  document.getElementById(
    "createCustomerArea"
  ).style.display =
    "none";


  cancelEditCustomer();


  setTimeout(() => {

    document.getElementById(
      "customerSearch"
    ).focus();

  }, 100);
}


/* =================================================
 * 關閉客戶 Modal
 * ================================================= */

function closeCustomerModal() {

  document
    .getElementById(
      "customerModal"
    )
    .classList.remove(
      "show"
    );
}


/* =================================================
 * 搜尋客戶
 * ================================================= */

async function searchCustomers(
  keyword
) {

  const requestId =
    ++customerSearchRequestId;


  const resultBox =
    document.getElementById(
      "customerResults"
    );


  resultBox.innerHTML =
    `<div class="empty">
      搜尋中...
    </div>`;


  try {

    const result =
      await apiGet({
        action: "customers",
        q: keyword
      });


    /*
     * 舊客戶搜尋結果不更新畫面。
     */
    if (
      requestId !==
      customerSearchRequestId
    ) {

      return;
    }


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        "搜尋失敗"
      );
    }


    if (
      !result.data ||
      result.data.length === 0
    ) {

      resultBox.innerHTML =
        `<div class="empty">
          找不到「${escapeHtml(
            keyword
          )}」
          <br><br>
          可以按下方「新增客戶」
        </div>`;

      return;
    }


    resultBox.innerHTML =
      result.data
        .map(
          customer => {

            return `
              <div class="customer-card">

                <div
                  style="
                    min-width:0
                  ">

                  <div
                    class="customer-card-name">
                    ${escapeHtml(
                      customer.name
                    )}
                  </div>

                  <div
                    class="customer-card-info">

                    ${
                      customer.phone
                        ? escapeHtml(
                            customer.phone
                          )
                        : "未提供電話"
                    }

                    ${
                      customer.note
                        ? " · " +
                          escapeHtml(
                            customer.note
                          )
                        : ""
                    }

                  </div>

                </div>

                <div
                  class="customer-actions">

                  <button
                    class="edit-customer"
                    onclick="showEditCustomer(
                      '${escapeJs(
                        customer.customer_id
                      )}',
                      '${escapeJs(
                        customer.name
                      )}',
                      '${escapeJs(
                        customer.phone
                      )}',
                      '${escapeJs(
                        customer.note
                      )}'
                    )">

                    ✏️ 編輯

                  </button>

                  <button
                    class="select-customer"
                    onclick="selectCustomer(
                      '${escapeJs(
                        customer.customer_id
                      )}',
                      '${escapeJs(
                        customer.name
                      )}'
                    )">

                    選擇

                  </button>

                </div>

              </div>
            `;
          }
        )
        .join("");


  } catch (error) {

    if (
      requestId !==
      customerSearchRequestId
    ) {

      return;
    }


    console.error(
      "客戶搜尋失敗",
      error
    );


    resultBox.innerHTML =
      `<div class="empty">
        客戶搜尋失敗
      </div>`;
  }
}


/* =================================================
 * 選擇客戶
 * ================================================= */

function selectCustomer(
  customerId,
  name
) {

  currentCustomer = {
    customer_id:
      customerId,
    name:
      name
  };


  localStorage.setItem(
    "currentCustomer",
    JSON.stringify(
      currentCustomer
    )
  );


  updateCustomerUI();

  closeCustomerModal();


  showToast(
    `目前客戶：${name}`
  );


  setTimeout(() => {

    if (
      confirm(
        `是否載入「${name}」的歷史歌單？`
      )
    ) {

      openHistory();
    }

  }, 200);
}


/* =================================================
 * 客戶 UI
 * ================================================= */

function updateCustomerUI() {

  const info =
    document.getElementById(
      "customerInfo"
    );

  const clearBtn =
    document.getElementById(
      "clearCustomerBtn"
    );


  if (
    !currentCustomer
  ) {

    info.textContent =
      "尚未選擇客戶";

    clearBtn.style.display =
      "none";

    return;
  }


  info.innerHTML =
    `目前客戶：
      <span class="customer-name">
        ${escapeHtml(
          currentCustomer.name
        )}
      </span>`;


  clearBtn.style.display =
    "block";
}


/* =================================================
 * 清除客戶
 * ================================================= */

function clearCustomer() {

  if (
    queue.length > 0
  ) {

    if (
      !confirm(
        "目前還有待播歌曲，確定要清除客戶嗎？"
      )
    ) {

      return;
    }
  }


  currentCustomer = null;


  localStorage.removeItem(
    "currentCustomer"
  );


  updateCustomerUI();


  showToast(
    "已清除目前客戶"
  );
}


/* =================================================
 * 新增客戶區域
 * ================================================= */

function showCreateCustomer() {

  const area =
    document.getElementById(
      "createCustomerArea"
    );


  area.style.display =
    area.style.display === "none"
      ? "block"
      : "none";
}


/* =================================================
 * 新增客戶
 * ================================================= */

async function createCustomer() {

  const name =
    document
      .getElementById(
        "newCustomerName"
      )
      .value
      .trim();


  const phone =
    document
      .getElementById(
        "newCustomerPhone"
      )
      .value
      .trim();


  const note =
    document
      .getElementById(
        "newCustomerNote"
      )
      .value
      .trim();


  if (!name) {

    showToast(
      "請輸入客戶姓名"
    );

    return;
  }


  try {

    const result =
      await apiPost({
        action:
          "createCustomer",

        name,
        phone,
        note
      });


    if (
      !result.success
    ) {

      throw new Error(
        result.message
      );
    }


    currentCustomer = {
      customer_id:
        result.data.customer_id,

      name:
        result.data.name
    };


    localStorage.setItem(
      "currentCustomer",
      JSON.stringify(
        currentCustomer
      )
    );


    updateCustomerUI();

    closeCustomerModal();


    document.getElementById(
      "newCustomerName"
    ).value = "";


    document.getElementById(
      "newCustomerPhone"
    ).value = "";


    document.getElementById(
      "newCustomerNote"
    ).value = "";


    showToast(
      `客戶建立成功：${name}`
    );


  } catch (error) {

    console.error(
      "新增客戶失敗",
      error
    );


    showToast(
      error.message ||
      "新增客戶失敗"
    );
  }
}


/* =================================================
 * 編輯客戶
 * ================================================= */

function showEditCustomer(
  customerId,
  name,
  phone,
  note
) {

  editingCustomerId =
    customerId;


  document.getElementById(
    "editCustomerId"
  ).textContent =
    `客戶代碼：${customerId}`;


  document.getElementById(
    "editCustomerName"
  ).value =
    name || "";


  document.getElementById(
    "editCustomerPhone"
  ).value =
    phone || "";


  document.getElementById(
    "editCustomerNote"
  ).value =
    note || "";


  document.getElementById(
    "editCustomerArea"
  ).style.display =
    "block";


  document.getElementById(
    "createCustomerArea"
  ).style.display =
    "none";


  document.getElementById(
    "editCustomerName"
  ).focus();
}


/* =================================================
 * 取消編輯
 * ================================================= */

function cancelEditCustomer() {

  editingCustomerId =
    null;


  const area =
    document.getElementById(
      "editCustomerArea"
    );


  if (area) {

    area.style.display =
      "none";
  }
}


/* =================================================
 * 更新客戶
 * ================================================= */

async function updateCustomer() {

  if (
    !editingCustomerId
  ) {

    showToast(
      "沒有選擇要編輯的客戶"
    );

    return;
  }


  const name =
    document
      .getElementById(
        "editCustomerName"
      )
      .value
      .trim();


  const phone =
    document
      .getElementById(
        "editCustomerPhone"
      )
      .value
      .trim();


  const note =
    document
      .getElementById(
        "editCustomerNote"
      )
      .value
      .trim();


  if (!name) {

    showToast(
      "客戶姓名不能空白"
    );

    return;
  }


  if (
    !confirm(
      `確定要修改客戶「${name}」的資料嗎？`
    )
  ) {

    return;
  }


  try {

    const result =
      await apiPost({
        action:
          "updateCustomer",

        customer_id:
          editingCustomerId,

        name,
        phone,
        note
      });


    if (
      !result.success
    ) {

      throw new Error(
        result.message
      );
    }


    if (
      currentCustomer &&
      String(
        currentCustomer.customer_id
      ) ===
      String(
        editingCustomerId
      )
    ) {

      currentCustomer.name =
        name;


      localStorage.setItem(
        "currentCustomer",
        JSON.stringify(
          currentCustomer
        )
      );


      updateCustomerUI();
    }


    showToast(
      "客戶資料更新成功"
    );


    const keyword =
      document
        .getElementById(
          "customerSearch"
        )
        .value
        .trim();


    if (keyword) {

      await searchCustomers(
        keyword
      );
    }


    cancelEditCustomer();


  } catch (error) {

    console.error(
      "更新客戶失敗",
      error
    );


    showToast(
      error.message ||
      "客戶資料更新失敗"
    );
  }
}


/* =================================================
 * 開啟歷史歌單
 * ================================================= */

async function openHistory() {

  if (
    !currentCustomer
  ) {

    showToast(
      "請先選擇客戶"
    );

    return;
  }


  document
    .getElementById(
      "historyModal"
    )
    .classList.add("show");


  document.getElementById(
    "historyCustomerName"
  ).textContent =
    `客戶：${currentCustomer.name}`;


  const list =
    document.getElementById(
      "historyList"
    );


  list.innerHTML =
    `<div class="empty">
      載入歷史歌單中...
    </div>`;


  try {

    const result =
      await apiGet({
        action:
          "history",

        customer_id:
          currentCustomer.customer_id
      });


    if (
      !result.success
    ) {

      throw new Error(
        result.message
      );
    }


    if (
      !result.data ||
      result.data.length === 0
    ) {

      list.innerHTML =
        `<div class="empty">
          此客戶目前沒有歷史歌單
        </div>`;

      return;
    }


    list.innerHTML =
      result.data
        .map(
          song => {

            return `
              <div
                class="song"
                style="
                  display:flex;
                  align-items:center;
                  justify-content:space-between;
                  margin:0 0 10px 0;
                ">

                <div
                  style="
                    display:flex;
                    align-items:center;
                    gap:10px;
                    flex:1;
                    min-width:0;
                  ">

                  <div class="cover">
                    📜
                  </div>

                  <div
                    class="song-info"
                    style="
                      min-width:0;
                      flex:1;
                    ">

                    <div class="song-title">
                      [${escapeHtml(
                        song.song_no
                      )}]
                      ${escapeHtml(
                        song.title
                      )}
                    </div>

                    <div
                      class="artist"
                      style="
                        overflow:hidden;
                        text-overflow:ellipsis;
                        white-space:nowrap;
                      ">

                      ${escapeHtml(
                        song.artist
                      )}

                      ·

                      ${escapeHtml(
                        song.language ||
                        "未分類"
                      )}

                      ${
                        song.brand
                          ? " · " +
                            escapeHtml(
                              song.brand
                            )
                          : ""
                      }

                    </div>

                  </div>

                </div>

                <div
                  class="song-actions"
                  style="
                    margin-left:10px;
                  ">

                  <button
                    class="add-btn"
                    onclick="addHistorySong(
                      '${escapeJs(
                        song.song_no
                      )}',
                      '${escapeJs(
                        song.title
                      )}',
                      '${escapeJs(
                        song.artist
                      )}',
                      '${escapeJs(
                        song.brand
                      )}',
                      '${escapeJs(
                        song.language
                      )}'
                    )">

                    ＋ 點歌

                  </button>

                </div>

              </div>
            `;
          }
        )
        .join("");


  } catch (error) {

    console.error(
      "歷史歌單載入失敗",
      error
    );


    list.innerHTML =
      `<div class="empty">
        歷史歌單載入失敗
      </div>`;
  }
}


/* =================================================
 * 關閉歷史 Modal
 * ================================================= */

function closeHistoryModal() {

  document
    .getElementById(
      "historyModal"
    )
    .classList.remove(
      "show"
    );
}


/* =================================================
 * 從歷史歌單加入歌曲
 * ================================================= */

function addHistorySong(
  songNo,
  title,
  artist,
  brand,
  language
) {

  queue.push({

    song_no:
      songNo,

    title:
      title,

    artist:
      artist,

    brand:
      brand,

    language:
      language,

    queueId:
      Date.now() +
      Math.random()
  });


  saveQueue();

  renderQueue();


  showToast(
    `已加入：${title}`
  );
}


/* =================================================
 * 結束本次服務
 * ================================================= */

async function endService() {

  if (
    !currentCustomer
  ) {

    showToast(
      "請先選擇客戶"
    );

    return;
  }


  if (
    queue.length === 0
  ) {

    showToast(
      "目前沒有點歌紀錄"
    );

    return;
  }


  const ok =
    confirm(
      `確定結束「${currentCustomer.name}」本次服務？\n\n` +
      `目前 ${queue.length} 首歌曲會寫入歷史歌單。`
    );


  if (!ok) {
    return;
  }


  try {

    const result =
      await apiPost({

        action:
          "saveHistory",

        customer_id:
          currentCustomer.customer_id,

        customer_name:
          currentCustomer.name,

        songs:
          queue

      });


    if (
      !result.success
    ) {

      throw new Error(
        result.message
      );
    }


    queue = [];

    currentSong = null;

    saveQueue();

    renderQueue();


    document.getElementById(
      "currentTitle"
    ).textContent =
      "尚未播放";


    document.getElementById(
      "currentArtist"
    ).textContent =
      "-";


    const player =
      document.getElementById(
        "audioPlayer"
      );


    player.removeAttribute(
      "src"
    );


    player.load();


    currentCustomer = null;


    localStorage.removeItem(
      "currentCustomer"
    );


    updateCustomerUI();


    showToast(
      "本次服務已完成，歷史歌單已儲存"
    );


  } catch (error) {

    console.error(
      "儲存歷史歌單失敗",
      error
    );


    showToast(
      "歷史歌單儲存失敗，沒有清除資料"
    );
  }
}


/* =================================================
 * Toast
 * ================================================= */

function showToast(
  message
) {

  const toast =
    document.getElementById(
      "toast"
    );


  if (!toast) {
    return;
  }


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(() => {

      toast.classList.remove(
        "show"
      );

    }, 2500);
}


/* =================================================
 * HTML Escape
 * ================================================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


/* =================================================
 * JavaScript String Escape
 * ================================================= */

function escapeJs(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    )

    .replace(
      /\r/g,
      "\\r"
    )

    .replace(
      /\n/g,
      "\\n"
    );
}
