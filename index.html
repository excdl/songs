<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTV 點歌系統 - 據點驗證與點歌</title>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
<style>
html { font-size: 130%; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
  background: radial-gradient(circle at top, #24104d 0%, #0b0b16 45%, #050509 100%);
  color: #fff;
  min-height: 100vh;
}

/* 🔒 據點驗證全螢幕遮罩層 */
#authOverlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 5, 9, 0.96);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(12px);
  transition: opacity 0.4s ease;
}
.auth-card {
  background: #171725;
  border: 1px solid #343449;
  border-radius: 20px;
  padding: 35px 25px;
  width: 100%;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.7);
}
.auth-title {
  font-size: 1.4rem;
  font-weight: bold;
  margin-bottom: 12px;
  background: linear-gradient(90deg, #ff2bd6, #8c5cff, #22d3ee);
  -webkit-background-clip: text;
  color: transparent;
}
.auth-desc {
  color: #bbb;
  font-size: 0.92rem;
  margin-bottom: 24px;
  line-height: 1.6;
}
.auth-spinner {
  width: 45px;
  height: 45px;
  border: 4px solid rgba(255,255,255,0.1);
  border-top-color: #ff2bd6;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.auth-btn {
  width: 100%;
  height: 48px;
  border-radius: 12px;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  color: white;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 1rem;
  margin-top: 15px;
  transition: opacity 0.2s;
}
.auth-btn:hover { opacity: 0.9; }
.auth-error {
  color: #ff4d6d;
  font-size: 0.88rem;
  margin-top: 15px;
  white-space: pre-line;
  line-height: 1.5;
}

/* 系統主介面樣式 */
header {
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  background: rgba(10,10,20,.92);
  border-bottom: 1px solid rgba(255,255,255,.08);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.logo {
  font-size: 1.35rem;
  font-weight: bold;
  background: linear-gradient(90deg, #ff2bd6, #8c5cff, #22d3ee);
  -webkit-background-clip: text;
  color: transparent;
}
.customer-area {
  display: flex;
  align-items: center;
  gap: 10px;
}
.customer-info {
  color: #bbb;
  font-size: 0.85rem;
}
.customer-name {
  color: white;
  font-weight: bold;
}
.customer-btn {
  background: #29293a;
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid #3a3a4d;
  cursor: pointer;
  font-size: 0.85rem;
}
.customer-btn:hover {
  background: #3b3b50;
}
main {
  max-width: 1400px;
  margin: auto;
  padding: 25px;
}
.search-area {
  margin-bottom: 15px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.search-box {
  position: relative;
  flex: 1;
  min-width: 250px;
}
.search-box input {
  width: 100%;
  height: 52px;
  border: 1px solid #38384c;
  border-radius: 12px;
  padding: 0 20px 0 48px;
  background: #151522;
  color: white;
  outline: none;
  font-size: 1rem;
}
.search-box input:focus {
  border-color: #9b5cff;
  box-shadow: 0 0 0 3px rgba(155,92,255,.15);
}
.search-icon {
  position: absolute;
  left: 18px;
  top: 15px;
  font-size: 1.1rem;
  color: #999;
}
.sort-box select {
  height: 52px;
  padding: 0 16px;
  border-radius: 12px;
  border: 1px solid #38384c;
  background: #151522;
  color: white;
  outline: none;
  font-size: 0.95rem;
  cursor: pointer;
}
.sort-box select:focus {
  border-color: #9b5cff;
}
.quick-search {
  margin-bottom: 20px;
  padding: 15px;
  background: rgba(18,18,29,.75);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 15px;
}
.quick-title {
  color: #aaa;
  font-size: 0.82rem;
  margin-bottom: 10px;
}
.quick-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 4px;
}
.category {
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 30px;
  background: #171725;
  color: #aaa;
  border: 1px solid #2d2d3d;
  cursor: pointer;
  font-size: 0.85rem;
  transition: .2s;
}
.category:hover {
  background: #29293d;
  color: white;
}
.category.active {
  color: white;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  border-color: transparent;
}
.content {
  display: grid;
  grid-template-columns: 1fr 420px;
  gap: 25px;
}
.section-title {
  font-size: 1.1rem;
  font-weight: bold;
  margin-bottom: 16px;
}
.song-list {
  display: grid;
  gap: 12px;
}
.song {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  border: 1px solid rgba(255,255,255,.07);
  background: rgba(25,25,38,.75);
  border-radius: 14px;
  transition: .2s;
}
.song:hover {
  background: #222235;
  transform: translateY(-1px);
}
.cover {
  width: 56px;
  height: 56px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 1.3rem;
  background: linear-gradient(135deg, #ff2bd6, #653eff);
}
.song-info {
  flex: 1;
  min-width: 0;
}
.song-title {
  font-size: 1rem;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.artist {
  color: #999;
  font-size: 0.85rem;
  margin-top: 4px;
}
.song-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.favorite {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: #292938;
  color: #aaa;
  font-size: 1.1rem;
  cursor: pointer;
  border: none;
}
.favorite.active {
  color: #ff3e91;
}
.add-btn {
  padding: 8px 14px;
  border-radius: 9px;
  color: white;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 0.85rem;
}
.queue-panel {
  background: rgba(18,18,29,.9);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 18px;
  padding: 20px;
  height: fit-content;
  position: sticky;
  top: 95px;
}
.queue-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.queue-count {
  color: #aaa;
  font-size: 0.85rem;
}
.queue-list {
  display: grid;
  gap: 10px;
  max-height: 380px;
  overflow-y: auto;
}
.queue-number {
  width: 26px;
  color: #8d7aff;
  font-weight: bold;
  text-align: center;
  font-size: 0.95rem;
}
.remove-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  color: #888;
  background: transparent;
  font-size: 1.2rem;
  border: none;
  cursor: pointer;
}
.player {
  margin-top: 18px;
  background: linear-gradient(135deg, #251040, #111126);
  border-radius: 16px;
  padding: 16px;
}
.now-playing {
  color: #aaa;
  font-size: 0.75rem;
  margin-bottom: 4px;
}
.current-title {
  font-size: 1rem;
  font-weight: bold;
}
.current-artist {
  font-size: 0.85rem;
  color: #888;
  margin-top: 3px;
}
audio {
  width: 100%;
  margin-top: 10px;
}
.player-controls {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.control-btn {
  flex: 1;
  height: 40px;
  border-radius: 9px;
  background: #29293a;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 0.9rem;
}
.play-btn {
  background: linear-gradient(135deg, #ff2bd6, #744cff);
}
.volume {
  margin-top: 10px;
}
.volume input {
  width: 100%;
}
.end-service {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border-radius: 9px;
  background: linear-gradient(135deg, #e43b62, #9b2f80);
  color: white;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
}
.empty {
  color: #777;
  text-align: center;
  padding: 25px 10px;
  font-size: 0.9rem;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%) translateY(20px);
  background: #242435;
  color: white;
  padding: 12px 20px;
  border-radius: 30px;
  opacity: 0;
  pointer-events: none;
  transition: .3s;
  z-index: 9999;
  font-size: 0.9rem;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 500;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal.show {
  display: flex;
}
.modal-box {
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  background: #171725;
  border: 1px solid #343449;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.modal-title {
  font-size: 1.1rem;
  font-weight: bold;
}
.close-btn {
  width: 35px;
  height: 35px;
  border-radius: 8px;
  background: #292938;
  color: white;
  font-size: 1.1rem;
  border: none;
  cursor: pointer;
}
.modal-input {
  width: 100%;
  height: 45px;
  padding: 0 14px;
  border-radius: 9px;
  border: 1px solid #3a3a4d;
  background: #10101a;
  color: white;
  outline: none;
  margin-bottom: 12px;
  font-size: 0.95rem;
}
.modal-input:focus {
  border-color: #9b5cff;
}
.primary-btn {
  width: 100%;
  height: 45px;
  border-radius: 9px;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  color: white;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
}
.secondary-btn {
  width: 100%;
  height: 45px;
  border-radius: 9px;
  background: #292938;
  color: white;
  margin-top: 10px;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
}
.customer-result {
  display: grid;
  gap: 10px;
  margin-top: 15px;
}
.customer-card {
  padding: 14px;
  background: #222235;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.customer-card-name {
  font-weight: bold;
  font-size: 1rem;
}
.customer-card-info {
  color: #888;
  font-size: 0.8rem;
  margin-top: 4px;
}
.customer-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.select-customer,
.edit-customer {
  padding: 8px 12px;
  border-radius: 8px;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 0.8rem;
}
.select-customer {
  background: linear-gradient(135deg, #ff2bd6, #744cff);
}
.edit-customer {
  background: #39394d;
}
.edit-customer:hover {
  background: #4a4a62;
}
.history-list {
  display: grid;
  gap: 10px;
  margin-top: 15px;
}
.edit-customer-area {
  display: none;
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid rgba(255,255,255,.08);
}
.edit-title {
  color: #aaa;
  margin-bottom: 10px;
  font-size: 0.85rem;
}
.edit-customer-id {
  color: #777;
  font-size: 0.75rem;
  margin-bottom: 10px;
}
@media(max-width:900px) {
  .content {
    grid-template-columns: 1fr;
  }
  .queue-panel {
    position: static;
  }
  header {
    padding: 0 15px;
  }
  .logo {
    font-size: 1.1rem;
  }
  .customer-info {
    display: none;
  }
}
#categoryContainer {
  display: none !important;
}
</style>
</head>
<body>

<!-- 🔒 據點安全性驗證遮罩 -->
<div id="authOverlay">
  <div class="auth-card">
    <div class="auth-title">🎤 據點安全驗證</div>
    <div class="auth-desc" id="authDesc">正在取得您的 GPS 定位，請允許瀏覽器權限...</div>
    <div class="auth-spinner" id="authSpinner"></div>
    <div class="auth-error" id="authError"></div>
    <button class="auth-btn" id="retryAuthBtn" style="display:none;" onclick="checkLocationAuth()">重新驗證據點</button>
  </div>
</div>

<header>
  <div class="logo">🎤 KTV 點歌系統</div>
  <div class="customer-area">
    <div class="customer-info" id="customerInfo">尚未選擇客戶</div>
    <button class="customer-btn" onclick="openCustomerModal()">👤 新增／選擇客戶</button>
    <button class="customer-btn" id="clearCustomerBtn" style="display:none" onclick="clearCustomer()">清除</button>
  </div>
</header>

<main>
  <div class="search-area">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="輸入歌名、歌手或歌號..." autocomplete="off">
    </div>
    <div class="sort-box">
      <select id="sortSelect" onchange="renderSongList()">
        <option value="default">預設排序</option>
        <option value="title_len_asc">歌名字數：少 ➔ 多</option>
        <option value="title_len_desc">歌名字數：多 ➔ 少</option>
        <option value="artist_len_asc">歌手字數：少 ➔ 多</option>
        <option value="artist_len_desc">歌手字數：多 ➔ 少</option>
      </select>
    </div>
  </div>
  <div class="quick-search">
    <div class="quick-title">🌐 快速語言搜尋</div>
    <div class="quick-row" id="languageContainer"></div>
  </div>
  <div class="quick-search">
    <div class="quick-title">🎵 快速分類搜尋</div>
    <div class="quick-row" id="categoryContainer"></div>
  </div>
  <div class="content">
    <section>
      <div class="section-title">🎵 歌曲列表</div>
      <div class="song-list" id="songList">
        <div class="empty">請輸入歌名、歌手或歌號開始搜尋<br>或直接點選上方語言／分類</div>
      </div>
    </section>
    <aside class="queue-panel">
      <div class="queue-header">
        <div class="section-title">📋 待播歌曲</div>
        <div class="queue-count" id="queueCount">0 首</div>
      </div>
      <div class="queue-list" id="queueList"></div>
      <div class="player">
        <div class="now-playing">NOW PLAYING</div>
        <div class="current-title" id="currentTitle">尚未播放</div>
        <div class="current-artist" id="currentArtist">-</div>
        <audio id="audioPlayer" controls></audio>
        <div class="player-controls">
          <button class="control-btn play-btn" onclick="playCurrent()">▶ 播放</button>
          <button class="control-btn" onclick="nextSong()">⏭ 下一首</button>
        </div>
        <div class="volume">
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
        </div>
        <button class="end-service" onclick="endService()">🔚 結束本次服務</button>
      </div>
    </aside>
  </div>
</main>

<div class="modal" id="customerModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">👤 客戶管理</div>
      <button class="close-btn" onclick="closeCustomerModal()">×</button>
    </div>
    <input class="modal-input" id="customerSearch" placeholder="請輸入客戶姓名搜尋..." autocomplete="off">
    <div class="customer-result" id="customerResults">
      <div class="empty">請輸入客戶姓名</div>
    </div>
    <button class="secondary-btn" onclick="showCreateCustomer()">＋ 新增客戶</button>
    <div id="createCustomerArea" style="display:none;margin-top:20px">
      <div style="color:#aaa;margin-bottom:8px;font-size:0.85rem;">新增客戶</div>
      <input class="modal-input" id="newCustomerName" placeholder="客戶姓名">
      <input class="modal-input" id="newCustomerPhone" placeholder="電話（選填）">
      <input class="modal-input" id="newCustomerNote" placeholder="備註（選填）">
      <button class="primary-btn" onclick="createCustomer()">建立客戶</button>
    </div>
    <div id="editCustomerArea" class="edit-customer-area">
      <div class="edit-title">✏️ 編輯舊客戶</div>
      <div class="edit-customer-id" id="editCustomerId"></div>
      <input class="modal-input" id="editCustomerName" placeholder="客戶姓名">
      <input class="modal-input" id="editCustomerPhone" placeholder="電話（選填）">
      <input class="modal-input" id="editCustomerNote" placeholder="備註（選填）">
      <button class="primary-btn" onclick="updateCustomer()">💾 儲存客戶資料</button>
      <button class="secondary-btn" onclick="cancelEditCustomer()">取消編輯</button>
    </div>
  </div>
</div>

<div class="modal" id="historyModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">📜 歷史歌單</div>
      <button class="close-btn" onclick="closeHistoryModal()">×</button>
    </div>
    <div id="historyCustomerName" style="color:#aaa;margin-bottom:10px;font-size:0.9rem;"></div>
    <div class="history-list" id="historyList">
      <div class="empty">載入中...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL =
  "https://script.google.com/macros/s/AKfycbzsMpGjV5_2ZtH3Oo_DlJnVet18ekkffwfqrlkQlg3p2aevq_VlgseihmzbJrwAAdOA/exec";


let allSongs = [];

let currentLanguage = "全部";
let currentCategory = "全部";

let currentCustomer = null;

let queue =
  JSON.parse(
    localStorage.getItem("ktvQueue") || "[]"
  );

let favorites =
  JSON.parse(
    localStorage.getItem("ktvFavorites") || "[]"
  );

let currentSong = null;

let searchTimer = null;
let customerSearchTimer = null;

let lastKeyword = "";

let editingCustomerId = null;


/* =================================================
 * 網頁載入
 * ================================================= */

window.addEventListener(
  "DOMContentLoaded",
  function () {
    checkLocationAuth();
  }
);


/* =================================================
 * 據點驗證
 *
 * IP OR GPS
 * ================================================= */

async function checkLocationAuth() {

  const descEl =
    document.getElementById(
      "authDesc"
    );

  const spinnerEl =
    document.getElementById(
      "authSpinner"
    );

  const errorEl =
    document.getElementById(
      "authError"
    );

  const retryBtn =
    document.getElementById(
      "retryAuthBtn"
    );


  descEl.textContent =
    "正在確認公司網路...";

  spinnerEl.style.display =
    "block";

  errorEl.textContent =
    "";

  retryBtn.style.display =
    "none";


  let ip = "";


  /* =================================================
   * 第一階段：取得公開 IP
   * ================================================= */

  try {

    const response =
      await fetch(
        "https://api.ipify.org?format=json",
        {
          cache: "no-store"
        }
      );


    if (response.ok) {

      const data =
        await response.json();

      ip =
        String(
          data.ip || ""
        ).trim();
    }

  } catch (error) {

    console.warn(
      "取得公開 IP 失敗",
      error
    );
  }


  /* =================================================
   * 第二階段：IP 驗證
   *
   * IP 通過 → 直接進入
   * 不需要 GPS
   * ================================================= */

  if (ip) {

    descEl.textContent =
      "正在確認公司 Wi-Fi...";


    try {

      const result =
        await verifyLocation({
          ip: ip
        });


      if (
        result.success &&
        result.allowed &&
        result.ipMatched
      ) {

        openKtvSystem(
          "📶 公司 Wi-Fi 驗證成功"
        );

        return;
      }

    } catch (error) {

      console.warn(
        "IP 驗證失敗，改用 GPS",
        error
      );
    }
  }


  /* =================================================
   * 第三階段：GPS
   * ================================================= */

  if (
    !navigator.geolocation
  ) {

    authFailed(
      "目前網路未通過公司 Wi-Fi 驗證，" +
      "而且您的瀏覽器不支援 GPS 定位。"
    );

    return;
  }


  descEl.textContent =
    "目前不在公司 Wi-Fi，正在取得 GPS 位置...";


  navigator.geolocation.getCurrentPosition(

    async function (position) {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      descEl.textContent =
        "GPS 定位成功，正在比對公司據點...";


      try {

        const result =
          await verifyLocation({

            ip: ip,

            lat: lat,

            lng: lng
          });


        /* =========================================
         * IP OR GPS
         * ========================================= */

        if (
          result.success &&
          result.allowed
        ) {

          if (
            result.gpsMatched
          ) {

            openKtvSystem(
              "📍 GPS 據點驗證成功"
            );

          } else {

            openKtvSystem(
              "📶 公司 Wi-Fi 驗證成功"
            );
          }

          return;
        }


        /* =========================================
         * 驗證失敗
         * ========================================= */

        authFailed(

          "❌ 據點驗證未通過\n\n" +

          "最近據點：" +
          (
            result.companyName ||
            "未知"
          ) +

          "\n距離：" +

          (
            result.distance !== null &&
            result.distance !== undefined
              ? result.distance + " 公尺"
              : "無法計算"
          ) +

          "\n\n請連接公司 Wi-Fi，" +
          "或在公司據點範圍內重新驗證。"
        );

      } catch (error) {

        console.error(
          error
        );


        authFailed(
          "無法連線至後端伺服器進行驗證，" +
          "請檢查網路狀態。"
        );
      }
    },


    function (error) {

      let message =
        "無法取得 GPS 定位。";


      if (
        error.code ===
        error.PERMISSION_DENIED
      ) {

        message =
          "您拒絕了瀏覽器定位權限。\n\n" +
          "如果目前不在公司 Wi-Fi，" +
          "請允許瀏覽器使用定位功能後重新驗證。";

      } else if (
        error.code ===
        error.POSITION_UNAVAILABLE
      ) {

        message =
          "目前無法取得裝置位置。\n\n" +
          "請確認 GPS / 定位服務已開啟。";

      } else if (
        error.code ===
        error.TIMEOUT
      ) {

        message =
          "GPS 定位逾時。\n\n" +
          "請至收訊良好的地方後重新驗證。";
      }


      authFailed(
        message
      );
    },


    {
      timeout: 10000,
      maximumAge: 0,
      enableHighAccuracy: true
    }
  );
}


/* =================================================
 * 呼叫後端驗證
 * ================================================= */

async function verifyLocation(
  params
) {

  const query =
    new URLSearchParams({

      action:
        "verifyLocation"
    });


  if (params.ip) {

    query.set(
      "ip",
      params.ip
    );
  }


  if (
    params.lat !== undefined &&
    params.lng !== undefined
  ) {

    query.set(
      "lat",
      String(params.lat)
    );

    query.set(
      "lng",
      String(params.lng)
    );
  }


  const response =
    await fetch(
      `${API_URL}?${query.toString()}`,
      {
        cache: "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      `HTTP ${response.status}`
    );
  }


  return response.json();
}

/* =================================================
 * KTV 初始化
 * ================================================= */

function initKtvSystem() {

  renderQueue();

  loadLanguages();

  loadCategories();


  document.getElementById(
    "audioPlayer"
  ).volume = 0.8;


  const searchInput =
    document.getElementById(
      "searchInput"
    );


  searchInput.addEventListener(
    "input",
    function () {

      clearTimeout(
        searchTimer
      );


      const keyword =
        this.value.trim();


      if (
        keyword.length === 0
      ) {

        lastKeyword =
          "";


        if (
          currentLanguage !== "全部" ||
          currentCategory !== "全部"
        ) {

          fetchSongs("");

        } else {

          document.getElementById(
            "songList"
          ).innerHTML =
            `
            <div class="empty">
              請輸入歌名、歌手或歌號開始搜尋
              <br>
              或直接點選上方語言／分類
            </div>
            `;

          allSongs = [];
        }

        return;
      }


      searchTimer =
        setTimeout(
          function () {

            if (
              keyword !==
              lastKeyword
            ) {

              lastKeyword =
                keyword;

              fetchSongs(
                keyword
              );

            } else {

              renderSongList();
            }

          },
          250
        );
    }
  );


  document.getElementById(
    "customerSearch"
  ).addEventListener(
    "input",
    function () {

      clearTimeout(
        customerSearchTimer
      );


      const keyword =
        this.value.trim();


      if (!keyword) {

        document.getElementById(
          "customerResults"
        ).innerHTML =
          `
          <div class="empty">
            請輸入客戶姓名
          </div>
          `;

        return;
      }


      customerSearchTimer =
        setTimeout(
          function () {

            searchCustomers(
              keyword
            );

          },
          250
        );
    }
  );


  document.getElementById(
    "volume"
  ).addEventListener(
    "input",
    function () {

      document.getElementById(
        "audioPlayer"
      ).volume =
        this.value;
    }
  );


  const savedCustomer =
    localStorage.getItem(
      "currentCustomer"
    );


  if (savedCustomer) {

    try {

      currentCustomer =
        JSON.parse(
          savedCustomer
        );


      updateCustomerUI();

    } catch (error) {

      localStorage.removeItem(
        "currentCustomer"
      );
    }
  }
}


/* =================================================
 * API GET

async function apiGet(
  params
) {

  const query =
    new URLSearchParams(
      params
    );


  const response =
    await fetch(
      `${API_URL}?${query.toString()}`
    );


  if (!response.ok) {

    throw new Error(
      `HTTP ${response.status}`
    );
  }


  return response.json();
}


/* =================================================
 * API POST
 * ================================================= */

async function apiPost(
  data
) {

  const response =
    await fetch(
      API_URL,
      {

        method:
          "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(data)
      }
    );


  if (!response.ok) {

    throw new Error(
      `HTTP ${response.status}`
    );
  }


  return response.json();
}

/* =================================================
 * 歌曲搜尋
 * ================================================= */

async function fetchSongs(
  keyword = ""
) {

  const list =
    document.getElementById(
      "songList"
    );


  list.innerHTML =
    `
    <div class="empty">
      搜尋中...
    </div>
    `;


  try {

    const result =
      await apiGet({

        action:
          "songs",

        q:
          keyword,

        language:
          currentLanguage,

        category:
          currentCategory
      });


    if (!result.success) {

      throw new Error(
        result.message
      );
    }


    allSongs =
      result.data || [];


    renderSongList();

  } catch (error) {

    console.error(
      error
    );


    list.innerHTML =
      `
      <div class="empty">
        歌曲搜尋失敗
      </div>
      `;
  }
}


/* =================================================
 * 歌曲列表
 * ================================================= */

function renderSongList() {

  const list =
    document.getElementById(
      "songList"
    );


  if (
    allSongs.length === 0
  ) {

    list.innerHTML =
      `
      <div class="empty">
        找不到符合的歌曲
      </div>
      `;

    return;
  }


  const keyword =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim();


  let displaySongs =
    [...allSongs];


  if (keyword) {

    const fuse =
      new Fuse(
        allSongs,
        {
          keys: [
            "title",
            "artist",
            "song_no"
          ],
          threshold: 0.4,
          ignoreLocation: true
        }
      );


    const fuzzyResults =
      fuse.search(
        keyword
      );


    displaySongs =
      fuzzyResults.map(
        function (result) {
          return result.item;
        }
      );
  }


  const sortType =
    document.getElementById(
      "sortSelect"
    ).value;


  if (
    sortType ===
    "title_len_asc"
  ) {

    displaySongs.sort(
      function (a, b) {

        return (
          String(
            a.title || ""
          ).length -
          String(
            b.title || ""
          ).length
        );
      }
    );

  } else if (
    sortType ===
    "title_len_desc"
  ) {

    displaySongs.sort(
      function (a, b) {

        return (
          String(
            b.title || ""
          ).length -
          String(
            a.title || ""
          ).length
        );
      }
    );

  } else if (
    sortType ===
    "artist_len_asc"
  ) {

    displaySongs.sort(
      function (a, b) {

        return (
          String(
            a.artist || ""
          ).length -
          String(
            b.artist || ""
          ).length
        );
      }
    );

  } else if (
    sortType ===
    "artist_len_desc"
  ) {

    displaySongs.sort(
      function (a, b) {

        return (
          String(
            b.artist || ""
          ).length -
          String(
            a.artist || ""
          ).length
        );
      }
    );
  }


  if (
    displaySongs.length === 0
  ) {

    list.innerHTML =
      `
      <div class="empty">
        找不到符合的歌曲
      </div>
      `;

    return;
  }


  list.innerHTML =
    displaySongs
      .map(
        function (song) {

          const isFavorite =
            favorites.includes(
              String(
                song.song_no
              )
            );


          return `
            <div class="song">

              <div class="cover">
                🎤
              </div>

              <div class="song-info">

                <div class="song-title">
                  [${escapeHtml(song.song_no)}]
                  ${escapeHtml(song.title)}
                </div>

                <div class="artist">
                  ${escapeHtml(song.artist)}
                  ·
                  ${escapeHtml(song.language || "未分類")}
                  ${
                    song.category
                      ? " · " +
                        escapeHtml(
                          song.category
                        )
                      : ""
                  }
                  ${
                    song.brand
                      ? " · " +
                        escapeHtml(
                          song.brand
                        )
                      : ""
                  }
                </div>

              </div>

              <div class="song-actions">

                <button
                  class="favorite ${
                    isFavorite
                      ? "active"
                      : ""
                  }"
                  onclick="toggleFavorite('${escapeJs(song.song_no)}')"
                >
                  ${
                    isFavorite
                      ? "♥"
                      : "♡"
                  }
                </button>

                <button
                  class="add-btn"
                  onclick="addSong('${escapeJs(song.song_no)}')"
                >
                  ＋ 點歌
                </button>

              </div>

            </div>
          `;
        }
      )
      .join("");
}


/* =================================================
 * 加入歌曲
 * ================================================= */

function addSong(
  songNo
) {

  const song =
    allSongs.find(
      function (s) {

        return String(
          s.song_no
        ) ===
        String(
          songNo
        );
      }
    );


  if (!song) {

    showToast(
      "找不到歌曲"
    );

    return;
  }


  queue.push({

    ...song,

    queueId:
      Date.now() +
      Math.random()
  });


  saveQueue();

  renderQueue();

  showToast(
    `已點歌：${song.title}`
  );
}


/* =================================================
 * 待播列表
 * ================================================= */

function renderQueue() {

  const list =
    document.getElementById(
      "queueList"
    );


  const count =
    document.getElementById(
      "queueCount"
    );


  count.textContent =
    `${queue.length} 首`;

  ) {

    list.innerHTML =
      `
      <div class="empty">
        目前沒有待播歌曲
        <br>
        選擇歌曲開始點歌吧 🎤
      </div>
      `;

    return;
  }


  list.innerHTML =
    queue
      .map(
        function (
          song,
          index
        ) {

          return `
            <div
              class="song"
              style="
                display:flex;
                align-items:center;
                justify-content:space-between;
              "
            >

              <div
                style="
                  display:flex;
                  align-items:center;
                  gap:10px;
                  flex:1;
                  min-width:0;
                "
              >

                <div
                  class="queue-number"
                  style="
                    font-weight:bold;
                    min-width:24px;
                    text-align:center;
                  "
                >
                  ${index + 1}
                </div>

                <div class="cover">
                  🎤
                </div>

                <div
                  class="song-info"
                  style="
                    min-width:0;
                    flex:1;
                  "
                >

                  <div class="song-title">
                    [${escapeHtml(song.song_no)}]
                    ${escapeHtml(song.title)}
                  </div>

                  <div
                    class="artist"
                    style="
                      overflow:hidden;
                      text-overflow:ellipsis;
                      white-space:nowrap;
                    "
                  >
                    ${escapeHtml(song.artist)}
                    ·
                    ${escapeHtml(song.language || "未分類")}
                    ${
                      song.brand
                        ? " · " +
                          escapeHtml(
                            song.brand
                          )
                        : ""
                    }
                  </div>

                </div>

              </div>

              <div
                class="song-actions"
                style="margin-left:10px;"
              >

                <button
                  class="remove-btn"
                  onclick="removeSong(${song.queueId})"
                  style="padding:4px 8px;"
                >
                  ×
                </button>

              </div>

            </div>
          `;
        }
      )
      .join("");
}


/* =================================================
 * 移除歌曲
 * ================================================= */

function removeSong(
  queueId
) {

  queue =
    queue.filter(
      function (song) {

        return (
          song.queueId !==
          queueId
        );
      }
    );


  saveQueue();

  renderQueue();

  showToast(
    "已移除歌曲"
  );
}


/* =================================================
 * 播放
 * ================================================= */

function playCurrent() {

  if (!currentSong) {

    if (
      queue.length === 0
    ) {

      showToast(
        "目前沒有待播歌曲"
      );

      return;
    }


    currentSong =
      queue[0];
  }


  const player =
    document.getElementById(
      "audioPlayer"
    );


  player.src =
    currentSong.media ||
    `music/${encodeURIComponent(currentSong.title)}.mp3`;


  document.getElementById(
    "currentTitle"
  ).textContent =
    `[${currentSong.song_no}] ${currentSong.title}`;


  document.getElementById(
    "currentArtist"
  ).textContent =
    currentSong.artist;


  player
    .play()
    .catch(
      function () {

        showToast(
          "找不到音樂檔案"
        );
      }
    );
}


/* =================================================
 * 下一首
 * ================================================= */

function nextSong() {

  if (
    queue.length === 0
  ) {

    currentSong =
      null;


    document.getElementById(
      "currentTitle"
    ).textContent =
      "尚未播放";


    document.getElementById(
      "currentArtist"
    ).textContent =
      "-";


    document.getElementById(
      "audioPlayer"
    ).removeAttribute(
      "src"
    );


    showToast(
      "沒有下一首歌曲"
    );

    return;
  }


  currentSong =
    queue.shift();


  saveQueue();

  renderQueue();

  playCurrent();
}


document.getElementById(
  "audioPlayer"
).addEventListener(
  "ended",
  function () {
    nextSong();
  }
);


/* =================================================
 * 收藏
 * ================================================= */

function toggleFavorite(
  songNo
) {

  songNo =
    String(songNo);


  if (
    favorites.includes(
      songNo
    )
  ) {

    favorites =
      favorites.filter(
        function (item) {
          return item !== songNo;
        }
      );

    showToast(
      "已取消收藏"
    );

  } else {

    favorites.push(
      songNo
    );

    showToast(
      "已加入收藏"
    );
  }


  localStorage.setItem(
    "ktvFavorites",
    JSON.stringify(
      favorites
    )
  );


  renderSongList();
}

      await apiGet({

        action:
          "customers",

        q:
          keyword
      });


    if (!result.success) {

      throw new Error(
        result.message
      );
    }


    if (
      !result.data ||
      result.data.length === 0
    ) {

      resultBox.innerHTML =
        `
        <div class="empty">
          找不到「${escapeHtml(keyword)}」
          <br><br>
          可以按下方「新增客戶」
        </div>
        `;

      return;
    }


    resultBox.innerHTML =
      result.data
        .map(
          function (customer) {

            return `
              <div class="customer-card">

                <div style="min-width:0">

                  <div
                    class="customer-card-name"
                  >
                    ${escapeHtml(customer.name)}
                  </div>

                  <div
                    class="customer-card-info"
                  >
                    ${
                      customer.phone
                        ? escapeHtml(
                            customer.phone
                          )
                        : "未提供電話"
                    }

                    ${
                      customer.note
                        ? " · " +
                          escapeHtml(
                            customer.note
                          )
                        : ""
                    }
                  </div>

                </div>

                <div class="customer-actions">

                  <button
                    class="edit-customer"
                    onclick="showEditCustomer(
                      '${escapeJs(customer.customer_id)}',
                      '${escapeJs(customer.name)}',
                      '${escapeJs(customer.phone)}',
                      '${escapeJs(customer.note)}'
                    )"
                  >
                    ✏️ 編輯
                  </button>

                  <button
                    class="select-customer"
                    onclick="selectCustomer(
                      '${escapeJs(customer.customer_id)}',
                      '${escapeJs(customer.name)}'
                    )"
                  >
                    選擇
                  </button>

                </div>

              </div>
            `;
          }
        )
        .join("");

  } catch (error) {

    console.error(
      error
    );


    resultBox.innerHTML =
      `
      <div class="empty">
        客戶搜尋失敗
      </div>
      `;
  }
}


/* =================================================
 * 選擇客戶
 * ================================================= */

function selectCustomer(
  customerId,
  name
) {

  currentCustomer = {

    customer_id:
      customerId,

    name:
      name
  };


  localStorage.setItem(
    "currentCustomer",
    JSON.stringify(
      currentCustomer
    )
  );


  updateCustomerUI();

  closeCustomerModal();


  showToast(
    `目前客戶：${name}`
  );


  setTimeout(
    function () {

      if (
        confirm(
          `是否載入「${name}」的歷史歌單？`
        )
      ) {

        openHistory();
      }

    },
    200
  );
}


/* =================================================
 * 客戶 UI
 * ================================================= */

function updateCustomerUI() {

  const info =
    document.getElementById(
      "customerInfo"
    );


  const clearBtn =
    document.getElementById(
      "clearCustomerBtn"
    );


  if (!currentCustomer) {

    info.textContent =
      "尚未選擇客戶";

    clearBtn.style.display =
      "none";

    return;
  }


  info.innerHTML =
    `
    目前客戶：
    <span class="customer-name">
      ${escapeHtml(currentCustomer.name)}
    </span>
    `;


  clearBtn.style.display =
    "block";
}


/* =================================================
 * 清除客戶
 * ================================================= */

function clearCustomer() {

  if (
    queue.length > 0
  ) {

    if (
      !confirm(
        "目前還有待播歌曲，確定要清除客戶嗎？"
      )
    ) {

      return;
    }
  }


  currentCustomer =
    null;


  localStorage.removeItem(
    "currentCustomer"
  );


  updateCustomerUI();

  showToast(
    "已清除目前客戶"
  );
}


/* =================================================
 * 新增客戶 UI
 * ================================================= */

function showCreateCustomer() {

  const area =
    document.getElementById(
      "createCustomerArea"
    );


  area.style.display =
    area.style.display === "none"
      ? "block"
      : "none";
}


/* =================================================
 * 新增客戶
 * ================================================= */

async function createCustomer() {

  const name =
    document.getElementById(
      "newCustomerName"
    ).value.trim();


  const phone =
    document.getElementById(
      "newCustomerPhone"
    ).value.trim();


  const note =
    document.getElementById(
      "newCustomerNote"
    ).value.trim();


  if (!name) {

    showToast(
      "請輸入客戶姓名"
    );

    return;
  }


  try {

    const result =
      await apiPost({

        action:
          "createCustomer",

        name:
          name,

        phone:
          phone,

        note:
          note
      });


    if (!result.success) {

      throw new Error(
        result.message
      );
    }


    currentCustomer = {

      customer_id:
        result.data.customer_id,

      name:
        result.data.name
    };


    localStorage.setItem(
      "currentCustomer",
      JSON.stringify(
        currentCustomer
      )
    );


    updateCustomerUI();

    closeCustomerModal();


    document.getElementById(
      "newCustomerName"
    ).value = "";


    document.getElementById(
      "newCustomerPhone"
    ).value = "";


    document.getElementById(
      "newCustomerNote"
    ).value = "";


    showToast(
      `客戶建立成功：${name}`
    );

  } catch (error) {

    console.error(
      error
    );


    showToast(
      "新增客戶失敗"
    );
  }
}


/* =================================================
 * 編輯客戶
 * ================================================= */

function showEditCustomer(
  customerId,
  name,
  phone,
  note
) {

  editingCustomerId =
    customerId;


  document.getElementById(
    "editCustomerId"
  ).textContent =
    `客戶代碼：${customerId}`;


  document.getElementById(
    "editCustomerName"
  ).value =
    name || "";


  document.getElementById(
    "editCustomerPhone"
  ).value =
    phone || "";


  document.getElementById(
    "editCustomerNote"
  ).value =
    note || "";


  document.getElementById(
    "editCustomerArea"
  ).style.display =
    "block";


  document.getElementById(
    "createCustomerArea"
  ).style.display =
    "none";


  document.getElementById(
    "editCustomerName"
  ).focus();
}


function cancelEditCustomer() {

  editingCustomerId =
    null;


  const area =
    document.getElementById(
      "editCustomerArea"
    );


  if (area) {

    area.style.display =
      "none";
  }
}


/* =================================================
 * 修改客戶
 * ================================================= */

async function updateCustomer() {

  if (!editingCustomerId) {

    showToast(
      "沒有選擇要編輯的客戶"
    );

    return;
  }


  const name =
    document.getElementById(
      "editCustomerName"
    ).value.trim();


  const phone =
    document.getElementById(
      "editCustomerPhone"
    ).value.trim();


  const note =
    document.getElementById(
      "editCustomerNote"
    ).value.trim();


  if (!name) {

    showToast(
      "客戶姓名不能空白"
    );

    return;
  }


  if (
    !confirm(
      `確定要修改客戶「${name}」的資料嗎？`
    )
  ) {

    return;
  }


  try {

    const result =
      await apiPost({

        action:
          "updateCustomer",

        customer_id:
          editingCustomerId,

        name:
          name,

        phone:
          phone,

        note:
          note
      });


    if (!result.success) {

      throw new Error(
        result.message
      );
    }


    if (
      currentCustomer &&
      String(
        currentCustomer.customer_id
      ) ===
      String(
        editingCustomerId
      )
    ) {

      currentCustomer.name =
        name;


      localStorage.setItem(
        "currentCustomer",
        JSON.stringify(
          currentCustomer
        )
      );


      updateCustomerUI();
    }


    showToast(
      "客戶資料更新成功"
    );


    const keyword =
      document.getElementById(
        "customerSearch"
      ).value.trim();


    if (keyword) {

      await searchCustomers(
        keyword
      );
    }


    cancelEditCustomer();

  } catch (error) {

    console.error(
      error
    );


    showToast(
      error.message ||
      "客戶資料更新失敗"
    );
  }
}


/* =================================================
 * 歷史歌單
 * ================================================= */

async function openHistory() {

  if (!currentCustomer) {

    showToast(
      "請先選擇客戶"
    );

    return;
  }


  document.getElementById(
    "historyModal"
  ).classList.add(
    "show"
  );


  document.getElementById(
    "historyCustomerName"
  ).textContent =
    `客戶：${currentCustomer.name}`;


  const list =
    document.getElementById(
      "historyList"
    );


  list.innerHTML =
    `
    <div class="empty">
      載入歷史歌單中...
    </div>
    `;


  try {

    const result =
      await apiGet({

        action:
          "history",

        customer_id:
          currentCustomer.customer_id
      });


    if (!result.success) {

      throw new Error(
        result.message
      );
    }


    if (
      !result.data ||
      result.data.length === 0
    ) {

      list.innerHTML =
        `
        <div class="empty">
          此客戶目前沒有歷史歌單
        </div>
        `;

      return;
    }


    list.innerHTML =
      result.data
        .map(
          function (song) {

            return `
              <div
                class="song"
                style="
                  display:flex;
                  align-items:center;
                  justify-content:space-between;
                  margin:0 0 10px 0;
                "
              >

                <div
                  style="
                    display:flex;
                    align-items:center;
                    gap:10px;
                    flex:1;
                    min-width:0;
                  "
                >

                  <div class="cover">
                    📜
                  </div>

                  <div
                    class="song-info"
                    style="
                      min-width:0;
                      flex:1;
                    "
                  >

                    <div class="song-title">
                      [${escapeHtml(song.song_no)}]
                      ${escapeHtml(song.title)}
                    </div>

                    <div
                      class="artist"
                      style="
                        overflow:hidden;
                        text-overflow:ellipsis;
                        white-space:nowrap;
                      "
                    >
                      ${escapeHtml(song.artist)}
                      ·
                      ${escapeHtml(song.language || "未分類")}
                      ${
                        song.brand
                          ? " · " +
                            escapeHtml(
                              song.brand
                            )
                          : ""
                      }
                    </div>

                  </div>

                </div>

                <div
                  class="song-actions"
                  style="margin-left:10px;"
                >

                  <button
                    class="add-btn"
                    onclick="addHistorySong(
                      '${escapeJs(song.song_no)}',
                      '${escapeJs(song.title)}',
                      '${escapeJs(song.artist)}',
                      '${escapeJs(song.brand)}',
                      '${escapeJs(song.language)}'
                    )"
                  >
                    ＋ 點歌
                  </button>

                </div>

              </div>
            `;
          }
        )
        .join("");

  } catch (error) {

    console.error(
      error
    );


    list.innerHTML =
      `
      <div class="empty">
        歷史歌單載入失敗
      </div>
      `;
  }
}


/* =================================================
 * 關閉歷史
 * ================================================= */

function closeHistoryModal() {

  document
    .getElementById(
      "historyModal"
    )
    .classList.remove(
      "show"
    );
}


/* =================================================
 * 歷史歌曲加入待播
 * ================================================= */

function addHistorySong(
  songNo,
  title,
  artist,
  brand,
  language
) {

  queue.push({

    song_no:
      songNo,

    title:
      title,

    artist:
      artist,

    brand:
      brand,

    language:
      language,

    queueId:
      Date.now() +
      Math.random()
  });


  saveQueue();

  renderQueue();

  showToast(
    `已加入：${title}`
  );
}


/* =================================================
 * 結束服務
 * ================================================= */

async function endService() {

  if (!currentCustomer) {

    showToast(
      "請先選擇客戶"
    );

    return;
  }


  if (
    queue.length === 0
  ) {

    showToast(
      "目前沒有點歌紀錄"
    );

    return;
  }


  const ok =
    confirm(
      `確定結束「${currentCustomer.name}」本次服務？\n\n` +
      `目前 ${queue.length} 首歌曲會寫入歷史歌單。`
    );


  if (!ok) {

    return;
  }


  try {

    const result =
      await apiPost({

        action:
          "saveHistory",

        customer_id:
          currentCustomer.customer_id,

        songs:
          queue
      });


    if (!result.success) {

      throw new Error(
        result.message
      );
    }


    queue = [];

    currentSong =
      null;


    saveQueue();

    renderQueue();


    document.getElementById(
      "currentTitle"
    ).textContent =
      "尚未播放";


    document.getElementById(
      "currentArtist"
    ).textContent =
      "-";


    document.getElementById(
      "audioPlayer"
    ).removeAttribute(
      "src"
    );


    currentCustomer =
      null;


    localStorage.removeItem(
      "currentCustomer"
    );


    updateCustomerUI();


    showToast(
      "本次服務已完成，歷史歌單已儲存"
    );

  } catch (error) {

    console.error(
      error
    );


    showToast(
      error.message ||
      "歷史歌單儲存失敗，沒有清除資料"
    );
  }
}


/* =================================================
 * Toast
 * ================================================= */

let toastTimer;


function showToast(
  message
) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function () {

        toast.classList.remove(
          "show"
        );

      },
      2500
    );
}


/* =================================================
 * HTML Escape
 * ================================================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =================================================
 * JavaScript Escape
 * ================================================= */

function escapeJs(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /\r/g,
      "\\r"
    )
    .replace(
      /\n/g,
      "\\n"
    );
}
