<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTV 點歌系統 - 據點驗證與點歌</title>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
<style>
html { font-size: 130%; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
  background: radial-gradient(circle at top, #24104d 0%, #0b0b16 45%, #050509 100%);
  color: #fff;
  min-height: 100vh;
}

/* 🔒 據點驗證全螢幕遮罩層 */
#authOverlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 5, 9, 0.96);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(12px);
  transition: opacity 0.4s ease;
}
.auth-card {
  background: #171725;
  border: 1px solid #343449;
  border-radius: 20px;
  padding: 35px 25px;
  width: 100%;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.7);
}
.auth-title {
  font-size: 1.4rem;
  font-weight: bold;
  margin-bottom: 12px;
  background: linear-gradient(90deg, #ff2bd6, #8c5cff, #22d3ee);
  -webkit-background-clip: text;
  color: transparent;
}
.auth-desc {
  color: #bbb;
  font-size: 0.92rem;
  margin-bottom: 24px;
  line-height: 1.6;
}
.auth-spinner {
  width: 45px;
  height: 45px;
  border: 4px solid rgba(255,255,255,0.1);
  border-top-color: #ff2bd6;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.auth-btn {
  width: 100%;
  height: 48px;
  border-radius: 12px;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  color: white;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 1rem;
  margin-top: 15px;
  transition: opacity 0.2s;
}
.auth-btn:hover { opacity: 0.9; }
.auth-error {
  color: #ff4d6d;
  font-size: 0.88rem;
  margin-top: 15px;
  white-space: pre-line;
  line-height: 1.5;
}

/* 系統主介面樣式 */
header {
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  background: rgba(10,10,20,.92);
  border-bottom: 1px solid rgba(255,255,255,.08);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.logo {
  font-size: 1.35rem;
  font-weight: bold;
  background: linear-gradient(90deg, #ff2bd6, #8c5cff, #22d3ee);
  -webkit-background-clip: text;
  color: transparent;
}
.customer-area {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.customer-info {
  color: #bbb;
  font-size: 0.85rem;
}
.customer-name {
  color: white;
  font-weight: bold;
}
.customer-btn {
  background: #29293a;
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid #3a3a4d;
  cursor: pointer;
  font-size: 0.85rem;
}
.customer-btn:hover { background: #3b3b50; }
.staff-nav-btn {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: white;
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: bold;
}
main {
  max-width: 1400px;
  margin: auto;
  padding: 25px;
}
.search-area {
  margin-bottom: 15px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.search-box {
  position: relative;
  flex: 1;
  min-width: 250px;
}
.search-box input {
  width: 100%;
  height: 52px;
  border: 1px solid #38384c;
  border-radius: 12px;
  padding: 0 85px 0 45px; /* 預留左右圖標/按鈕空間 */
  background: #151522;
  color: white;
  outline: none;
  font-size: 1rem;
}
.search-box input:focus {
  border-color: #9b5cff;
  box-shadow: 0 0 0 3px rgba(155,92,255,.15);
}
.search-icon-btn {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  font-size: 1.1rem;
  color: #999;
  cursor: pointer;
  padding: 4px;
}
.search-icon-btn:hover { color: #fff; }

.clear-btn {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: #2a2a3c;
  color: #aaa;
  border: none;
  border-radius: 50%;
  width: 26px;
  height: 26px;
  font-size: 0.85rem;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
}
.clear-btn:hover { background: #ff2bd6; color: white; }

.sort-box select {
  height: 52px;
  padding: 0 16px;
  border-radius: 12px;
  border: 1px solid #38384c;
  background: #151522;
  color: white;
  outline: none;
  font-size: 0.95rem;
  cursor: pointer;
}
.quick-search {
  margin-bottom: 20px;
  padding: 15px;
  background: rgba(18,18,29,.75);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 15px;
}
.quick-title {
  color: #aaa;
  font-size: 0.82rem;
  margin-bottom: 10px;
}
.quick-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 4px;
}
.category {
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 30px;
  background: #171725;
  color: #aaa;
  border: 1px solid #2d2d3d;
  cursor: pointer;
  font-size: 0.85rem;
  transition: .2s;
}
.category:hover { background: #29293d; color: white; }
.category.active {
  color: white;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  border-color: transparent;
}
.content {
  display: grid;
  grid-template-columns: 1fr 420px;
  gap: 25px;
}
.section-title {
  font-size: 1.1rem;
  font-weight: bold;
  margin-bottom: 16px;
}
.song-list {
  display: grid;
  gap: 12px;
}
.song {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  border: 1px solid rgba(255,255,255,.07);
  background: rgba(25,25,38,.75);
  border-radius: 14px;
  transition: .2s;
}
.song:hover {
  background: #222235;
  transform: translateY(-1px);
}
.cover {
  width: 56px;
  height: 56px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 1.3rem;
  background: linear-gradient(135deg, #ff2bd6, #653eff);
}
.song-info {
  flex: 1;
  min-width: 0;
}
.song-title {
  font-size: 1rem;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.artist {
  color: #999;
  font-size: 0.85rem;
  margin-top: 4px;
}
.song-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.favorite {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: #292938;
  color: #aaa;
  font-size: 1.1rem;
  cursor: pointer;
  border: none;
}
.favorite.active { color: #ff3e91; }
.add-btn {
  padding: 8px 14px;
  border-radius: 9px;
  color: white;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 0.85rem;
}
.queue-panel {
  background: rgba(18,18,29,.9);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 18px;
  padding: 20px;
  height: fit-content;
  position: sticky;
  top: 95px;
}
.queue-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.queue-count {
  color: #aaa;
  font-size: 0.85rem;
}
.queue-list {
  display: grid;
  gap: 10px;
  max-height: 380px;
  overflow-y: auto;
}
.queue-number {
  width: 26px;
  color: #8d7aff;
  font-weight: bold;
  text-align: center;
  font-size: 0.95rem;
}
.remove-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  color: #888;
  background: transparent;
  font-size: 1.2rem;
  border: none;
  cursor: pointer;
}
.player {
  margin-top: 18px;
  background: linear-gradient(135deg, #251040, #111126);
  border-radius: 16px;
  padding: 16px;
}
.now-playing { color: #aaa; font-size: 0.75rem; margin-bottom: 4px; }
.current-title { font-size: 1rem; font-weight: bold; }
.current-artist { font-size: 0.85rem; color: #888; margin-top: 3px; }
audio { width: 100%; margin-top: 10px; }
.player-controls { display: flex; gap: 8px; margin-top: 12px; }
.control-btn {
  flex: 1;
  height: 40px;
  border-radius: 9px;
  background: #29293a;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 0.9rem;
}
.play-btn { background: linear-gradient(135deg, #ff2bd6, #744cff); }
.volume { margin-top: 10px; }
.volume input { width: 100%; }
.end-service {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border-radius: 9px;
  background: linear-gradient(135deg, #e43b62, #9b2f80);
  color: white;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
}
.empty { color: #777; text-align: center; padding: 25px 10px; font-size: 0.9rem; }
.toast {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%) translateY(20px);
  background: #242435;
  color: white;
  padding: 12px 20px;
  border-radius: 30px;
  opacity: 0;
  pointer-events: none;
  transition: .3s;
  z-index: 9999;
  font-size: 0.9rem;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 500;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal.show { display: flex; }
.modal-box {
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  background: #171725;
  border: 1px solid #343449;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.modal-title { font-size: 1.1rem; font-weight: bold; }
.close-btn {
  width: 35px;
  height: 35px;
  border-radius: 8px;
  background: #292938;
  color: white;
  font-size: 1.1rem;
  border: none;
  cursor: pointer;
}
.modal-input {
  width: 100%;
  height: 45px;
  padding: 0 14px;
  border-radius: 9px;
  border: 1px solid #3a3a4d;
  background: #10101a;
  color: white;
  outline: none;
  margin-bottom: 12px;
  font-size: 0.95rem;
}
.primary-btn {
  width: 100%;
  height: 45px;
  border-radius: 9px;
  background: linear-gradient(135deg, #ff2bd6, #744cff);
  color: white;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
}
.secondary-btn {
  width: 100%;
  height: 45px;
  border-radius: 9px;
  background: #292938;
  color: white;
  margin-top: 10px;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
}
.customer-result { display: grid; gap: 10px; margin-top: 15px; }
.customer-card {
  padding: 14px;
  background: #222235;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.customer-card-name { font-weight: bold; font-size: 1rem; }
.customer-card-info { color: #888; font-size: 0.8rem; margin-top: 4px; }
.customer-actions { display: flex; gap: 6px; flex-shrink: 0; }
.select-customer, .edit-customer {
  padding: 8px 12px;
  border-radius: 8px;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 0.8rem;
}
.select-customer { background: linear-gradient(135deg, #ff2bd6, #744cff); }
.edit-customer { background: #39394d; }
.history-list { display: grid; gap: 10px; margin-top: 15px; }
.edit-customer-area { display: none; margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.08); }
.edit-title { color: #aaa; margin-bottom: 10px; font-size: 0.85rem; }
.edit-customer-id { color: #777; font-size: 0.75rem; margin-bottom: 10px; }
#categoryContainer { display: none !important; }

/* 📱 手機與平板響應式 RWD 優化 */
@media (max-width: 768px) {
  html { font-size: 100%; }
  header { height: 65px; padding: 0 15px; }
  .logo { font-size: 1.15rem; }
  .customer-btn { padding: 6px 10px; font-size: 0.8rem; }
  main { padding: 15px; }
  .content { grid-template-columns: 1fr; gap: 15px; }
  .quick-row { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .quick-row::-webkit-scrollbar { display: none; }
  .queue-panel { position: static; }
  .queue-list { max-height: 280px; }
  .modal-box { max-width: 100%; max-height: 95vh; padding: 16px; }
}
@media (max-width: 480px) {
  .customer-info { display: none; }
}
</style>
</head>
<body>

<!-- 🔒 據點安全性驗證遮罩 -->
<div id="authOverlay">
  <div class="auth-card">
    <div class="auth-title">🎤 據點安全驗證</div>
    <div class="auth-desc" id="authDesc">正在取得您的 GPS 定位，請允許瀏覽器權限...</div>
    <div class="auth-spinner" id="authSpinner"></div>
    <div class="auth-error" id="authError"></div>
    <button class="auth-btn" id="retryAuthBtn" style="display:none;" onclick="checkLocationAuth()">重新驗證據點</button>
  </div>
</div>

<header>
  <div class="logo">🎤 KTV 點歌系統</div>
  <div class="customer-area">
    <div class="customer-info" id="customerInfo">尚未選擇客戶</div>
    <button class="customer-btn" onclick="openCustomerModal()">👤 選擇客戶</button>
    <button class="customer-btn" id="historyBtn" style="display:none;" onclick="openHistory()">📜 歷史歌單</button>
    <button class="customer-btn" id="clearCustomerBtn" style="display:none" onclick="clearCustomer()">清除</button>
    <button class="staff-nav-btn" onclick="openStaffModal()">📋 點歌員總表</button>
  </div>
</header>

<main>
  <div class="search-area">
    <div class="search-box">
      <button class="search-icon-btn" onclick="triggerSearch()" title="點擊搜尋">🔍</button>
      <input type="text" id="searchInput" placeholder="輸入歌名、歌手或歌號..." autocomplete="off" oninput="handleSearchInput(this.value)">
      <button class="clear-btn" id="clearSearchBtn" onclick="clearSearch()" title="清除輸入">×</button>
    </div>
    <div class="sort-box">
      <select id="sortSelect" onchange="renderSongList()">
        <option value="default">預設排序</option>
        <option value="title_len_asc">歌名字數：少 ➔ 多</option>
        <option value="title_len_desc">歌名字數：多 ➔ 少</option>
        <option value="artist_len_asc">歌手字數：少 ➔ 多</option>
        <option value="artist_len_desc">歌手字數：多 ➔ 少</option>
      </select>
    </div>
  </div>
  <div class="quick-search">
    <div class="quick-title">快速搜尋</div>
    <div class="quick-row" id="languageContainer"></div>
  </div>
  
  <div class="content">
    <section>
      <div class="section-title">🎵 歌曲列表</div>
      <div class="song-list" id="songList">
        <div class="empty">請輸入歌名、歌手或歌號，並按下 Enter 或點擊放大鏡搜尋<br>或直接點選上方語言分類</div>
      </div>
    </section>
    <aside class="queue-panel">
      <div class="queue-header">
        <div class="section-title">📋 我的桌次待播</div>
        <div class="queue-count" id="queueCount">0 首</div>
      </div>
      <div style="margin-bottom: 12px;">
        <input type="text" id="tableNoInput" class="modal-input" style="height:38px;margin-bottom:0;font-size:0.9rem;" placeholder="請輸入您的桌號 (例如: A01, 包廂3)" onchange="updateTableNo(this.value)">
      </div>
      <div class="queue-list" id="queueList"></div>
      <div class="player">
        <div class="now-playing">NOW PLAYING</div>
        <div class="current-title" id="currentTitle">尚未播放</div>
        <div class="current-artist" id="currentArtist">-</div>
        <audio id="audioPlayer" controls></audio>
        <div class="player-controls">
          <button class="control-btn play-btn" onclick="playCurrent()">▶ 播放</button>
          <button class="control-btn" onclick="nextSong()">⏭ 下一首</button>
        </div>
        <div class="volume">
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
        </div>
        <button class="end-service" onclick="endService()">🔚 結束本次服務</button>
      </div>
    </aside>
  </div>
</main>

<!-- 客戶管理 Modal -->
<div class="modal" id="customerModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">👤 客戶管理</div>
      <button class="close-btn" onclick="closeCustomerModal()">×</button>
    </div>
    <input class="modal-input" id="customerSearch" placeholder="請輸入客戶姓名搜尋..." autocomplete="off">
    <div class="customer-result" id="customerResults">
      <div class="empty">請輸入客戶姓名</div>
    </div>
    <button class="secondary-btn" onclick="showCreateCustomer()">＋ 新增客戶</button>
    <div id="createCustomerArea" style="display:none;margin-top:20px">
      <div style="color:#aaa;margin-bottom:8px;font-size:0.85rem;">新增客戶</div>
      <input class="modal-input" id="newCustomerName" placeholder="客戶姓名">
      <input class="modal-input" id="newCustomerPhone" placeholder="電話（選填）">
      <input class="modal-input" id="newCustomerNote" placeholder="備註（選填）">
      <button class="primary-btn" onclick="createCustomer()">建立客戶</button>
    </div>
    
    <!-- ✏️ 編輯舊客戶區域 -->
    <div id="editCustomerArea" class="edit-customer-area">
      <div class="edit-title">✏️ 編輯舊客戶</div>
      <div class="edit-customer-id" id="editCustomerId"></div>
      <input class="modal-input" id="editCustomerName" placeholder="客戶姓名">
      <input class="modal-input" id="editCustomerPhone" placeholder="電話（選填）">
      <input class="modal-input" id="editCustomerNote" placeholder="備註（選填）">
      <button class="primary-btn" onclick="updateCustomer()">💾 儲存客戶資料</button>
      <button class="secondary-btn" onclick="cancelEditCustomer()">取消編輯</button>
    </div>
  </div>
</div>

<!-- 📜 歷史歌單 Modal -->
<div class="modal" id="historyModal">
  <div class="modal-box" style="max-width: 650px;">
    <div class="modal-header">
      <div class="modal-title" id="historyCustomerName">📜 客戶歷史歌單</div>
      <button class="close-btn" onclick="closeHistoryModal()">×</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty">載入歷史歌單中...</div>
    </div>
  </div>
</div>

<!-- 📋 點歌員總表 Modal（需密碼） -->
<div class="modal" id="staffModal">
  <div class="modal-box" style="max-width: 750px;">
    <div class="modal-header">
      <div class="modal-title">🔒 點歌員全場彙整總表</div>
      <button class="close-btn" onclick="closeStaffModal()">×</button>
    </div>
    
    <div id="staffAuthBox">
      <div style="color:#bbb;margin-bottom:12px;font-size:0.9rem;">此區域僅限點歌員檢視，請輸入管理密碼：</div>
      <input type="password" class="modal-input" id="staffPasswordInput" placeholder="請輸入密碼">
      <button class="primary-btn" onclick="verifyStaffPassword()">解鎖總表</button>
    </div>

    <div id="staffContentBox" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div style="color:#aaa;font-size:0.9rem;">全場各桌點歌彙整清單：</div>
        <button class="customer-btn" onclick="loadStaffSummary()">🔄 重新整理</button>
      </div>
      <div id="staffSummaryList" style="display:grid;gap:12px;max-height:60vh;overflow-y:auto;">
        <div class="empty">載入中...</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwXhIfZL-5r2sHKWrl19L5eISq-uanfkFmjbs2dhX38ySYyGZjTvoN1-Zm9Zq3Q9v9V/exec";

let allSongs = [];
let currentLanguage = "全部";
let currentBrand = "全部"; 
let currentCategory = "全部";
let currentCustomer = null;
let currentTableNo = "";
let queue = [];
let favorites = [];
let currentSong = null;
let customerSearchTimer = null;
let ktvInitialized = false;
let authChecking = false;
let syncInterval = null;
let editingCustomerId = null;

// --- 新增：搜尋快取與防抖變數 ---
const searchCache = {};
let searchDebounceTimer = null;
const DISPLAY_LIMIT = 100; // 單頁最大渲染筆數，避免 DOM 過載卡頓

function loadLocalStorage() {
  try {
    const savedQueue = localStorage.getItem("ktvQueue");
    queue = savedQueue ? JSON.parse(savedQueue) : [];
  } catch (e) { queue = []; }

  try {
    const savedFavorites = localStorage.getItem("ktvFavorites");
    favorites = savedFavorites ? JSON.parse(savedFavorites).map(String) : [];
  } catch (e) { favorites = []; }

  try {
    const savedCustomer = localStorage.getItem("currentCustomer");
    if (savedCustomer) currentCustomer = JSON.parse(savedCustomer);
  } catch (e) { currentCustomer = null; }

  try {
    const savedTable = localStorage.getItem("currentTableNo");
    if (savedTable) {
      currentTableNo = savedTable;
      const tableInput = document.getElementById("tableNoInput");
      if (tableInput) tableInput.value = savedTable;
    }
  } catch (e) { currentTableNo = ""; }
}

window.addEventListener("DOMContentLoaded", () => {
  loadLocalStorage();
  checkLocationAuth();
});

async function checkLocationAuth() {
  if (authChecking) return;
  authChecking = true;
  const descEl = document.getElementById("authDesc");
  const spinnerEl = document.getElementById("authSpinner");
  const errorEl = document.getElementById("authError");
  const retryBtn = document.getElementById("retryAuthBtn");

  if (descEl) descEl.textContent = "正在取得網路與 GPS 定位...";
  try {
    let publicIp = "";
    try {
      const ipRes = await fetch("https://api.ipify.org?format=json");
      if (ipRes.ok) publicIp = (await ipRes.json()).ip || "";
    } catch (e) {}

    if (!navigator.geolocation) {
      await verifyByServer(0, 0, publicIp);
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        await verifyByServer(pos.coords.latitude, pos.coords.longitude, publicIp);
      },
      async () => {
        if (publicIp) await verifyByServer(0, 0, publicIp);
        else authFailed("無法取得 GPS 定位與 IP。");
      },
      { timeout: 15000, enableHighAccuracy: true }
    );
  } catch (err) {
    authFailed(err.message);
  } finally {
    authChecking = false;
  }
}

async function verifyByServer(lat, lng, ip) {
  const params = new URLSearchParams({ action: "verifyLocation", lat, lng, ip });
  const res = await fetch(`${API_URL}?${params.toString()}`);
  const result = await res.json();

  if (result.success && result.rangeStatus === "有效打卡區") {
    const overlay = document.getElementById("authOverlay");
    if (overlay) {
      overlay.style.opacity = "0";
      setTimeout(() => {
        overlay.style.display = "none";
        showToast("據點驗證成功！");
        initKtvSystem();
      }, 400);
    }
  } else {
    authFailed(`❌ 驗證未通過\n距離最近據點：${result.distance}公尺`);
  }
}

function authFailed(msg) {
  const descEl = document.getElementById("authDesc");
  const spinnerEl = document.getElementById("authSpinner");
  const errorEl = document.getElementById("authError");
  const retryBtn = document.getElementById("retryAuthBtn");

  if (descEl) descEl.textContent = "存取受阻";
  if (spinnerEl) spinnerEl.style.display = "none";
  if (errorEl) errorEl.textContent = msg;
  if (retryBtn) retryBtn.style.display = "block";
}

async function initKtvSystem() {
  if (ktvInitialized) return;
  ktvInitialized = true;
  renderQueue();
  updateCustomerUI();
  await loadFilterCategories(); 
  startQueueSync();

  const searchInput = document.getElementById("searchInput");
  if (searchInput) {
    // 支援即時輸入搜尋（結合防抖）
    searchInput.addEventListener("input", function(e) {
      handleSearchInput(this.value);
      fetchSongs(this.value);
    });

    searchInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        triggerSearch();
      }
    });
  }

  const customerSearch = document.getElementById("customerSearch");
  if (customerSearch) {
    customerSearch.addEventListener("input", function() {
      clearTimeout(customerSearchTimer);
      const kw = this.value.trim();
      const resultsEl = document.getElementById("customerResults");
      if (!kw) {
        if (resultsEl) resultsEl.innerHTML = `<div class="empty">請輸入客戶姓名</div>`;
        return;
      }
      customerSearchTimer = setTimeout(() => searchCustomers(kw), 250);
    });
  }
}

// 控制清除按鈕（X）的顯示與隱藏
function handleSearchInput(val) {
  const clearBtn = document.getElementById("clearSearchBtn");
  if (!clearBtn) return;
  if (val.trim().length > 0) {
    clearBtn.style.display = "flex";
  } else {
    clearBtn.style.display = "none";
  }
}

// 點擊放大鏡或按 Enter 時觸發搜尋
function triggerSearch() {
  const searchInput = document.getElementById("searchInput");
  if (searchInput) {
    fetchSongs(searchInput.value.trim(), true); // 強制重新整理
  }
}

// 清除輸入框並清空搜尋結果
function clearSearch() {
  const searchInput = document.getElementById("searchInput");
  if (searchInput) searchInput.value = "";
  const clearBtn = document.getElementById("clearSearchBtn");
  if (clearBtn) clearBtn.style.display = "none";
  allSongs = [];
  const list = document.getElementById("songList");
  if (list) list.innerHTML = `<div class="empty">請輸入歌名、歌手或歌號，並按下 Enter 或點擊放大鏡搜尋<br>或直接點選上方分類</div>`;
  if (searchInput) searchInput.focus();
}

function updateTableNo(val) {
  currentTableNo = val.trim();
  localStorage.setItem("currentTableNo", currentTableNo);
  showToast(`已設定桌號：${currentTableNo || "無"}`);
  syncQueueToServer();
}

function startQueueSync() {
  if (syncInterval) clearInterval(syncInterval);
  syncInterval = setInterval(async () => {
    try {
      const res = await apiGet({ action: "getQueue", table_no: currentTableNo });
      if (res && res.success && Array.isArray(res.queue)) {
        if (JSON.stringify(res.queue) !== JSON.stringify(queue)) {
          queue = res.queue;
          saveQueue();
          renderQueue();
        }
      }
    } catch (e) {}
  }, 3000);
}

async function apiGet(params) {
  const query = new URLSearchParams(params);
  const res = await fetch(`${API_URL}?${query.toString()}`);
  return res.json();
}

async function apiPost(data) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(data)
  });
  return res.json();
}

// 動態載入分類按鈕
async function loadFilterCategories() {
  const container = document.getElementById("languageContainer");
  if (!container) return;

  let buttonsHtml = `
    <button class="category active" onclick="filterCategory('全部', '全部', this)">全部</button>
    <button class="category" onclick="filterCategory('brand', '金嗓', this)">金嗓</button>
    <button class="category" onclick="filterCategory('brand', '弘音', this)">弘音</button>
  `;

  try {
    const res = await apiGet({ action: "languages" });
    if (res && res.success && Array.isArray(res.data)) {
      res.data.forEach(lang => {
        buttonsHtml += `<button class="category" onclick="filterCategory('language', '${escapeJs(lang)}', this)">${escapeHtml(lang)}</button>`;
      });
    }
  } catch (e) {
    console.error("載入語言清單失敗", e);
  }

  container.innerHTML = buttonsHtml;
}

// 統一的篩選切換函式（點擊「全部」時徹底重置並支援全面搜尋）
function filterCategory(type, val, btn) {
  if (type === "全部") {
    currentBrand = "全部";
    currentLanguage = "全部";
  } else if (type === "brand") {
    currentBrand = val;
    currentLanguage = "全部"; 
  } else if (type === "language") {
    currentLanguage = val;
  }

  document.querySelectorAll("#languageContainer .category").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");

  const searchInput = document.getElementById("searchInput");
  const keyword = searchInput ? searchInput.value.trim() : "";
  fetchSongs(keyword, true); // 強制重新整理並根據當前關鍵字與「全部」條件搜尋
}

// --- 優化後的 fetchSongs（加入防抖與前端快取機制） ---
function fetchSongs(keyword = "", forceRefresh = false) {
  const list = document.getElementById("songList");
  if (!list) return;
  
  keyword = keyword.trim();
  const sortSelect = document.getElementById("sortSelect");
  const sortType = sortSelect ? sortSelect.value : "";

  // 允許在未輸入關鍵字且品牌/語言皆為「全部」時顯示提示或載入部分清單
  if (!keyword && currentBrand === "全部" && currentLanguage === "全部") {
    allSongs = [];
    list.innerHTML = `<div class="empty">請輸入歌名、歌手或歌號，並按下 Enter 或點擊放大鏡搜尋<br>或直接點選上方分類</div>`;
    return;
  }

  // 建立前端快取 Key
  const cacheKey = `${keyword}_${currentBrand}_${currentLanguage}_${sortType}`;

  // 若快取存在且非強制刷新，直接採用快取秒開
  if (!forceRefresh && searchCache[cacheKey]) {
    allSongs = searchCache[cacheKey];
    renderSongList();
    return;
  }

  list.innerHTML = `<div class="empty">搜尋中...</div>`;

  // 清除前一次未完成的計時器（防抖 250ms）
  if (searchDebounceTimer) clearTimeout(searchDebounceTimer);

  searchDebounceTimer = setTimeout(async () => {
    try {
      const res = await apiGet({ 
        action: "songs", 
        q: keyword, 
        language: currentLanguage,
        brand: currentBrand 
      });
      
      let rawSongs = Array.isArray(res.data) ? res.data : [];
      
      // 排序處理
      if (sortType === "title_len_asc") {
        rawSongs.sort((a, b) => String(a.title || "").length - String(b.title || "").length);
      } else if (sortType === "title_len_desc") {
        rawSongs.sort((a, b) => String(b.title || "").length - String(a.title || "").length);
      } else if (sortType === "artist_len_asc") {
        rawSongs.sort((a, b) => String(a.artist || "").length - String(b.artist || "").length);
      } else if (sortType === "artist_len_desc") {
        rawSongs.sort((a, b) => String(b.artist || "").length - String(a.artist || "").length);
      }

      allSongs = rawSongs;
      searchCache[cacheKey] = allSongs; // 寫入記憶體快取
      renderSongList();
    } catch (e) {
      list.innerHTML = `<div class="empty">搜尋失敗，請稍後再試</div>`;
    }
  }, 250);
}

// --- 優化後的 renderSongList（限制渲染筆數，避免大 DOM 卡頓） ---
function renderSongList() {
  const list = document.getElementById("songList");
  if (!list) return;
  
  if (!allSongs || allSongs.length === 0) {
    list.innerHTML = `<div class="empty">沒有找到符合的歌曲</div>`;
    return;
  }

  // 為了效能，預設只渲染前 100 筆
  const renderSongs = allSongs.slice(0, DISPLAY_LIMIT);

  let htmlContent = renderSongs.map(song => {
    const songNo = String(song.song_no || "");
    const isFavorite = favorites.includes(songNo);
    return `
      <div class="song">
        <div class="cover">🎤</div>
        <div class="song-info">
          <div class="song-title">[${escapeHtml(songNo)}] ${escapeHtml(song.title)}</div>
          <div class="artist">
            ${escapeHtml(song.artist)} • ${escapeHtml(song.language || "未分類")}
            ${song.category ? " • " + escapeHtml(song.category) : ""}
            ${song.brand ? " • " + escapeHtml(song.brand) : ""}
          </div>
        </div>
        <div class="song-actions">
          <button class="favorite ${isFavorite ? "active" : ""}" onclick="toggleFavorite('${escapeJs(songNo)}')">${isFavorite ? "♥" : "♡"}</button>
          <button class="add-btn" onclick="addSong('${escapeJs(songNo)}')">＋ 點歌</button>
        </div>
      </div>
    `;
  }).join("");

  if (allSongs.length > DISPLAY_LIMIT) {
    htmlContent += `<div style="text-align:center;padding:15px;color:#888;font-size:0.85rem;">顯示前 ${DISPLAY_LIMIT} 筆結果（共 ${allSongs.length} 筆），建議輸入更精確的關鍵字</div>`;
  }

  list.innerHTML = htmlContent;
}

async function addSong(songNo) {
  const tableInput = document.getElementById("tableNoInput");
  const tableVal = tableInput ? tableInput.value.trim() : "";
  if (!tableVal) {
    showToast("⚠️ 請先輸入您的桌號才能點歌！");
    if (tableInput) tableInput.focus();
    return;
  }

  const song = allSongs.find(s => String(s.song_no) === String(songNo));
  if (!song) return;

  const newItem = { 
    ...song, 
    queueId: Date.now() + Math.random(), 
    table_no: currentTableNo,
    added_at: Date.now() 
  };
  
  queue.push(newItem);
  saveQueue();
  renderQueue();
  showToast(`已點歌：${song.title}`);
  await syncQueueToServer();
}

async function addHistorySong(songNo, title, artist, brand, language) {
  const tableInput = document.getElementById("tableNoInput");
  const tableVal = tableInput ? tableInput.value.trim() : "";
  if (!tableVal) {
    showToast("⚠️ 請先輸入您的桌號才能點歌！");
    closeHistoryModal();
    if (tableInput) tableInput.focus();
    return;
  }

  const newItem = {
    song_no: songNo,
    title: title,
    artist: artist,
    brand: brand,
    language: language,
    queueId: Date.now() + Math.random(),
    table_no: currentTableNo,
    added_at: Date.now()
  };
  
  queue.push(newItem);
  saveQueue();
  renderQueue();
  showToast(`已從歷史歌單點歌：${title}`);
  await syncQueueToServer();
}

async function syncQueueToServer() {
  try {
    await apiPost({ action: "updateQueue", table_no: currentTableNo || "散客", queue });
  } catch (e) {}
}

function renderQueue() {
  const list = document.getElementById("queueList");
  const count = document.getElementById("queueCount");
  if (!list || !count) return;

  count.textContent = `${queue.length} 首`;

  if (queue.length === 0) {
    list.innerHTML = `<div class="empty">目前沒有待播歌曲<br>選擇歌曲開始點歌吧 🎤</div>`;
    return;
  }

  list.innerHTML = queue.map((song, index) => `
    <div class="song" style="display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
        <div class="queue-number">${index + 1}</div>
        <div class="cover">🎤</div>
        <div class="song-info" style="min-width:0;flex:1;">
          <div class="song-title">[${escapeHtml(song.song_no)}] ${escapeHtml(song.title)}</div>
          <div class="artist" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
            ${escapeHtml(song.artist)} • ${escapeHtml(song.language || "未分類")}
            ${song.brand ? " • " + escapeHtml(song.brand) : ""}
          </div>
        </div>
      </div>
      <div class="song-actions" style="margin-left:10px;">
        <button class="remove-btn" onclick="removeSong(${song.queueId})" style="padding:4px 8px;">×</button>
      </div>
    </div>
  `).join("");
}

async function removeSong(queueId) {
  queue = queue.filter(s => s.queueId !== queueId);
  saveQueue();
  renderQueue();
  await syncQueueToServer();
}

function saveQueue() {
  localStorage.setItem("ktvQueue", JSON.stringify(queue));
}

function playCurrent() {
  if (!currentSong && queue.length > 0) currentSong = queue[0];
  if (!currentSong) { showToast("沒有待播歌曲"); return; }
  const player = document.getElementById("audioPlayer");
  if (!player) return;
  player.src = currentSong.media || "";
  const titleEl = document.getElementById("currentTitle");
  const artistEl = document.getElementById("currentArtist");
  if (titleEl) titleEl.textContent = `[${currentSong.song_no}] ${currentSong.title}`;
  if (artistEl) artistEl.textContent = currentSong.artist;
  player.play().catch(() => showToast("播放失敗或無音樂檔"));
}

async function nextSong() {
  if (!queue.length) { showToast("沒有下一首"); return; }
  currentSong = queue.shift();
  saveQueue();
  renderQueue();
  playCurrent();
  await syncQueueToServer();
}

async function openHistory() {
  if (!currentCustomer) {
    showToast("請先選擇客戶");
    return;
  }

  const modal = document.getElementById("historyModal");
  if (modal) modal.classList.add("show");
  
  const nameEl = document.getElementById("historyCustomerName");
  if (nameEl) nameEl.textContent = `📜 客戶：${currentCustomer.name} 的歷史歌單`;
  
  const list = document.getElementById("historyList");
  if (!list) return;
  list.innerHTML = `<div class="empty">載入歷史歌單中...</div>`;

  try {
    const result = await apiGet({ action: "history", customer_id: currentCustomer.customer_id });
    if (!result.success) throw new Error(result.message);

    if (!result.data || result.data.length === 0) {
      list.innerHTML = `<div class="empty">此客戶目前沒有歷史歌單</div>`;
      return;
    }

    list.innerHTML = result.data.map(song => `
      <div class="song" style="display:flex;align-items:center;justify-content:space-between;margin:0 0 10px 0;">
        <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
          <div class="cover">📜</div>
          <div class="song-info" style="min-width:0;flex:1;">
            <div class="song-title">[${escapeHtml(song.song_no)}] ${escapeHtml(song.title)}</div>
            <div class="artist" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
              ${escapeHtml(song.artist)} • ${escapeHtml(song.language || "未分類")}
              ${song.brand ? " • " + escapeHtml(song.brand) : ""}
            </div>
          </div>
        </div>
        <div class="song-actions" style="margin-left:10px;">
          <button class="add-btn" onclick="addHistorySong('${escapeJs(song.song_no)}', '${escapeJs(song.title)}', '${escapeJs(song.artist)}', '${escapeJs(song.brand)}', '${escapeJs(song.language)}')">＋ 點歌</button>
        </div>
      </div>
    `).join("");
  } catch (error) {
    list.innerHTML = `<div class="empty">歷史歌單載入失敗</div>`;
  }
}

function closeHistoryModal() {
  const modal = document.getElementById("historyModal");
  if (modal) modal.classList.remove("show");
}

function openStaffModal() {
  const modal = document.getElementById("staffModal");
  if (modal) modal.classList.add("show");
  const authBox = document.getElementById("staffAuthBox");
  const contentBox = document.getElementById("staffContentBox");
  const pwdInput = document.getElementById("staffPasswordInput");
  if (authBox) authBox.style.display = "block";
  if (contentBox) contentBox.style.display = "none";
  if (pwdInput) pwdInput.value = "";
}

function closeStaffModal() {
  const modal = document.getElementById("staffModal");
  if (modal) modal.classList.remove("show");
}

async function verifyStaffPassword() {
  const pwdInput = document.getElementById("staffPasswordInput");
  const pwd = pwdInput ? pwdInput.value.trim() : "";
  try {
    const res = await apiGet({ action: "verifyStaffPassword", password: pwd });
    if (res.success) {
      const authBox = document.getElementById("staffAuthBox");
      const contentBox = document.getElementById("staffContentBox");
      if (authBox) authBox.style.display = "none";
      if (contentBox) contentBox.style.display = "block";
      loadStaffSummary();
      showToast("解鎖成功！");
    } else {
      showToast("密碼錯誤");
    }
  } catch (e) {
    showToast("驗證失敗");
  }
}

async function loadStaffSummary() {
  const box = document.getElementById("staffSummaryList");
  if (!box) return;
  box.innerHTML = `<div class="empty">載入中...</div>`;
  try {
    const res = await apiGet({ action: "getAllQueues" });
    if (!res.success || !res.data || !res.data.length) {
      box.innerHTML = `<div class="empty">目前全場無待播歌曲</div>`;
      return;
    }
    box.innerHTML = res.data.map(item => `
      <div class="customer-card" style="display:flex;justify-content:space-between;align-items:center;">
        <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;">
          <div class="cover" style="width:48px;height:48px;font-size:1.1rem;">🎤</div>
          <div style="min-width:0;flex:1;">
            <div style="color:#f59e0b;font-weight:bold;font-size:0.85rem;margin-bottom:2px;">桌號：${escapeHtml(item.table_no)}</div>
            <div class="customer-card-name" style="font-size:0.95rem;">[${escapeHtml(item.song_no)}] ${escapeHtml(item.title)}</div>
            <div class="customer-card-info" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
              ${escapeHtml(item.artist)} • ${escapeHtml(item.language || "未分類")}
              ${item.category ? " • " + escapeHtml(item.category) : ""}
              ${item.brand ? " • " + escapeHtml(item.brand) : ""}
            </div>
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0;margin-left:10px;">
          <button class="add-btn" onclick="staffAddQueue('${escapeJs(item.song_no)}', '${escapeJs(item.title)}', '${escapeJs(item.artist)}', '${escapeJs(item.brand || '')}', '${escapeJs(item.language || '')}', '${escapeJs(item.category || '')}', '${escapeJs(item.media || '')}')">＋ 播放</button>
          <button class="remove-btn" style="background:#39394d;color:#ff4d6d;width:38px;height:38px;border-radius:8px;" onclick="staffRemoveQueue('${escapeJs(item.table_no)}', '${escapeJs(item.song_no)}')">🗑️</button>
        </div>
      </div>
    `).join("");
  } catch (e) {
    box.innerHTML = `<div class="empty">載入總表失敗</div>`;
  }
}

async function staffRemoveQueue(tableNo, songNo) {
  if (!confirm(`確定要從「${tableNo}」的待播清單中刪除這首歌嗎？`)) return;
  try {
    const res = await apiPost({ action: "removeTableQueueSong", table_no: tableNo, song_no: songNo });
    if (res.success) {
      showToast("已成功刪除該首歌曲");
      loadStaffSummary();
    } else {
      showToast(res.message || "刪除失敗");
    }
  } catch (e) {
    showToast("刪除時發生錯誤");
  }
}

async function staffAddQueue(songNo, title, artist, brand, language, category, media) {
  queue.push({ 
    song_no: songNo, 
    title, 
    artist, 
    brand, 
    language, 
    category, 
    media, 
    queueId: Date.now() + Math.random(), 
    table_no: "點歌員新增",
    added_at: Date.now()
  });
  
  saveQueue();
  renderQueue();
  showToast(`已由總表加入：${title}`);
  await syncQueueToServer();
}

function openCustomerModal() {
  const modal = document.getElementById("customerModal");
  if (modal) modal.classList.add("show");
  const searchInput = document.getElementById("customerSearch");
  if (searchInput) searchInput.value = "";
  const results = document.getElementById("customerResults");
  if (results) results.innerHTML = `<div class="empty">請輸入客戶姓名</div>`;
  const createArea = document.getElementById("createCustomerArea");
  if (createArea) createArea.style.display = "none";
  cancelEditCustomer();
  setTimeout(() => {
    if (searchInput) searchInput.focus();
  }, 100);
}

function closeCustomerModal() {
  const modal = document.getElementById("customerModal");
  if (modal) modal.classList.remove("show");
}

async function searchCustomers(keyword) {
  const resultBox = document.getElementById("customerResults");
  if (!resultBox) return;
  resultBox.innerHTML = `<div class="empty">搜尋中...</div>`;

  try {
    const result = await apiGet({ action: "customers", q: keyword });
    if (!result.success) throw new Error(result.message);

    if (!result.data || result.data.length === 0) {
      resultBox.innerHTML = `<div class="empty">找不到「${escapeHtml(keyword)}」<br><br>可以按下方「新增客戶」</div>`;
      return;
    }

    resultBox.innerHTML = result.data.map(customer => `
      <div class="customer-card">
        <div style="min-width:0">
          <div class="customer-card-name">${escapeHtml(customer.name)}</div>
          <div class="customer-card-info">${customer.phone ? escapeHtml(customer.phone) : "未提供電話"} ${customer.note ? " • " + escapeHtml(customer.note) : ""}</div>
        </div>
        <div class="customer-actions">
          <button class="edit-customer" onclick="showEditCustomer('${escapeJs(customer.customer_id)}', '${escapeJs(customer.name)}', '${escapeJs(customer.phone || '')}', '${escapeJs(customer.note || '')}')">✏️ 編輯</button>
          <button class="select-customer" onclick="selectCustomer('${escapeJs(customer.customer_id)}', '${escapeJs(customer.name)}')">選擇</button>
        </div>
      </div>
    `).join("");
  } catch (error) {
    resultBox.innerHTML = `<div class="empty">客戶搜尋失敗</div>`;
  }
}

function showEditCustomer(id, name, phone, note) {
  editingCustomerId = id;
  const idEl = document.getElementById("editCustomerId");
  const nameEl = document.getElementById("editCustomerName");
  const phoneEl = document.getElementById("editCustomerPhone");
  const noteEl = document.getElementById("editCustomerNote");
  const editArea = document.getElementById("editCustomerArea");
  const createArea = document.getElementById("createCustomerArea");

  if (idEl) idEl.textContent = `編號：${id}`;
  if (nameEl) nameEl.value = name;
  if (phoneEl) phoneEl.value = (phone === "null" || phone === "undefined") ? "" : phone;
  if (noteEl) noteEl.value = (note === "null" || note === "undefined") ? "" : note;
  
  if (editArea) editArea.style.display = "block";
  if (createArea) createArea.style.display = "none";
}

function cancelEditCustomer() {
  editingCustomerId = null;
  const editArea = document.getElementById("editCustomerArea");
  if (editArea) editArea.style.display = "none";
}

async function updateCustomer() {
  if (!editingCustomerId) return;
  const nameEl = document.getElementById("editCustomerName");
  const phoneEl = document.getElementById("editCustomerPhone");
  const noteEl = document.getElementById("editCustomerNote");
  
  const name = nameEl ? nameEl.value.trim() : "";
  const phone = phoneEl ? phoneEl.value.trim() : "";
  const note = noteEl ? noteEl.value.trim() : "";

  if (!name) {
    showToast("客戶姓名不能為空");
    return;
  }

  try {
    const res = await apiPost({ action: "updateCustomer", customer_id: editingCustomerId, name, phone, note });
    if (res.success) {
      showToast("更新客戶成功！");
      cancelEditCustomer();
      const customerSearch = document.getElementById("customerSearch");
      const kw = customerSearch ? customerSearch.value.trim() : "";
      searchCustomers(kw);
    } else {
      showToast(res.message || "更新失敗");
    }
  } catch (e) {
    showToast("更新客戶發生錯誤");
  }
}

function updateCustomerUI() {
  const info = document.getElementById("customerInfo");
  const historyBtn = document.getElementById("historyBtn");
  const clearBtn = document.getElementById("clearCustomerBtn");
  if (!info) return;
  
  if (!currentCustomer) {
    info.textContent = "尚未選擇客戶";
    if (historyBtn) historyBtn.style.display = "none";
    if (clearBtn) clearBtn.style.display = "none";
    return;
  }
  info.innerHTML = `目前客戶：<span class="customer-name">${escapeHtml(currentCustomer.name)}</span>`;
  if (historyBtn) historyBtn.style.display = "inline-block";
  if (clearBtn) clearBtn.style.display = "inline-block";
}

function clearCustomer() {
  currentCustomer = null;
  localStorage.removeItem("currentCustomer");
  updateCustomerUI();
  showToast("已清除目前客戶");
}

function selectCustomer(id, name) {
  currentCustomer = { customer_id: id, name: name };
  localStorage.setItem("currentCustomer", JSON.stringify(currentCustomer));
  updateCustomerUI();
  closeCustomerModal();
  showToast(`已選擇客戶：${name}`);
}

function showCreateCustomer() {
  const area = document.getElementById("createCustomerArea");
  const editArea = document.getElementById("editCustomerArea");
  if (area) area.style.display = area.style.display === "none" ? "block" : "none";
  if (editArea) editArea.style.display = "none";
}

async function createCustomer() {
  const nameInput = document.getElementById("newCustomerName");
  const phoneInput = document.getElementById("newCustomerPhone");
  const noteInput = document.getElementById("newCustomerNote");

  const name = nameInput ? nameInput.value.trim() : "";
  const phone = phoneInput ? phoneInput.value.trim() : "";
  const note = noteInput ? noteInput.value.trim() : "";

  if (!name) {
    showToast("請輸入客戶姓名");
    return;
  }

  try {
    const res = await apiPost({ action: "createCustomer", name, phone, note });
    if (res.success) {
      showToast("新增客戶成功！");
      selectCustomer(res.customer_id, name);
      if (nameInput) nameInput.value = "";
      if (phoneInput) phoneInput.value = "";
      if (noteInput) noteInput.value = "";
      const createArea = document.getElementById("createCustomerArea");
      if (createArea) createArea.style.display = "none";
    } else {
      showToast(res.message || "新增失敗");
    }
  } catch (e) {
    showToast("新增客戶發生錯誤");
  }
}

function toggleFavorite(songNo) {
  if (favorites.includes(songNo)) favorites = favorites.filter(id => id !== songNo);
  else favorites.push(songNo);
  localStorage.setItem("ktvFavorites", JSON.stringify(favorites));
  renderSongList();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

function escapeHtml(str) {
  return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function escapeJs(str) {
  return String(str || "").replace(/'/g, "\\'");
}

async function endService() {
  if (!confirm("確定要結束本次服務？系統將自動把本次點歌紀錄存入歷史，並清空目前清單。")) return;

  if (currentCustomer && queue.length > 0) {
    try {
      showToast("正在自動儲存歷史歌單...");
      const historyRes = await apiPost({
        action: "saveHistory",
        customer_id: currentCustomer.customer_id,
        customer_name: currentCustomer.name,
        songs: queue
      });
      if (historyRes.success) {
        showToast("已成功將本次點歌紀錄存入客戶歷史！");
      }
    } catch (e) {}
  }

  queue = [];
  currentCustomer = null;
  currentTableNo = "";
  localStorage.removeItem("ktvQueue");
  localStorage.removeItem("currentCustomer");
  localStorage.removeItem("currentTableNo");
  
  const tableInput = document.getElementById("tableNoInput");
  if (tableInput) tableInput.value = "";
  
  renderQueue();
  updateCustomerUI();
  await syncQueueToServer();
  showToast("已結束本次服務並清空待播清單");
}
</script>
