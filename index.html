<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KTV 點歌系統 - 桌號管理與前台彙整</title>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
  <style>
    html { font-size: 130%; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background: radial-gradient(circle at top, #24104d 0%, #0b0b16 45%, #050509 100%);
      color: #fff;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: rgba(15, 15, 25, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 1.3rem;
      font-weight: bold;
      background: linear-gradient(135deg, #ff2bd6, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .customer-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .customer-info {
      font-size: 0.9rem;
      color: #aaa;
    }
    .customer-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .customer-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    main {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    .card {
      background: rgba(20, 20, 35, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
      margin-bottom: 20px;
    }
    .search-box {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 15px;
    }
    .search-box:focus {
      outline: none;
      border-color: #ff2bd6;
    }
    .song-list {
      max-height: 500px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .song {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      transition: background 0.2s;
    }
    .song:hover {
      background: rgba(255, 255, 255, 0.07);
    }
    .song-info {
      flex: 1;
      min-width: 0;
      margin-right: 15px;
    }
    .song-title {
      font-size: 1rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .artist {
      font-size: 0.85rem;
      color: #aaa;
    }
    .add-btn {
      background: linear-gradient(135deg, #ff2bd6, #7c3aed);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
    }
    .add-btn:hover {
      opacity: 0.9;
    }
    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
    }
    .queue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      border-left: 4px solid #ff2bd6;
    }
    .remove-btn {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 6px;
    }
    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
      font-size: 0.9rem;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal.show { display: flex; }
    .modal-box {
      background: #181824;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 25px;
      width: 90%;
      max-width: 450px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-title { font-size: 1.1rem; font-weight: bold; }
    .close-btn { background: none; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; }
    .modal-input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 15px;
    }
    .modal-input:focus { outline: none; border-color: #ff2bd6; }
    .primary-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #ff2bd6, #7c3aed);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🎤 KTV 點歌系統</div>
    <div class="customer-area">
      <div class="customer-info" id="customerInfo">尚未選擇客戶</div>
      <button class="customer-btn" onclick="openCustomerModal()">👤 選擇客戶／桌號</button>
      <button class="customer-btn" onclick="openManagerQueueModal()" style="border-color: #ff2bd6; color: #ff2bd6;">🔒 前台彙整歌單</button>
      <button class="customer-btn" id="clearCustomerBtn" style="display:none" onclick="clearCustomer()">清除</button>
    </div>
  </header>

  <main>
    <!-- 左側：點歌搜尋與列表 -->
    <section>
      <div class="card">
        <input type="text" class="search-box" id="searchInput" placeholder="輸入歌名、歌手或編號搜尋..." oninput="filterSongs()">
        <div class="song-list" id="songList">
          <div class="empty">正在載入歌曲庫...</div>
        </div>
      </div>
    </section>

    <!-- 右側：目前點歌清單 -->
    <section>
      <div class="card">
        <div style="font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
          <span>📋 已點待播清單</span>
          <span style="font-size: 0.8rem; color: #aaa;" id="queueCount">0 首</span>
        </div>
        <div class="queue-list" id="queueList">
          <div class="empty">目前沒有點歌</div>
        </div>
      </div>
    </section>
  </main>

  <!-- 客戶／桌號設定 Modal -->
  <div class="modal" id="customerModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">設定目前客戶與桌號</div>
        <button class="close-btn" onclick="closeCustomerModal()">×</button>
      </div>
      <input type="text" class="modal-input" id="inputCustomerName" placeholder="請輸入客戶／點歌人姓名...">
      <input type="text" class="modal-input" id="inputTableNo" placeholder="請輸入桌號或包廂（例如：A1、VIP包廂）...">
      <button class="primary-btn" onclick="saveCustomer()">確認並開始點歌</button>
    </div>
  </div>

  <!-- 🔒 前台管理員彙整歌單 Modal -->
  <div class="modal" id="managerQueueModal">
    <div class="modal-box" style="max-width: 800px;">
      <div class="modal-header">
        <div class="modal-title">🔒 前台管理員 - 待播歌單總覽</div>
        <button class="close-btn" onclick="closeManagerQueueModal()">×</button>
      </div>
      <div id="managerLoginArea">
        <div style="color: #aaa; font-size: 0.9rem; margin-bottom: 15px;">請輸入前台管理員密碼以檢視所有包廂／桌號的彙整清單：</div>
        <input type="password" class="modal-input" id="managerPasswordInput" placeholder="請輸入管理員密碼..." autocomplete="current-password">
        <button class="primary-btn" onclick="verifyManagerPassword()">登入檢視</button>
      </div>
      <div id="managerContentArea" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <div style="color: #aaa; font-size: 0.85rem;" id="managerQueueCount">總計 0 首待播</div>
          <button class="customer-btn" onclick="loadManagerQueue()">🔄 重新整理</button>
        </div>
        <div class="queue-list" id="managerQueueList" style="max-height: 500px; overflow-y: auto;">
          <div class="empty">載入中...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">提示訊息</div>

  <script>
    // 請確認此處的 GAS API 網址是否正確指向您的後端
    const API_URL = "https://script.google.com/macros/s/AKfycbzQp2B6XoJmB8T.../exec"; 

    let allSongs = [];
    let queue = [];
    let currentCustomer = null;
    const MANAGER_PASSWORD = "1234"; // 預設管理員密碼，可自行修改

    window.addEventListener("DOMContentLoaded", () => {
      loadSavedCustomer();
      loadQueueFromLocal();
      fetchSongs();
    });

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    function loadSavedCustomer() {
      const saved = localStorage.getItem("currentCustomer");
      if (saved) {
        try {
          currentCustomer = JSON.parse(saved);
          document.getElementById("customerInfo").textContent = `${currentCustomer.name} (${currentCustomer.tableNo || "散客"})`;
          document.getElementById("clearCustomerBtn").style.display = "inline-block";
        } catch (e) {
          currentCustomer = null;
        }
      }
    }

    function openCustomerModal() {
      document.getElementById("customerModal").classList.add("show");
      if (currentCustomer) {
        document.getElementById("inputCustomerName").value = currentCustomer.name || "";
        document.getElementById("inputTableNo").value = currentCustomer.tableNo || "";
      }
    }

    function closeCustomerModal() {
      document.getElementById("customerModal").classList.remove("show");
    }

    function saveCustomer() {
      const name = document.getElementById("inputCustomerName").value.trim();
      const tableNo = document.getElementById("inputTableNo").value.trim() || "散客區";
      if (!name) {
        showToast("請輸入客戶姓名");
        return;
      }
      currentCustomer = { name, tableNo, customer_id: "C_" + Date.now() };
      localStorage.setItem("currentCustomer", JSON.stringify(currentCustomer));
      document.getElementById("customerInfo").textContent = `${name} (${tableNo})`;
      document.getElementById("clearCustomerBtn").style.display = "inline-block";
      closeCustomerModal();
      showToast("客戶與桌號設定完成");
    }

    function clearCustomer() {
      localStorage.removeItem("currentCustomer");
      currentCustomer = null;
      document.getElementById("customerInfo").textContent = "尚未選擇客戶";
      document.getElementById("clearCustomerBtn").style.display = "none";
      showToast("已清除客戶資訊");
    }

    async function fetchSongs() {
      try {
        const res = await fetch(API_URL + "?action=songs");
        const data = await res.json();
        if (data.success && Array.isArray(data.songs)) {
          allSongs = data.songs;
          renderSongs(allSongs);
        } else {
          document.getElementById("songList").innerHTML = `<div class="empty">載入歌曲失敗</div>`;
        }
      } catch (e) {
        console.error(e);
        document.getElementById("songList").innerHTML = `<div class="empty">無法連線至伺服器</div>`;
      }
    }

    function renderSongs(songs) {
      const listEl = document.getElementById("songList");
      if (songs.length === 0) {
        listEl.innerHTML = `<div class="empty">沒有找到相關歌曲</div>`;
        return;
      }
      listEl.innerHTML = songs.slice(0, 100).map(song => `
        <div class="song">
          <div class="song-info">
            <div class="song-title">[${escapeHtml(song.song_no)}] ${escapeHtml(song.title)}</div>
            <div class="artist">${escapeHtml(song.artist || "未知歌手")}</div>
          </div>
          <button class="add-btn" onclick="addSong('${escapeJs(song.song_no)}')">點歌</button>
        </div>
      `).join("");
    }

    function filterSongs() {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      if (!keyword) {
        renderSongs(allSongs);
        return;
      }
      const filtered = allSongs.filter(s => 
        String(s.song_no).toLowerCase().includes(keyword) ||
        String(s.title).toLowerCase().includes(keyword) ||
        String(s.artist).toLowerCase().includes(keyword)
      );
      renderSongs(filtered);
    }

    async function addSong(songNo) {
      if (!currentCustomer) {
        showToast("請先設定客戶與桌號");
        openCustomerModal();
        return;
      }

      const song = allSongs.find(item => String(item.song_no) === String(songNo));
      if (!song) {
        showToast("找不到歌曲");
        return;
      }

      const newQueueItem = {
        ...song,
        queueId: Date.now() + Math.random(),
        tableNo: currentCustomer.tableNo,
        customerName: currentCustomer.name
      };

      queue.push(newQueueItem);
      saveQueueToLocal();
      renderQueue();
      showToast(`已點歌：${song.title}`);

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "updateQueue", queue })
        });
      } catch (e) {
        console.warn("後端同步失敗", e);
      }
    }

    function loadQueueFromLocal() {
      const saved = localStorage.getItem("ktvQueue");
      if (saved) {
        try { queue = JSON.parse(saved); } catch(e) { queue = []; }
      }
      renderQueue();
    }

    function saveQueueToLocal() {
      localStorage.setItem("ktvQueue", JSON.stringify(queue));
    }

    function renderQueue() {
      const listEl = document.getElementById("queueList");
      document.getElementById("queueCount").textContent = `${queue.length} 首`;

      if (queue.length === 0) {
        listEl.innerHTML = `<div class="empty">目前沒有點歌</div>`;
        return;
      }

      listEl.innerHTML = queue.map((song, index) => `
        <div class="queue-item">
          <div style="flex:1; min-width:0; margin-right: 10px;">
            <div style="font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
              <span style="color:#ff2bd6;">[${escapeHtml(song.tableNo || "散客")}]</span> ${escapeHtml(song.title)}
            </div>
            <div style="font-size: 0.75rem; color: #aaa;">${escapeHtml(song.artist)} · ${escapeHtml(song.customerName || "")}</div>
          </div>
          <button class="remove-btn" onclick="removeQueue(${song.queueId})">×</button>
        </div>
      `).join("");
    }

    async function removeQueue(queueId) {
      queue = queue.filter(item => item.queueId !== queueId);
      saveQueueToLocal();
      renderQueue();
      showToast("已從清單移除");

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "updateQueue", queue })
        });
      } catch (e) {}
    }

    function openManagerQueueModal() {
      document.getElementById("managerQueueModal").classList.add("show");
      document.getElementById("managerPasswordInput").value = "";
      document.getElementById("managerLoginArea").style.display = "block";
      document.getElementById("managerContentArea").style.display = "none";
      setTimeout(() => document.getElementById("managerPasswordInput").focus(), 100);
    }

    function closeManagerQueueModal() {
      document.getElementById("managerQueueModal").classList.remove("show");
    }

    function verifyManagerPassword() {
      const pwd = document.getElementById("managerPasswordInput").value;
      if (pwd === MANAGER_PASSWORD) {
        document.getElementById("managerLoginArea").style.display = "none";
        document.getElementById("managerContentArea").style.display = "block";
        loadManagerQueue();
      } else {
        showToast("❌ 密碼錯誤");
      }
    }

    async function loadManagerQueue() {
      const listEl = document.getElementById("managerQueueList");
      const countEl = document.getElementById("managerQueueCount");
      listEl.innerHTML = `<div class="empty">正在從伺服器彙整所有桌號歌單...</div>`;

      try {
        const res = await fetch(API_URL + "?action=getQueue");
        const data = await res.json();
        const allQueues = data.success && Array.isArray(data.queue) ? data.queue : queue;

        countEl.textContent = `總計 ${allQueues.length} 首待播`;

        if (allQueues.length === 0) {
          listEl.innerHTML = `<div class="empty">目前沒有任何待播歌曲</div>`;
          return;
        }

        listEl.innerHTML = allQueues.map((song, index) => `
          <div class="song" style="margin-bottom: 8px;">
            <div class="song-info">
              <div class="song-title">
                <span style="color:#ff2bd6; margin-right: 6px;">[${escapeHtml(song.tableNo || "散客")}]</span>
                [${escapeHtml(song.song_no)}] ${escapeHtml(song.title)}
              </div>
              <div class="artist">歌手：${escapeHtml(song.artist)} · 點歌人：${escapeHtml(song.customerName || "未知")}</div>
            </div>
            <div>
              <button class="add-btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="managerRemoveSong(${song.queueId})">移除</button>
            </div>
          </div>
        `).join("");
      } catch (e) {
        listEl.innerHTML = `<div class="empty">無法取得伺服器彙整歌單</div>`;
      }
    }

    async function managerRemoveSong(queueId) {
      queue = queue.filter(item => item.queueId !== queueId);
      saveQueueToLocal();
      renderQueue();
      loadManagerQueue();
      showToast("已從總清單移除");

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "updateQueue", queue })
        });
      } catch (e) {}
    }

    function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeJs(str) {
      return String(str || "").replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
  </script>
</body>
</html>
