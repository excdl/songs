<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KTV 點歌系統</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background: radial-gradient(circle at top, #24104d 0%, #0b0b16 45%, #050509 100%);
      color: #fff;
      min-height: 100vh;
    }
    header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      background: rgba(10, 10, 20, 0.92);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      background: linear-gradient(90deg, #ff2bd6, #8c5cff, #22d3ee);
      -webkit-background-clip: text;
      color: transparent;
    }
    .room-info {
      color: #aaa;
      font-size: 14px;
    }
    .room-code {
      color: #fff;
      font-weight: bold;
    }
    main {
      max-width: 1400px;
      margin: auto;
      padding: 25px;
    }
    .search-area {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }
    .search-box {
      flex: 1;
      position: relative;
    }
    .search-box input {
      width: 100%;
      height: 52px;
      border: 1px solid #38384c;
      border-radius: 14px;
      padding: 0 20px 0 48px;
      background: #151522;
      color: #fff;
      outline: none;
      font-size: 16px;
    }
    .search-box input:focus {
      border-color: #9b5cff;
      box-shadow: 0 0 0 3px rgba(155,92,255,0.15);
    }
    .search-icon {
      position: absolute;
      left: 18px;
      top: 15px;
      font-size: 20px;
      color: #999;
    }
    button {
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .search-btn {
      width: 100px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff2bd6, #734cff);
      color: white;
      font-weight: bold;
      font-size: 15px;
    }
    .search-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }
    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 25px;
      padding-bottom: 5px;
    }
    .category {
      flex-shrink: 0;
      padding: 9px 18px;
      border-radius: 30px;
      background: #171725;
      color: #aaa;
      border: 1px solid #2d2d3d;
    }
    .category.active {
      color: white;
      background: linear-gradient(135deg, #ff2bd6, #744cff);
      border-color: transparent;
    }
    .category:hover {
      color: white;
    }
    .content {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 25px;
    }
    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 18px;
    }
    .song-list {
      display: grid;
      gap: 12px;
    }
    .song {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(25,25,38,0.75);
      border-radius: 15px;
      transition: 0.2s;
    }
    .song:hover {
      background: #222235;
      transform: translateY(-1px);
    }
    .cover {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 25px;
      background: linear-gradient(135deg, #ff2bd6, #653eff);
    }
    .song-info {
      flex: 1;
      min-width: 0;
    }
    .song-title {
      font-size: 17px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .artist {
      color: #999;
      font-size: 14px;
      margin-top: 6px;
    }
    .song-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .favorite {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #292938;
      color: #aaa;
      font-size: 18px;
    }
    .favorite.active {
      color: #ff3e91;
    }
    .add-btn {
      padding: 10px 15px;
      border-radius: 10px;
      color: white;
      background: linear-gradient(135deg, #ff2bd6, #744cff);
      font-weight: bold;
    }
    .add-btn:hover {
      filter: brightness(1.15);
    }
    .queue-panel {
      background: rgba(18,18,29,0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 20px;
      height: fit-content;
      position: sticky;
      top: 95px;
    }
    .queue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .queue-count {
      color: #aaa;
      font-size: 13px;
    }
    .queue-list {
      display: grid;
      gap: 10px;
    }
    .queue-item {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 11px;
      border-radius: 12px;
      background: #20202e;
    }
    .queue-number {
      width: 28px;
      color: #8d7aff;
      font-weight: bold;
      text-align: center;
    }
    .queue-info {
      flex: 1;
      min-width: 0;
    }
    .queue-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
    }
    .queue-artist {
      font-size: 12px;
      color: #888;
      margin-top: 3px;
    }
    .remove-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      color: #888;
      background: transparent;
      font-size: 18px;
    }
    .remove-btn:hover {
      color: #ff4d7d;
      background: #30303d;
    }
    .empty {
      color: #777;
      text-align: center;
      padding: 30px 10px;
      font-size: 14px;
    }
    .player {
      margin-top: 18px;
      background: linear-gradient(135deg, #251040, #111126);
      border-radius: 16px;
      padding: 18px;
    }
    .now-playing {
      color: #aaa;
      font-size: 12px;
      margin-bottom: 5px;
    }
    .current-title {
      font-size: 17px;
      font-weight: bold;
    }
    .current-artist {
      font-size: 13px;
      color: #888;
      margin-top: 3px;
    }
    .player-controls {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }
    .control-btn {
      flex: 1;
      height: 40px;
      border-radius: 10px;
      background: #29293a;
      color: white;
    }
    .control-btn:hover {
      background: #3a3a50;
    }
    .play-btn {
      background: linear-gradient(135deg, #ff2bd6, #744cff);
    }
    .volume {
      width: 100%;
      margin-top: 12px;
    }
    .volume input {
      width: 100%;
    }
    audio {
      width: 100%;
      margin-top: 12px;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(20px);
      background: #242435;
      color: white;
      padding: 12px 20px;
      border-radius: 30px;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
      z-index: 999;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    @media (max-width: 900px) {
      .content { grid-template-columns: 1fr; }
      .queue-panel { position: static; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🎤 KTV 點歌系統</div>
  <div class="room-info">包廂：<span class="room-code">A-208</span></div>
</header>

<main>
  <!-- 搜尋列 -->
  <div class="search-area">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="輸入歌名、歌手或編號搜尋...">
    </div>
    <button class="search-btn" onclick="fetchSongs()">搜尋</button>
  </div>

  <!-- 分類篩選 -->
  <div class="categories">
    <button class="category active" onclick="filterLanguage('全部', this)">全部</button>
    <button class="category" onclick="filterLanguage('國語', this)">國語</button>
    <button class="category" onclick="filterLanguage('台語', this)">台語</button>
    <button class="category" onclick="filterLanguage('粵語', this)">粵語</button>
    <button class="category" onclick="filterLanguage('英文', this)">英文</button>
    <button class="category" onclick="filterLanguage('日文', this)">日文</button>
  </div>

  <div class="content">
    <!-- 歌曲列表 -->
    <section>
      <div class="section-title">🎵 雲端歌曲列表</div>
      <div class="song-list" id="songList">
        <div class="empty">載入中...</div>
      </div>
    </section>

    <!-- 點歌佇列與播放器 -->
    <aside class="queue-panel">
      <div class="queue-header">
        <div class="section-title">📋 待播歌曲</div>
        <div class="queue-count" id="queueCount">0 首</div>
      </div>
      <div class="queue-list" id="queueList"></div>

      <div class="player">
        <div class="now-playing">NOW PLAYING</div>
        <div class="current-title" id="currentTitle">尚未播放</div>
        <div class="current-artist" id="currentArtist">-</div>
        <audio id="audioPlayer" controls></audio>
        <div class="player-controls">
          <button class="control-btn play-btn" onclick="playCurrent()">▶ 播放</button>
          <button class="control-btn" onclick="nextSong()">⏭ 下一首</button>
        </div>
        <div class="volume">
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
    </aside>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  // 請替換成您 Google Apps Script 部署後的網頁應用程式 URL
  const API_URL = "https://script.google.com/macros/s/AKfycbxrHrgoJjFsFgo2Ejd_OzBu0XhyUa_FRM8aymA1uWQrCUk4CaFAirN3_G-mR4nPuI3n/exec";

  let allSongs = [];
  let currentLanguage = "全部";

  let queue = JSON.parse(localStorage.getItem("ktvQueue")) || [];
  let favorites = JSON.parse(localStorage.getItem("ktvFavorites")) || [];
  let currentSong = null;

  // 初始化
  window.addEventListener("DOMContentLoaded", () => {
    fetchSongs();
    renderQueue();
  });

  // 從 Google 試算表 API 取得資料
  async function fetchSongs() {
    const keyword = document.getElementById("searchInput").value.trim();
    const url = `${API_URL}?q=${encodeURIComponent(keyword)}`;

    try {
      const response = await fetch(url);
      const result = await response.json();

      if (result.success) {
        allSongs = result.data.map((item, index) => ({
          id: index + 1,
          song_no: item.song_no,
          title: item.title,
          artist: item.artist,
          language: item.language,
          category: item.category,
          brand: item.brand,
          status: item.status,
          media: `music/${item.title}.mp3` // 可依實際音樂檔案路徑調整
        }));
        renderSongList();
      } else {
        showToast("取得歌單失敗");
      }
    } catch (error) {
      console.error("API 連線錯誤:", error);
      showToast("無法連線至雲端歌單");
    }
  }

  // 渲染歌曲列表（包含前端語言分類過濾）
  function renderSongList() {
    const list = document.getElementById("songList");

    const filtered = allSongs.filter(song => {
      const matchLanguage = (currentLanguage === "全部" || song.language === currentLanguage);
      return matchLanguage;
    });

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty">找不到符合的歌曲</div>`;
      return;
    }

    list.innerHTML = filtered.map(song => {
      const isFavorite = favorites.includes(song.song_no);
      return `
        <div class="song">
          <div class="cover">🎤</div>
          <div class="song-info">
            <div class="song-title">[${song.song_no}] ${song.title}</div>
            <div class="artist">${song.artist} · ${song.language || '未分類'} (${song.brand || ''})</div>
          </div>
          <div class="song-actions">
            <button class="favorite ${isFavorite ? "active" : ""}" onclick="toggleFavorite('${song.song_no}')">
              ${isFavorite ? "♥" : "♡"}
            </button>
            <button class="add-btn" onclick="addSong('${song.song_no}')">＋ 點歌</button>
          </div>
        </div>
      `;
    }).join("");
  }

  // 語言分類切換
  function filterLanguage(language, button) {
    currentLanguage = language;
    document.querySelectorAll(".category").forEach(btn => btn.classList.remove("active"));
    button.classList.add("active");
    renderSongList();
  }

  // 搜尋框即時監聽（輸入時自動呼叫 API 查詢）
  let searchTimer;
  document.getElementById("searchInput").addEventListener("input", function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      fetchSongs();
    }, 400);
  });

  // 點歌功能
  function addSong(songNo) {
    const song = allSongs.find(s => String(s.song_no) === String(songNo));
    if (!song) return;

    queue.push({
      ...song,
      queueId: Date.now() + Math.random()
    });

    saveQueue();
    renderQueue();
    showToast(`已點歌：${song.title}`);
  }

  // 渲染待播清單
  function renderQueue() {
    const list = document.getElementById("queueList");
    const count = document.getElementById("queueCount");
    count.textContent = `${queue.length} 首`;

    if (queue.length === 0) {
      list.innerHTML = `<div class="empty">目前沒有待播歌曲<br>選擇歌曲開始點歌吧 🎤</div>`;
      return;
    }

    list.innerHTML = queue.map((song, index) => `
      <div class="queue-item">
        <div class="queue-number">${index + 1}</div>
        <div class="queue-info">
          <div class="queue-title">[${song.song_no}] ${song.title}</div>
          <div class="queue-artist">${song.artist}</div>
        </div>
        <button class="remove-btn" onclick="removeSong(${song.queueId})">×</button>
      </div>
    `).join("");
  }

  // 移除佇列歌曲
  function removeSong(queueId) {
    queue = queue.filter(song => song.queueId !== queueId);
    saveQueue();
    renderQueue();
    showToast("已移除歌曲");
  }

  // 播放目前歌曲
  function playCurrent() {
    if (!currentSong) {
      if (queue.length === 0) {
        showToast("目前沒有待播歌曲");
        return;
      }
      currentSong = queue[0];
    }

    const player = document.getElementById("audioPlayer");
    player.src = currentSong.media;
    document.getElementById("currentTitle").textContent = `[${currentSong.song_no}] ${currentSong.title}`;
    document.getElementById("currentArtist").textContent = currentSong.artist;

    player.play().catch(() => {
      showToast("找不到音樂檔案，請確認 media 路徑");
    });
  }

  // 下一首
  function nextSong() {
    if (queue.length === 0) {
      currentSong = null;
      document.getElementById("currentTitle").textContent = "尚未播放";
      document.getElementById("currentArtist").textContent = "-";
      document.getElementById("audioPlayer").removeAttribute("src");
      showToast("沒有下一首歌曲");
      return;
    }

    currentSong = queue.shift();
    saveQueue();
    renderQueue();
    playCurrent();
  }

  // 播放完畢自動下一首
  document.getElementById("audioPlayer").addEventListener("ended", () => {
    nextSong();
  });

  // 音量控制
  document.getElementById("volume").addEventListener("input", function() {
    document.getElementById("audioPlayer").volume = this.value;
  });

  // 收藏切換
  function toggleFavorite(songNo) {
    if (favorites.includes(songNo)) {
      favorites = favorites.filter(item => item !== songNo);
      showToast("已取消收藏");
    } else {
      favorites.push(songNo);
      showToast("已加入收藏");
    }
    localStorage.setItem("ktvFavorites", JSON.stringify(favorites));
    renderSongList();
  }

  function saveQueue() {
    localStorage.setItem("ktvQueue", JSON.stringify(queue));
  }

  let toastTimer;
  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 2000);
  }
</script>

</body>
</html>
